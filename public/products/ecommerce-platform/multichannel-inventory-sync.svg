 y2="446" stroke="#9333ea" stroke-width="2" marker-end="url(#arrA)"/><rect x="1066" y="396" width="300" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="1090" y="434" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Marketplace A</text><text x="1090" y="464" font-size="13.5" font-weight="700" fill="#7e22ce" text-anchor="start">Shows 63</text><rect x="1267" y="446" width="75" height="24" rx="12" fill="#f1f5f9" /><text x="1304.5" y="462" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">Buffer 5</text><line x1="884" y1="395" x2="1060" y2="574" stroke="#9333ea" stroke-width="2" marker-end="url(#arrA)"/><rect x="1066" y="524" width="300" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="1090" y="562" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Marketplace B</text><text x="1090" y="592" font-size="13.5" font-weight="700" fill="#7e22ce" text-anchor="start">Shows 63</text><rect x="1267" y="574" width="75" height="24" rx="12" fill="#f1f5f9" /><text x="1304.5" y="590" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">Buffer 5</text><line x1="884" y1="395" x2="1060" y2="702" stroke="#9333ea" stroke-width="2" marker-end="url(#arrA)"/><rect x="1066" y="652" width="300" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="1090" y="690" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Social shop</text><text x="1090" y="720" font-size="13.5" font-weight="700" fill="#7e22ce" text-anchor="start">Shows 58</text><rect x="1260" y="702" width="82" height="24" rx="12" fill="#f1f5f9" /><text x="1301" y="718" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">Buffer 10</text><rect x="70" y="660" width="810" height="190" rx="16" fill="#fff" stroke="#e2e8f0" filter="url(#sh)"/><text x="98" y="700" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">What happens when an order arrives</text><circle cx="104" cy="738" r="4" fill="#9333ea"/><text x="118" y="743" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">10:42:18  Marketplace A order #MA-88231 · 1 pair</text><circle cx="104" cy="766" r="4" fill="#9333ea"/><text x="118" y="771" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">10:42:18  Stock reserved at 3PL West (closest to customer)</text><circle cx="104" cy="794" r="4" fill="#9333ea"/><text x="118" y="799" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">10:42:19  Available 68 → 67, pushed to all 5 channels</text><circle cx="104" cy="822" r="4" fill="#9333ea"/><text x="118" y="827" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">10:42:20  Order routed to 3PL West for picking</text><text x="1066" y="820" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Channel buffers hold back units to prevent</text><text x="1066" y="840" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">overselling on slower-syncing channels.</text>
