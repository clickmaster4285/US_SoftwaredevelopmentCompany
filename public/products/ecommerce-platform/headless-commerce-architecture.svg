<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Headless commerce architecture diagram with commerce APIs serving a website, mobile app, marketplace feeds and in-store screens" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Headless commerce architecture diagram with commerce APIs serving a website, mobile app, marketplace feeds and in-store screens</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2a0b3d" flood-opacity="0.16"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9333ea" stop-opacity="0.22"/><stop offset="1" stop-color="#9333ea" stop-opacity="0"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9333ea"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#faf5ff" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Headless commerce: one back office, any front end</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Architecture concept · services and channels are examples</text><rect x="60" y="130" width="240" height="96" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="180" y="172" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Website</text><text x="180" y="198" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Next.js storefront</text><line x1="180" y1="230" x2="180" y2="300" stroke="#9333ea" stroke-width="2" marker-end="url(#arrA)"/><rect x="328" y="130" width="240" height="96" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="448" y="172" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Mobile app</text><text x="448" y="198" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">iOS and Android</text><line x1="448" y1="230" x2="448" y2="300" stroke="#9333ea" stroke-width="2" marker-end="url(#arrA)"/><rect x="596" y="130" width="240" height="96" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="716" y="172" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Marketplace feeds</text><text x="716" y="198" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Listings and orders</text><line x1="716" y1="230" x2="716" y2="300" stroke="#9333ea" stroke-width="2" marker-end="url(#arrA)"/><rect x="864" y="130" width="240" height="96" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="984" y="172" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">In-store screens</text><text x="984" y="198" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Endless aisle, kiosks</text><line x1="984" y1="230" x2="984" y2="300" stroke="#9333ea" stroke-width="2" marker-end="url(#arrA)"/><rect x="1132" y="130" width="240" height="96" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="1252" y="172" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">B2B portal</text><text x="1252" y="198" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Company buyers</text><line x1="1252" y1="230" x2="1252" y2="300" stroke="#9333ea" stroke-width="2" marker-end="url(#arrA)"/><rect x="60" y="306" width="1312" height="78" rx="14" fill="#f3e8ff" stroke="#d8b4fe"/><text x="716" y="340" font-size="17" font-weight="700" fill="#7e22ce" text-anchor="middle">Commerce APIs (REST / GraphQL)</text><text x="716" y="364" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Catalog · Search · Cart · Checkout · Customers · Orders · Promotions · Content</text><rect x="60" y="410" width="1312" height="250" rx="18" fill="#2a0b3d" filter="url(#sh2)"/><text x="90" y="448" font-size="17" font-weight="700" fill="#fff" text-anchor="start">StoreStack commerce back office</text><rect x="90" y="474" width="296" height="68" rx="12" fill="#ffffff14" /><text x="238" y="514" font-size="14.5" font-weight="700" fill="#e9d5ff" text-anchor="middle">Product info (PIM)</text><rect x="408" y="474" width="296" height="68" rx="12" fill="#ffffff14" /><text x="556" y="514" font-size="14.5" font-weight="700" fill="#e9d5ff" text-anchor="middle">Pricing &amp; promotions</text><rect x="726" y="474" width="296" height="68" rx="12" fill="#ffffff14" /><text x="874" y="514" font-size="14.5" font-weight="700" fill="#e9d5ff" text-anchor="middle">Inventory</text><rect x="1044" y="474" width="296" height="68" rx="12" fill="#ffffff14" /><text x="1192" y="514" font-size="14.5" font-weight="700" fill="#e9d5ff" text-anchor="middle">Orders &amp; returns</text><rect x="90" y="560" width="296" height="68" rx="12" fill="#ffffff14" /><text x="238" y="600" font-size="14.5" font-weight="700" fill="#e9d5ff" text-anchor="middle">Customers &amp; B2B</text><rect x="408" y="560" width="296" height="68" rx="12" fill="#ffffff14" /><text x="556" y="600" font-size="14.5" font-weight="700" fill="#e9d5ff" text-anchor="middle">Subscriptions</text><rect x="726" y="560" width="296" height="68" rx="12" fill="#ffffff14" /><text x="874" y="600" font-size="14.5" font-weight="700" fill="#e9d5ff" text-anchor="middle">Content</text><rect x="1044" y="560" width="296" height="68" rx="12" fill="#ffffff14" /><text x="1192" y="600" font-size="14.5" font-weight="700" fill="#e9d5ff" text-anchor="middle">Analytics</text><line x1="180" y1="664" x2="180" y2="724" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="60" y="730" width="240" height="96" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="180" y="772" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Payments</text><text x="180" y="798" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Gateways, wallets</text><line x1="448" y1="664" x2="448" y2="724" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="328" y="730" width="240" height="96" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="448" y="772" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Tax</text><text x="448" y="798" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Rate calculation</text><line x1="716" y1="664" x2="716" y2="724" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="596" y="730" width="240" height="96" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="716" y="772" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Shipping</text><text x="716" y="798" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Carriers, 3PL</text><line x1="984" y1="664" x2="984" y2="724" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="864" y="730" width="240" height="96" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="984" y="772" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">ERP</text><text x="984" y="798" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Finance, purchasing</text><line x1="1252" y1="664" x2="1252" y2="724" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="1132" y="730" width="240" height="96" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="1252" y="772" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Email &amp; SMS</text><text x="1252" y="798" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Journeys</text><text x="716" y="862" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Front ends change without touching order logic; each part scales independently.</text>
</svg>
