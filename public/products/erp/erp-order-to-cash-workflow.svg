<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Order-to-cash workflow in ERP software from sales order to inventory reservation, shipment, invoice and general ledger posting" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Order-to-cash workflow in ERP software from sales order to inventory reservation, shipment, invoice and general ledger posting</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b1733" flood-opacity="0.14"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb" stop-opacity="0.24"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
<linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff"/><text x="600" y="52" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Order-to-cash in one ERP system</text><text x="600" y="82" font-size="14.5" font-weight="500" fill="#64748b" text-anchor="middle">Each step hands clean data to the next. Nobody re-keys the order.</text><rect x="50" y="150" width="196" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><circle cx="84" cy="188" r="18" fill="#7c3aed"/><text x="84" y="194" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="70" y="240" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Sales order</text><text x="70" y="264" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Rep, portal or ecommerce</text><line x1="250" y1="225" x2="272" y2="225" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrA)"/><line x1="148" y1="302" x2="148" y2="356" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr)"/><rect x="62" y="366" width="172" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="148" y="386" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Order lines</text><rect x="62" y="406" width="172" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="148" y="426" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Customer pricing</text><rect x="276" y="150" width="196" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><circle cx="310" cy="188" r="18" fill="#2563eb"/><text x="310" y="194" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="296" y="240" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Credit + stock</text><text x="296" y="264" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Credit limit checked</text><line x1="476" y1="225" x2="498" y2="225" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrA)"/><line x1="374" y1="302" x2="374" y2="356" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr)"/><rect x="288" y="366" width="172" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="374" y="386" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Stock reserved</text><rect x="288" y="406" width="172" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="374" y="426" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">ATP updated</text><rect x="502" y="150" width="196" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><circle cx="536" cy="188" r="18" fill="#10b981"/><text x="536" y="194" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="522" y="240" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Pick &amp; ship</text><text x="522" y="264" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Pick list to warehouse</text><line x1="702" y1="225" x2="724" y2="225" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrA)"/><line x1="600" y1="302" x2="600" y2="356" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr)"/><rect x="514" y="366" width="172" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="600" y="386" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Inventory relieved</text><rect x="514" y="406" width="172" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="600" y="426" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Tracking number</text><rect x="728" y="150" width="196" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><circle cx="762" cy="188" r="18" fill="#f59e0b"/><text x="762" y="194" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="748" y="240" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Invoice</text><text x="748" y="264" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Triggered by shipment</text><line x1="928" y1="225" x2="950" y2="225" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrA)"/><line x1="826" y1="302" x2="826" y2="356" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr)"/><rect x="740" y="366" width="172" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="826" y="386" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">AR open item</text><rect x="740" y="406" width="172" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="826" y="426" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Customer emailed</text><rect x="954" y="150" width="196" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><circle cx="988" cy="188" r="18" fill="#0891b2"/><text x="988" y="194" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="974" y="240" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">GL posting</text><text x="974" y="264" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Automatic journal</text><line x1="1052" y1="302" x2="1052" y2="356" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr)"/><rect x="966" y="366" width="172" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1052" y="386" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Revenue + COGS</text><rect x="966" y="406" width="172" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="1052" y="426" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Dashboards update</text><text x="600" y="466" font-size="10.5" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1.3">RECORDS UPDATED IN THE SHARED DATABASE AT EACH STEP</text><rect x="80" y="486" width="1040" height="1" rx="0" fill="#e2e8f0"/><text x="100" y="558" font-size="16" font-weight="700" fill="#f59e0b" text-anchor="start">Procure-to-pay</text><rect x="300" y="530" width="124.19999999999999" height="44" rx="22" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="362.1" y="557" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Requisition</text><line x1="428.2" y1="552" x2="454.2" y2="552" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrA)"/><rect x="458.2" y="530" width="148.79999999999998" height="44" rx="22" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="532.6" y="557" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Purchase order</text><line x1="611" y1="552" x2="637" y2="552" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrA)"/><rect x="641" y="530" width="91.39999999999999" height="44" rx="22" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="686.7" y="557" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Receipt</text><line x1="736.4" y1="552" x2="762.4" y2="552" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrA)"/><rect x="766.4" y="530" width="124.19999999999999" height="44" rx="22" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="828.5" y="557" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Vendor bill</text><line x1="894.5999999999999" y1="552" x2="920.5999999999999" y2="552" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrA)"/><rect x="924.5999999999999" y="530" width="91.39999999999999" height="44" rx="22" fill="#f59e0b" stroke="#f59e0b" stroke-width="1.5"/><text x="970.3" y="557" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Payment</text><text x="100" y="668" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start">Record-to-report</text><rect x="300" y="640" width="132.39999999999998" height="44" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="366.2" y="667" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Transactions</text><line x1="436.4" y1="662" x2="462.4" y2="662" stroke="#2563eb" stroke-width="2" marker-end="url(#arrA)"/><rect x="466.4" y="640" width="157" height="44" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="544.9" y="667" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Reconciliations</text><line x1="627.4" y1="662" x2="653.4" y2="662" stroke="#2563eb" stroke-width="2" marker-end="url(#arrA)"/><rect x="657.4" y="640" width="75" height="44" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="694.9" y="667" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Close</text><line x1="736.4" y1="662" x2="762.4" y2="662" stroke="#2563eb" stroke-width="2" marker-end="url(#arrA)"/><rect x="766.4" y="640" width="198" height="44" rx="22" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><text x="865.4" y="667" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Financial statements</text><text x="600" y="786" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">The same pattern runs through purchasing and the month-end close.</text>
</svg>
