<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Diagram of an ERP system with finance, inventory, procurement, sales, HR and manufacturing modules sharing one central database" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Diagram of an ERP system with finance, inventory, procurement, sales, HR and manufacturing modules sharing one central database</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b1733" flood-opacity="0.14"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb" stop-opacity="0.24"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
<linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff"/><text x="600" y="52" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">One ERP system, one shared database</text><text x="600" y="82" font-size="14.5" font-weight="500" fill="#64748b" text-anchor="middle">Every module reads and writes the same master data and transactions</text><circle cx="600" cy="450" r="275" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="4 8"/><line x1="600" y1="340" x2="600" y2="245" stroke="#2563eb" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)" opacity="0.8"/><rect x="495" y="139" width="210" height="72" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="495" y="139" width="6" height="72" rx="3" fill="#2563eb"/><text x="603" y="172" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Finance</text><text x="603" y="192" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle">GL · AP · AR · close</text><line x1="693.8197778961636" y1="381.4161217955393" x2="760.275453905946" y2="322.18459061895965" stroke="#10b981" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)" opacity="0.8"/><rect x="710.0036576787082" y="242.54030448884828" width="210" height="72" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="710.0036576787082" y="242.54030448884828" width="6" height="72" rx="3" fill="#10b981"/><text x="818.0036576787082" y="275.5403044888483" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Inventory</text><text x="818.0036576787082" y="295.5403044888483" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle">Stock · lots · valuation</text><line x1="716.9913494618188" y1="474.4773027351946" x2="799.8602219972738" y2="495.61679146104444" stroke="#f59e0b" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)" opacity="0.8"/><rect x="763.1051758500015" y="475.19325683798644" width="210" height="72" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="763.1051758500015" y="475.19325683798644" width="6" height="72" rx="3" fill="#f59e0b"/><text x="871.1051758500015" y="508.19325683798644" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Procurement</text><text x="871.1051758500015" y="528.1932568379864" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle">Requisitions · POs</text><line x1="652.0660486941069" y1="549.1065754692661" x2="688.9461665190994" y2="634.698617919996" stroke="#7c3aed" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)" opacity="0.8"/><rect x="614.3180282573285" y="661.7664386731652" width="210" height="72" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="614.3180282573285" y="661.7664386731652" width="6" height="72" rx="3" fill="#7c3aed"/><text x="722.3180282573285" y="694.7664386731652" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Sales</text><text x="722.3180282573285" y="714.7664386731652" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle">Quotes · orders · invoices</text><line x1="547.9339513058931" y1="549.1065754692661" x2="511.0538334809006" y2="634.698617919996" stroke="#db2777" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)" opacity="0.8"/><rect x="375.6819717426715" y="661.7664386731652" width="210" height="72" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="375.6819717426715" y="661.7664386731652" width="6" height="72" rx="3" fill="#db2777"/><text x="483.6819717426715" y="694.7664386731652" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">HR &amp; payroll</text><text x="483.6819717426715" y="714.7664386731652" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle">People · cost allocation</text><line x1="483.0086505381812" y1="474.4773027351946" x2="400.1397780027262" y2="495.6167914610445" stroke="#0891b2" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)" opacity="0.8"/><rect x="226.8948241499985" y="475.1932568379865" width="210" height="72" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="226.8948241499985" y="475.1932568379865" width="6" height="72" rx="3" fill="#0891b2"/><text x="334.8948241499985" y="508.1932568379865" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Manufacturing</text><text x="334.8948241499985" y="528.1932568379865" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle">BOMs · MRP · work orders</text><line x1="506.1802221038364" y1="381.4161217955393" x2="439.72454609405384" y2="322.18459061895965" stroke="#334155" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)" opacity="0.8"/><rect x="279.99634232129176" y="242.54030448884834" width="210" height="72" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="279.99634232129176" y="242.54030448884834" width="6" height="72" rx="3" fill="#334155"/><text x="387.99634232129176" y="275.54030448884834" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Reporting</text><text x="387.99634232129176" y="295.54030448884834" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle">Dashboards · KPIs · BI</text><g filter="url(#sh2)"><path d="M490 380 v140 a110 30 0 0 0 220 0 v-140" fill="url(#core)"/><ellipse cx="600" cy="380" rx="110" ry="30" fill="#60a5fa"/></g><path d="M490 430 a110 30 0 0 0 220 0 M490 475 a110 30 0 0 0 220 0" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.7"/><text x="600" y="448" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Central database</text><text x="600" y="500" font-size="12" font-weight="600" fill="#dbeafe" text-anchor="middle">Customers · vendors · items</text><text x="600" y="518" font-size="12" font-weight="600" fill="#dbeafe" text-anchor="middle">accounts · locations · employees</text><text x="600" y="800" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Master data is defined once. A sales order reserves stock, triggers the pick and posts to the ledger without re-keying.</text>
</svg>
