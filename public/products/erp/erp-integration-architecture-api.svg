<rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff"/><text x="600" y="52" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">ERP integration architecture</text><text x="600" y="82" font-size="14.5" font-weight="500" fill="#64748b" text-anchor="middle">Systems connect through documented APIs, with retries, monitoring and clear data ownership</text><ellipse cx="600" cy="450" rx="235" ry="150" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="600" y="332" font-size="11.5" font-weight="800" fill="#2563eb" text-anchor="middle" letter-spacing="1.5">API &amp; EVENT LAYER</text><rect x="407.8" y="425" width="54.4" height="28" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/><text x="435" y="444" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">REST</text><rect x="726.4" y="425" width="77.19999999999999" height="28" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/><text x="765" y="444" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">GraphQL</text><rect x="395.6" y="535" width="198.79999999999998" height="28" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/><text x="495" y="554" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">Event streaming (Kafka)</text><rect x="651.2" y="535" width="107.6" height="28" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/><text x="705" y="554" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">File / SFTP</text><rect x="505" y="380" width="190" height="120" rx="22" fill="url(#core)" filter="url(#sh2)"/><text x="600" y="432" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">ERP core</text><text x="600" y="458" font-size="12" font-weight="600" fill="#dbeafe" text-anchor="middle">Finance · inventory · orders</text><text x="600" y="478" font-size="12" font-weight="600" fill="#dbeafe" text-anchor="middle">purchasing · HR · reports</text><line x1="256.06407854988237" y1="193.686389