olution</text><text x="250" y="454" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">design</text><text x="250" y="478" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Modules,</text><text x="250" y="494" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">data model, security</text><circle cx="390" cy="330" r="22" fill="#fff" stroke="#7c3aed" stroke-width="4" filter="url(#sh2)"/><text x="390" y="336" font-size="16" font-weight="800" fill="#7c3aed" text-anchor="middle">3</text><line x1="390" y1="268" x2="390" y2="306" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3 4"/><rect x="324" y="150" width="132" height="118" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="324" y="150" width="132" height="6" rx="3" fill="#7c3aed"/><text x="390" y="194" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">UI/UX design</text><text x="390" y="228" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Screens tested with users</text><circle cx="530" cy="330" r="22" fill="#fff" stroke="#db2777" stroke-width="4" filter="url(#sh2)"/><text x="530" y="336" font-size="16" font-weight="800" fill="#db2777" text-anchor="middle">4</text><line x1="530" y1="354" x2="530" y2="400" stroke="#db2777" stroke-width="2" stroke-dasharray="3 4"/><rect x="464" y="400" width="132" height="118" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="464" y="400" width="132" height="6" rx="3" fill="#db2777"/><text x="530" y="436" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Phased</text><text x="530" y="454" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">development</text><text x="530" y="478" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">2-week sprints,</text><text x="530" y="494" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">demos</text><text x="530" y=