"470" y="585" width="400" height="44" rx="22" fill="#db2777" opacity="0.12"/><text x="670" y="613" font-size="14" font-weight="700" fill="#db2777" text-anchor="middle">Build</text><rect x="890" y="585" width="260" height="44" rx="22" fill="#0891b2" opacity="0.12"/><text x="1020" y="613" font-size="14" font-weight="700" fill="#0891b2" text-anchor="middle">Launch &amp; improve</text><rect x="140" y="668" width="920" height="96" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="600" y="702" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Scope is fixed per phase. New requests go to a backlog for later releases.</text><text x="600" y="730" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Roll out by module or location, with a parallel run for critical processes.</text>
