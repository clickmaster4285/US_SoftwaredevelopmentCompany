a" text-anchor="start">1 parcel · 14 × 10 × 8 in</text><text x="98" y="436" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Actual weight</text><rect x="320" y="414" width="502" height="36" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="336" y="438" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">4.2 lb</text><text x="98" y="488" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Dimensional weight</text><rect x="320" y="466" width="502" height="36" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="336" y="490" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">6.75 lb (L×W×H ÷ 166)</text><text x="98" y="540" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Chargeable weight</text><rect x="320" y="518" width="502" height="36" rx="8" fill="#ffe4e6" stroke="#e2e8f0"/><text x="336" y="542" font-size="13.5" font-weight="700" fill="#9f1239" text-anchor="start">7 lb (rounded up)</text><text x="98" y="592" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">COD amount</text><rect x="320" y="570" width="502" height="36" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="336" y="594" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">$89.00</text><text x="98" y="652" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Service level</text><rect x="98" y="668" width="232" height="74" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/><text x="114" y="698" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Same-day</text><text x="114" y="724" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">$24.90</text><rect x="342" y="668" width="232" height="74" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/><text x="358" y="698" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Next-day</text><text x="358" y="724" font-size="15" font-weight="700" fill="#9f1239" text-anchor="start">$13.80