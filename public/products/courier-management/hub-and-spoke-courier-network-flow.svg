<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Hub and spoke courier network flow from first-mile pickup to origin hub, linehaul, destination hub and last-mile delivery" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Hub and spoke courier network flow from first-mile pickup to origin hub, linehaul, destination hub and last-mile delivery</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2a0a12" flood-opacity="0.16"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#be123c" stop-opacity="0.22"/><stop offset="1" stop-color="#be123c" stop-opacity="0"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#fff1f2" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Hub and spoke: how a parcel moves through the network</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Parcel SL 7742 1903 58 · Springfield → Riverton · next-day · placeholder data</text><rect x="90" y="150" width="380" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="90" y="150" width="380" height="8" rx="4" fill="#1d4ed8" /><circle cx="130" cy="202" r="20" fill="#1d4ed8"/><text x="130" y="208" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="164" y="208" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Booking</text><text x="114" y="260" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">Merchant portal · 10:42 AM</text><text x="114" y="290" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Waybill printed</text><rect x="114" y="316" width="109" height="24" rx="12" fill="#dbeafe" /><text x="168.5" y="332" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Scan recorded</text><rect x="530" y="150" width="380" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="530" y="150" width="380" height="8" rx="4" fill="#6d28d9" /><circle cx="570" cy="202" r="20" fill="#6d28d9"/><text x="570" y="208" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="604" y="208" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">First-mile pickup</text><text x="554" y="260" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">Rider K. Hale · 1:15 PM</text><text x="554" y="290" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Scanned at merchant</text><rect x="554" y="316" width="109" height="24" rx="12" fill="#ede9fe" /><text x="608.5" y="332" font-size="11.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Scan recorded</text><rect x="970" y="150" width="380" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="970" y="150" width="380" height="8" rx="4" fill="#b45309" /><circle cx="1010" cy="202" r="20" fill="#b45309"/><text x="1010" y="208" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="1044" y="208" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Origin hub</text><text x="994" y="260" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">Central Hub · 3:02 PM</text><text x="994" y="290" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Scanned in, sorted to bag E-21-014</text><rect x="994" y="316" width="109" height="24" rx="12" fill="#fef3c7" /><text x="1048.5" y="332" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">Scan recorded</text><rect x="970" y="470" width="380" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="970" y="470" width="380" height="8" rx="4" fill="#c2410c" /><circle cx="1010" cy="522" r="20" fill="#c2410c"/><text x="1010" y="528" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1044" y="528" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Linehaul</text><text x="994" y="580" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">Truck E-21 · evening run 6:00 PM</text><text x="994" y="610" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Manifest of 64 bags</text><rect x="994" y="636" width="109" height="24" rx="12" fill="#ffedd5" /><text x="1048.5" y="652" font-size="11.5" font-weight="700" fill="#c2410c" text-anchor="middle">Scan recorded</text><rect x="530" y="470" width="380" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="530" y="470" width="380" height="8" rx="4" fill="#0f766e" /><circle cx="570" cy="522" r="20" fill="#0f766e"/><text x="570" y="528" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="604" y="528" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Destination hub</text><text x="554" y="580" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">East Hub · 10:40 PM</text><text x="554" y="610" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Bag opened, sorted to route R-12</text><rect x="554" y="636" width="109" height="24" rx="12" fill="#ccfbf1" /><text x="608.5" y="652" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle">Scan recorded</text><rect x="90" y="470" width="380" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="90" y="470" width="380" height="8" rx="4" fill="#059669" /><circle cx="130" cy="522" r="20" fill="#059669"/><text x="130" y="528" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="164" y="528" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Last mile</text><text x="114" y="580" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start">Rider M. Diaz · 11:26 AM next day</text><text x="114" y="610" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Delivered · COD $89 collected</text><rect x="114" y="636" width="82" height="24" rx="12" fill="#d1fae5" /><text x="155" y="652" font-size="11.5" font-weight="700" fill="#059669" text-anchor="middle">Delivered</text><line x1="472" y1="260" x2="528" y2="260" stroke="#be123c" stroke-width="2" marker-end="url(#arrA)"/><line x1="912" y1="260" x2="968" y2="260" stroke="#be123c" stroke-width="2" marker-end="url(#arrA)"/><path d="M1280 372 C1340 410 1340 430 1280 466" stroke="#be123c" stroke-width="2.5" fill="none" marker-end="url(#arrA)"/><line x1="968" y1="580" x2="912" y2="580" stroke="#be123c" stroke-width="2" marker-end="url(#arrA)"/><line x1="528" y1="580" x2="472" y2="580" stroke="#be123c" stroke-width="2" marker-end="url(#arrA)"/><rect x="90" y="730" width="1260" height="120" rx="14" fill="#ffe4e6" /><text x="118" y="768" font-size="16" font-weight="700" fill="#9f1239" text-anchor="start">Every arrow is a scan.</text><text x="118" y="798" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">Each handover (merchant to rider, rider to hub, hub to truck, truck to hub, hub to rider, rider to recipient) is scanned, so the tracking page always</text><text x="118" y="820" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">shows the last confirmed location and the system can flag parcels that miss an expected scan.</text>
</svg>
