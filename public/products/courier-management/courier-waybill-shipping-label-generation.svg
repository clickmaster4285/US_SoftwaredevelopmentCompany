0000000014" y="514" width="3.2" height="120" rx="0" fill="#0f172a" /><rect x="496.40000000000015" y="514" width="3.2" height="120" rx="0" fill="#0f172a" /><rect x="511.20000000000016" y="514" width="9.600000000000001" height="120" rx="0" fill="#0f172a" /><rect x="529.2000000000002" y="514" width="3.2" height="120" rx="0" fill="#0f172a" /><rect x="544.0000000000001" y="514" width="6.4" height="120" rx="0" fill="#0f172a" /><rect x="558.8000000000001" y="514" width="9.600000000000001" height="120" rx="0" fill="#0f172a" /><rect x="576.8000000000001" y="514" width="6.4" height="120" rx="0" fill="#0f172a" /><rect x="591.6" y="514" width="3.2" height="120" rx="0" fill="#0f172a" /><text x="420" y="664" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">SL 7742 1903 58</text><line x1="120" y1="686" x2="720" y2="686" stroke="#0f172a"/><text x="144" y="720" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Weight</text><text x="144" y="742" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">7 lb chargeable</text><text x="434" y="720" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Pieces</text><text x="434" y="742" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">1 of 1</text><text x="144" y="766" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Booked</text><text x="144" y="788" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Nov 17 · 10:42 AM</text><text x="434" y="766" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Ref</text><text x="434" y="788" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Order #MC-48812</text><rect x="144" y="804" width="552" height="40" rx="6" fill="#ffe4e6" /><text x="420" y="830" font-size="18" font-weight="700" fill="#9f1239" text-anchor="middle">COLLECT ON DELIVERY  $89.00</text><rect x="790" y="130" width="580" height="730" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="818" y="170" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">What the waybill carries through the network</text><circle cx="830" cy="216" r="9" fill="#ffe4e6"/><text x="830" y="220" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">1</text><text x="850" y="221" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Tracking number</text><text x="850" y="244" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Unique ID scanned at every handover and shown on the</text><text x="850" y="262" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">tracking page</text><circle cx="830" cy="294" r="9" fill="#ffe4e6"/><text x="830" y="298" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">2</text><text x="850" y="299" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Barcode</text><text x="850" y="322" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Read by handheld and fixed scanners at pickup, hubs and</text><text x="850" y="340" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">delivery</text><circle cx="830" cy="372" r="9" fill="#ffe4e6"/><text x="830" y="376" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">3</text><text x="850" y="377" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Destination hub and route</text><text x="850" y="400" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Printed for fast manual sorting when scanners are busy</text><circle cx="830" cy="450" r="9" fill="#ffe4e6"/><text x="830" y="454" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">4</text><text x="850" y="455" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Service level</text><text x="850" y="478" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Next-day badge drives sorting priority and the delivery</text><text x="850" y="496" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">promise</text><circle cx="830" cy="528" r="9" fill="#ffe4e6"/><text x="830" y="532" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">5</text><text x="850" y="533" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Chargeable weight</text><text x="850" y="556" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Booked value, verified against the hub scale</text><circle cx="830" cy="606" r="9" fill="#ffe4e6"/><text x="830" y="610" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">6</text><text x="850" y="611" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">COD amount</text><text x="850" y="634" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Collected by the rider, reconciled and remitted to the</text><text x="850" y="652" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">merchant</text><circle cx="830" cy="684" r="9" fill="#ffe4e6"/><text x="830" y="688" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">7</text><text x="850" y="689" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Merchant reference</text><text x="850" y="712" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Links the parcel to the merchant's order for support</text><circle cx="830" cy="762" r="9" fill="#ffe4e6"/><text x="830" y="766" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">8</text><text x="850" y="767" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Masked phone</text><text x="850" y="790" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Recipient contact visible to the rider only in the app</text>
</svg>
