<rect x="0" y="0" width="1440" height="900" rx="0" fill="#fff5f6" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Automated messages around one booking</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Reformer Pilates · Thu 9:30 AM · member: S. Ahmed · placeholder data</text><line x1="120" y1="200" x2="1320" y2="200" stroke="#e2e8f0" stroke-width="4"/><circle cx="140" cy="200" r="14" fill="#e11d48"/><circle cx="140" cy="200" r="5" fill="#fff"/><text x="140" y="170" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Booked</text><text x="140" y="240" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Mon 9:12 AM</text><circle cx="372" cy="200" r="14" fill="#1d4ed8"/><circle cx="372" cy="200" r="5" fill="#fff"/><text x="372" y="170" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Confirmation</text><text x="372" y="240" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Mon 9:12 AM</text><circle cx="604" cy="200" r="14" fill="#b45309"/><circle cx="604" cy="200" r="5" fill="#fff"/><text x="604" y="170" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">24h reminder</text><text x="604" y="240" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Wed 9:30 AM</text><circle cx="836" cy="200" r="14" fill="#6d28d9"/><circle cx="836" cy="200" r="5" fill="#fff"/><text x="836" y="170" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">1h reminder</text><text x="836" y="240" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Thu 8:30 AM</text><circle cx="1068" cy="200" r="14" fill="#059669"/><circle cx="1068" cy="200" r="5" fill="#fff"/><text x="1068" y="170" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Checked in</text><text x="1068" y="240" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Thu 9:24 AM</text><circle cx="1300" cy="200" r="14" fill="#0f766e"/><circle cx="1300" cy="200" r="5" fill="#fff"/><text x="1300" y="170" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Follow-up</text><text x="1300" y="240" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Thu 11:00 AM</text><rect x="60" y="300" width="400" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="80" y="320" width="55" height="24" rx="12" fill="#dbeafe" /><text x="107.5" y="336" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">EMAIL</text><text x="80" y="380" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">You're booked: Reformer Pilates</text><text x="80" y="410" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Thu Nov 26 · 9:30 AM · Reformer 6</text><text x="80" y="432" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Coach: Priya S. · 1 credit used</text><text x="80" y="454" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Free cancel until Thu 1:30 AM</text><text x="80" y="476" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">[ Add to calendar ]   [ Manage booking ]</text><rect x="520" y="300" width="400" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="540" y="320" width="42" height="24" rx="12" fill="#fef3c7" /><text x="561" y="336" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">SMS</text><text x="540" y="380" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Reminder: class tomorrow</text><text x="540" y="410" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Northside Fitness: Reformer Pilates</text><text x="540" y="432" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">tomorrow at 9:30 AM. Can't make it?</text><text x="540" y="454" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Cancel by 1:30 AM to keep your credit.</text><text x="540" y="476" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Reply C to cancel.</text><rect x="980" y="300" width="400" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="1000" y="320" width="49" height="24" rx="12" fill="#ede9fe" /><text x="1024.5" y="336" font-size="11.5" font-weight="700" fill="#6d28d9" text-anchor="middle">PUSH</text><text x="1000" y="380" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Starts in 1 hour</text><text x="1000" y="410" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Reformer Pilates · 9:30 AM</text><text x="1000" y="432" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Reformer 6 is ready for you.</text><text x="1000" y="454" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Tap to show your check-in QR code.</text><text x="1000" y="476" font-size="13" font-weight="500" fill="#64748b" text-anchor="start"></text><rect x="60" y="560" width="400" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="80" y="580" width="49" height="24" rx="12" fill="#ffe4e6" /><text x="104.5" y="596" font-size="11.5" font-weight="700" fill="#e11d48" text-anchor="middle">PUSH</text><text x="80" y="640" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">A spot opened up!</text><text x="80" y="670" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Rhythm Ride · Wed 6:00 AM</text><text x="80" y="692" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">You're first on the waitlist.</text><text x="80" y="714" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Claim it within 60 minutes.</text><text x="80" y="736" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">[ Claim spot ]</text><rect x="520" y="560" width="400" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="540" y="580" width="55" height="24" rx="12" fill="#fee2e2" /><text x="567.5" y="596" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">EMAIL</text><text x="540" y="640" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Class change: new instructor</text><text x="540" y="670" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Vinyasa Flow · Tue 6:45 PM</text><text x="540" y="692" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Ana K. is covering for Elena V.</text><text x="540" y="714" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Your booking stays the same.</text><text x="540" y="736" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">[ Keep booking ]   [ Cancel free ]</text><rect x="980" y="560" width="400" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="1000" y="580" width="55" height="24" rx="12" fill="#ccfbf1" /><text x="1027.5" y="596" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle">EMAIL</text><text x="1000" y="640" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">How was your first class?</text><text x="1000" y="670" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Thanks for riding with us, M. Chen.</text><text x="1000" y="692" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Book your next class this week</text><text x="1000" y="714" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">with the intro offer: 2 of 3 left.</text><text x="1000" y="736" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">[ Book next class ]</text><text x="720" y="858" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Channels and message timing are configured per business. SMS and push require chosen providers.</text>
</svg>
