<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Waitlist and cancellation workflow where a cancelled spot is offered to the next waitlisted member automatically" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Waitlist and cancellation workflow where a cancelled spot is offered to the next waitlisted member automatically</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2a0a14" flood-opacity="0.16"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e11d48" stop-opacity="0.22"/><stop offset="1" stop-color="#e11d48" stop-opacity="0"/></linearGradient>
<linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a0a14"/><stop offset="1" stop-color="#e11d48"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e11d48"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#fff5f6" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">How a cancelled spot is refilled from the waitlist</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Reformer Pilates · Wed 9:30 AM · capacity 10 · placeholder data</text><rect x="70" y="150" width="236" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="110" cy="194" r="22" fill="#059669"/><text x="110" y="201" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="90" y="250" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Member cancels</text><text x="90" y="278" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">K. Lee cancels at 6:10 PM</text><text x="90" y="298" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Tue, before the 8-hour</text><text x="90" y="318" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">cutoff.</text><rect x="90" y="364" width="122" height="24" rx="12" fill="#d1fae5" /><text x="151" y="380" font-size="11.5" font-weight="700" fill="#059669" text-anchor="middle">Credit returned</text><line x1="310" y1="280" x2="332" y2="280" stroke="#e11d48" stroke-width="2" marker-end="url(#arrA)"/><rect x="336" y="150" width="236" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="376" cy="194" r="22" fill="#1d4ed8"/><text x="376" y="201" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="356" y="250" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Spot opens</text><text x="356" y="278" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Class drops to 9/10. The</text><text x="356" y="298" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">system checks the waitlist</text><text x="356" y="318" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">instantly.</text><rect x="356" y="364" width="109" height="24" rx="12" fill="#dbeafe" /><text x="410.5" y="380" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">9 / 10 booked</text><line x1="576" y1="280" x2="598" y2="280" stroke="#e11d48" stroke-width="2" marker-end="url(#arrA)"/><rect x="602" y="150" width="236" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="642" cy="194" r="22" fill="#b45309"/><text x="642" y="201" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="622" y="250" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Offer sent</text><text x="622" y="278" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">First in line, J. Patel,</text><text x="622" y="298" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">gets push + SMS: claim</text><text x="622" y="318" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">within 60 min.</text><rect x="622" y="364" width="162" height="24" rx="12" fill="#fef3c7" /><text x="703" y="380" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">Offer expires 7:10 PM</text><line x1="842" y1="280" x2="864" y2="280" stroke="#e11d48" stroke-width="2" marker-end="url(#arrA)"/><rect x="868" y="150" width="236" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="908" cy="194" r="22" fill="#e11d48"/><text x="908" y="201" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="888" y="250" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Spot claimed</text><text x="888" y="278" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">J. Patel accepts in the</text><text x="888" y="298" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">app. A credit is deducted.</text><rect x="888" y="364" width="115" height="24" rx="12" fill="#ffe4e6" /><text x="945.5" y="380" font-size="11.5" font-weight="700" fill="#e11d48" text-anchor="middle">10 / 10 booked</text><line x1="1108" y1="280" x2="1130" y2="280" stroke="#e11d48" stroke-width="2" marker-end="url(#arrA)"/><rect x="1134" y="150" width="236" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="1174" cy="194" r="22" fill="#6d28d9"/><text x="1174" y="201" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1154" y="250" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Roster updated</text><text x="1154" y="278" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Instructor roster and</text><text x="1154" y="298" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">waitlist positions refresh</text><text x="1154" y="318" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">for everyone.</text><rect x="1154" y="364" width="115" height="24" rx="12" fill="#ede9fe" /><text x="1211.5" y="380" font-size="11.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Waitlist now 2</text><rect x="70" y="450" width="640" height="400" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="98" y="488" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Waitlist · Reformer Pilates Wed 9:30 AM</text><line x1="98" y1="508" x2="682" y2="508" stroke="#f1f5f9"/><circle cx="118" cy="536" r="15" fill="#e11d48"/><text x="118" y="540.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">JP</text><text x="146" y="532" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">J. Patel</text><text x="146" y="551" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Claimed spot · 6:24 PM</text><rect x="620" y="524" width="62" height="24" rx="12" fill="#d1fae5" /><text x="651" y="540" font-size="11.5" font-weight="700" fill="#059669" text-anchor="middle">Booked</text><line x1="98" y1="580" x2="682" y2="580" stroke="#f1f5f9"/><circle cx="118" cy="608" r="15" fill="#0891b2"/><text x="118" y="612.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">SA</text><text x="146" y="604" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">S. Ahmed</text><text x="146" y="623" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Position 1 · auto-offer next</text><rect x="613" y="596" width="69" height="24" rx="12" fill="#fef3c7" /><text x="647.5" y="612" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">Waiting</text><line x1="98" y1="652" x2="682" y2="652" stroke="#f1f5f9"/><circle cx="118" cy="680" r="15" fill="#7c3aed"/><text x="118" y="684.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">RB</text><text x="146" y="676" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">R. Brown</text><text x="146" y="695" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Position 2</text><rect x="613" y="668" width="69" height="24" rx="12" fill="#fef3c7" /><text x="647.5" y="684" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">Waiting</text><line x1="98" y1="724" x2="682" y2="724" stroke="#f1f5f9"/><circle cx="118" cy="752" r="15" fill="#d97706"/><text x="118" y="756.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">NT</text><text x="146" y="748" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">N. Torres</text><text x="146" y="767" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Left waitlist · booked Thu</text><rect x="613" y="740" width="69" height="24" rx="12" fill="#f1f5f9" /><text x="647.5" y="756" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">Removed</text><rect x="740" y="450" width="630" height="400" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="768" y="488" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Waitlist rules</text><text x="768" y="530" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Promotion mode</text><rect x="1080" y="508" width="262" height="34" rx="8" fill="#fff5f6" stroke="#e2e8f0"/><text x="1094" y="530" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Offer to next in line</text><text x="768" y="580" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Claim window</text><rect x="1080" y="558" width="262" height="34" rx="8" fill="#fff5f6" stroke="#e2e8f0"/><text x="1094" y="580" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">60 minutes</text><text x="768" y="630" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Stop offering</text><rect x="1080" y="608" width="262" height="34" rx="8" fill="#fff5f6" stroke="#e2e8f0"/><text x="1094" y="630" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">2 hours before class</text><text x="768" y="680" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Max waitlist size</text><rect x="1080" y="658" width="262" height="34" rx="8" fill="#fff5f6" stroke="#e2e8f0"/><text x="1094" y="680" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">8 members</text><text x="768" y="730" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Notify by</text><rect x="1080" y="708" width="262" height="34" rx="8" fill="#fff5f6" stroke="#e2e8f0"/><text x="1094" y="730" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Push + SMS</text><text x="768" y="780" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Credit charged</text><rect x="1080" y="758" width="262" height="34" rx="8" fill="#fff5f6" stroke="#e2e8f0"/><text x="1094" y="780" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Only when the spot is claimed</text>
</svg>
