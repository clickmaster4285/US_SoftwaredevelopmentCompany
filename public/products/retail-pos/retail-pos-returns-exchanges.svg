<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Retail POS returns and exchanges workflow with receipt lookup, return reasons, refund to original tender and store credit" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Retail POS returns and exchanges workflow with receipt lookup, return reasons, refund to original tender and store credit</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#083344" flood-opacity="0.16"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0891b2" stop-opacity="0.22"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0891b2"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#ecfeff" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Returns and exchanges at the point of sale</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Receipt lookup, policy check and refund to the original tender · placeholder data</text><rect x="70" y="130" width="236" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="104" cy="166" r="17" fill="#1d4ed8"/><text x="104" y="172" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="132" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Find the sale</text><text x="90" y="214" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Scan the receipt or look up</text><text x="90" y="233" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">by card, phone or email</text><line x1="308" y1="205" x2="332" y2="205" stroke="#0891b2" stroke-width="2" marker-end="url(#arrA)"/><rect x="336" y="130" width="236" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="370" cy="166" r="17" fill="#6d28d9"/><text x="370" y="172" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="398" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Check the policy</text><text x="356" y="214" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Within 30 days, tags</text><text x="356" y="233" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">attached, not final sale</text><line x1="574" y1="205" x2="598" y2="205" stroke="#0891b2" stroke-width="2" marker-end="url(#arrA)"/><rect x="602" y="130" width="236" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="636" cy="166" r="17" fill="#b45309"/><text x="636" y="172" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="664" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Pick a reason</text><text x="622" y="214" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Wrong size, defective,</text><text x="622" y="233" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">changed mind</text><line x1="840" y1="205" x2="864" y2="205" stroke="#0891b2" stroke-width="2" marker-end="url(#arrA)"/><rect x="868" y="130" width="236" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="902" cy="166" r="17" fill="#0891b2"/><text x="902" y="172" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="930" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Refund or exchange</text><text x="888" y="214" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Original tender, store</text><text x="888" y="233" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">credit or new item</text><line x1="1106" y1="205" x2="1130" y2="205" stroke="#0891b2" stroke-width="2" marker-end="url(#arrA)"/><rect x="1134" y="130" width="236" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="1168" cy="166" r="17" fill="#059669"/><text x="1168" y="172" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1196" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Restock</text><text x="1154" y="214" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Item back to sellable or</text><text x="1154" y="233" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">damaged stock</text><rect x="70" y="310" width="790" height="550" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="98" y="348" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Original receipt #D2-118842 · Oct 31 · Downtown</text><text x="832" y="348" font-size="12" font-weight="500" fill="#64748b" text-anchor="end">Paid by Visa ending 1124</text><line x1="98" y1="374" x2="832" y2="374" stroke="#f1f5f9"/><text x="98" y="404" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Merino crew sweater · Navy · M</text><text x="560" y="404" font-size="14" font-weight="500" fill="#0f172a" text-anchor="start">$98.00</text><rect x="697" y="388" width="135" height="24" rx="12" fill="#dbeafe" /><text x="764.5" y="404" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Exchange → size L</text><line x1="98" y1="438" x2="832" y2="438" stroke="#f1f5f9"/><text x="98" y="468" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Canvas sneaker · White · 9</text><text x="560" y="468" font-size="14" font-weight="500" fill="#0f172a" text-anchor="start">$72.00</text><rect x="657" y="452" width="175" height="24" rx="12" fill="#fee2e2" /><text x="744.5" y="468" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Return · defective sole</text><line x1="98" y1="502" x2="832" y2="502" stroke="#f1f5f9"/><text x="98" y="532" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Stoneware mug set · Slate</text><text x="560" y="532" font-size="14" font-weight="500" fill="#0f172a" text-anchor="start">$46.00</text><rect x="783" y="516" width="49" height="24" rx="12" fill="#f1f5f9" /><text x="807.5" y="532" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">Keep</text><line x1="98" y1="566" x2="832" y2="566" stroke="#f1f5f9"/><text x="98" y="596" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Clearance scarf · Rust</text><text x="560" y="596" font-size="14" font-weight="500" fill="#0f172a" text-anchor="start">$18.00</text><rect x="630" y="580" width="202" height="24" rx="12" fill="#fef3c7" /><text x="731" y="596" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">Final sale · not returnable</text><line x1="98" y1="642" x2="832" y2="642" stroke="#e2e8f0"/><text x="98" y="676" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Refund to Visa ending 1124</text><text x="832" y="676" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="end">$72.00 + tax $5.94</text><text x="98" y="710" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Exchange: sweater M → L</text><text x="832" y="710" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="end">Even exchange · $0.00</text><text x="98" y="744" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Restock</text><text x="832" y="744" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="end">Sweater M → sellable · sneaker → damaged</text><rect x="98" y="790" width="230" height="44" rx="22" fill="#0891b2" /><text x="213" y="818" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Complete return</text><rect x="884" y="310" width="486" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="912" y="348" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Return policy rules</text><text x="912" y="390" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Return window</text><text x="1342" y="390" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">30 days (holiday: Jan 15)</text><text x="912" y="432" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Receipt required</text><text x="1342" y="432" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">Or lookup by card/phone</text><text x="912" y="474" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">No receipt</text><text x="1342" y="474" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">Store credit at lowest price</text><text x="912" y="516" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Final sale items</text><text x="1342" y="516" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">Not returnable</text><text x="912" y="558" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Manager approval</text><text x="1342" y="558" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">Over $250 or 3+ returns/90 days</text><rect x="884" y="634" width="486" height="226" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="912" y="672" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Return reasons · last 30 days</text><text x="912" y="712" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Wrong size</text><rect x="1040" y="702" width="240" height="12" rx="6" fill="#f1f5f9" /><rect x="1040" y="702" width="220.8" height="12" rx="6" fill="#0891b2" /><text x="1342" y="713" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">46%</text><text x="912" y="750" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Changed mind</text><rect x="1040" y="740" width="240" height="12" rx="6" fill="#f1f5f9" /><rect x="1040" y="740" width="115.19999999999999" height="12" rx="6" fill="#67e8f9" /><text x="1342" y="751" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">24%</text><text x="912" y="788" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Defective</text><rect x="1040" y="778" width="240" height="12" rx="6" fill="#f1f5f9" /><rect x="1040" y="778" width="86.39999999999999" height="12" rx="6" fill="#67e8f9" /><text x="1342" y="789" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">18%</text><text x="912" y="826" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Other</text><rect x="1040" y="816" width="240" height="12" rx="6" fill="#f1f5f9" /><rect x="1040" y="816" width="57.599999999999994" height="12" rx="6" fill="#67e8f9" /><text x="1342" y="827" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">12%</text>
</svg>
