<rect x="0" y="0" width="1440" height="900" rx="0" fill="#ecfeff" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">One inventory, every channel</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">How the POS, online store and stores share stock, orders and customers · placeholder data</text><rect x="560" y="360" width="320" height="180" rx="20" fill="#083344" filter="url(#sh2)"/><text x="720" y="412" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Retail POS platform</text><text x="720" y="446" font-size="13.5" font-weight="500" fill="#a5f3fc" text-anchor="middle">Real-time inventory</text><text x="720" y="472" font-size="13.5" font-weight="500" fill="#a5f3fc" text-anchor="middle">Customer profiles &amp; loyalty</text><text x="720" y="498" font-size="13.5" font-weight="500" fill="#a5f3fc" text-anchor="middle">Orders, returns &amp; gift cards</text><rect x="90" y="140" width="320" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="114" y="180" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Online store</text><circle cx="120" cy="212" r="4" fill="#0891b2"/><text x="132" y="217" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Live stock by store</text><circle cx="120" cy="242" r="4" fill="#0891b2"/><text x="132" y="247" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">BOPIS at checkout</text><line x1="410" y1="215" x2="560" y2="390" stroke="#0891b2" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)"/><rect x="1030" y="140" width="320" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="1054" y="180" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Store registers</text><circle cx="1060" cy="212" r="4" fill="#0891b2"/><text x="1072" y="217" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Checkout &amp; returns</text><circle cx="1060" cy="242" r="4" fill="#0891b2"/><text x="1072" y="247" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Gift cards &amp; loyalty</text><line x1="1030" y1="215" x2="880" y2="390" stroke="#0891b2" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)"/><rect x="90" y="620" width="320" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="114" y="660" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Mobile POS</text><circle cx="120" cy="692" r="4" fill="#0891b2"/><text x="132" y="697" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Endless aisle</text><circle cx="120" cy="722" r="4" fill="#0891b2"/><text x="132" y="727" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Line busting</text><line x1="410" y1="695" x2="560" y2="510" stroke="#0891b2" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)"/><rect x="1030" y="620" width="320" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="1054" y="660" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Warehouse / 3PL</text><circle cx="1060" cy="692" r="4" fill="#0891b2"/><text x="1072" y="697" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Ship-to-home orders</text><circle cx="1060" cy="722" r="4" fill="#0891b2"/><text x="1072" y="727" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Replenishment</text><line x1="1030" y1="695" x2="880" y2="510" stroke="#0891b2" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)"/><rect x="160" y="820" width="1120" height="44" rx="12" fill="#cffafe" /><text x="720" y="848" font-size="13" font-weight="600" fill="#0e7490" text-anchor="middle">Example: an online order for pickup reserves the item at Downtown, the associate gets a pick task, and the customer gets a text when it's ready.</text>
