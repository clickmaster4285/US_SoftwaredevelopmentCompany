ize="14.5" font-weight="700" fill="#0f172a" text-anchor="start">UX Design Foundations</text><text x="210" y="444" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Lifetime access · certificate</text><text x="630" y="432" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="end">$249.00</text><text x="92" y="506" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Email</text><rect x="92" y="514" width="556" height="40" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="108" y="540" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">s.kaur@example.com</text><text x="92" y="572" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Card number</text><rect x="92" y="580" width="556" height="40" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="108" y="606" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">•••• •••• •••• 4242</text><text x="92" y="638" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Expiry / CVC</text><rect x="92" y="646" width="556" height="40" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="108" y="672" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">08 / 28   ···</text><text x="92" y="724" font-size="13" font-weight="600" fill="#059669" text-anchor="start">Coupon FALL20</text><text x="648" y="724" font-size="13" font-weight="700" fill="#059669" text-anchor="end">-$49.80</text><text x="92" y="750" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Tax</text><text x="648" y="750" font-size="13" font-weight="500" fill="#0f172a" text-anchor="end">$0.00</text><line x1="92" y1="764" x2="648" y2="764" stroke="#e2e8f0"/><text x="92" y="792" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Total</text><text x="648" y="792" font-size="17" font-weight="700" fill="#0f172a" text-anchor="end">$199.20</text><rect x="92" y="808" width="556" height="46" rx="23" fill="#db2777" /><text x="370" y="837" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Pay $199.20 and start learning</text><rect x="720" y="320" width="660" height="260" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh)"/><text x="752" y="362" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">What the platform does automatically</text><circle cx="764" cy="392" r="8" fill="#fce7f3"/><path d="M760 392l3 3 6-6" stroke="#db2777" stroke-width="2" fill="none"/><text x="782" y="397" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">Creates the order and the invoice</text><circle cx="764" cy="422" r="8" fill="#fce7f3"/><path d="M760 422l3 3 6-6" stroke="#db2777" stroke-width="2" fill="none"/><text x="782" y="427" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">Enrolls S. Kaur and unlocks Module 1</text><circle cx="764" cy="452" r="8" fill="#fce7f3"/><path d="M760 452l3 3 6-6" stroke="#db2777" stroke-width="2" fill="none"/><text x="782" y="457" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">Schedules modules 2-6 one week apart</text><circle cx="764" cy="482" r="8" fill="#fce7f3"/><path d="M760 482l3 3 6-6" stroke="#db2777" stroke-width="2" fill="none"/><text x="782" y="487" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">Adds her to the course community</text><circle cx="764" cy="512" r="8" fill="#fce7f3"/><path d="M760 512l3 3 6-6" stroke="#db2777" stroke-width="2" fill="none"/><text x="782" y="517" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">Starts the 3-email onboarding sequence</text><circle cx="764" cy="542" r="8" fill="#fce7f3"/><path d="M760 542l3 3 6-6" stroke="#db2777" stroke-width="2" fill="none"/><text x="782" y="547" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">Credits instructor M. Chen's revenue share</text><rect x="720" y="604" width="660" height="266" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh)"/><text x="752" y="644" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Welcome email</text><text x="1348" y="644" font-size="12" font-weight="500" fill="#64748b" text-anchor="end">Sent 9:14 AM</text><rect x="752" y="664" width="596" height="182" rx="12" fill="#fdf2f8" /><text x="772" y="696" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">You're in, S. Kaur!</text><text x="772" y="724" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Your UX Design Foundations course is ready. Start with lesson 1, "What UX</text><text x="772" y="744" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">really means", it takes 9 minutes. New modules unlock every Monday.</text><rect x="772" y="790" width="180" height="40" rx="20" fill="#db2777" /><text x="862" y="815" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">Start lesson 1</text>
