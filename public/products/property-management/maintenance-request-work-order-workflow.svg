 x="664" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Assign</text><text x="622" y="214" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Comfort HVAC Co. dispatched</text><line x1="840" y1="205" x2="864" y2="205" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrA)"/><rect x="868" y="130" width="236" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="902" cy="166" r="17" fill="#059669"/><text x="902" y="172" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="930" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Complete</text><text x="888" y="214" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Igniter replaced at 9:40 AM</text><line x1="1106" y1="205" x2="1130" y2="205" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrA)"/><rect x="1134" y="130" width="236" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="1168" cy="166" r="17" fill="#1d4ed8"/><text x="1168" y="172" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1196" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Invoice</text><text x="1154" y="214" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Matched to the work order</text><rect x="70" y="310" width="790" height="550" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="98" y="348" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Work order WO-4471</text><rect x="750" y="328" width="82" height="24" rx="12" fill="#d1fae5" /><text x="791" y="344" font-size="11.5" font-weight="700" fill="#059669" text-anchor="middle">Completed</text><text x="98" y="392" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Property / unit</text><text x="832" y="392" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">Harbor View Apartments · 9C</text><line x1="98" y1="406" x2="832" y2="406" stroke="#f1f5f9"/><text x="98" y="436" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Category</text><text x="832" y="436" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">HVAC · no heat</text><line x1="98" y1="450" x2="832" y2="450" stroke="#f1f5f9"/><text x="98" y="480" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Priority</text><text x="832" y="480" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">Urgent (response within 2 hours)</text><line x1="98" y1="494" x2="832" y2="494" stroke="#f1f5f9"/><text x="98" y="524" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Reported</text><text x="832" y="524" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">Jun 3 · 7:12 AM by tenant D. Kim</text><line x1="98" y1="538" x2="832" y2="538" stroke="#f1f5f9"/><text x="98" y="568" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Vendor</text><text x="832" y="568" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">Comfort HVAC Co. · insured to Dec 31</text><line x1="98" y1="582" x2="832" y2="582" stroke="#f1f5f9"/><text x="98" y="612" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Arrived</text><text x="832" y="612" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">Jun 3 · 8:51 AM</text><line x1="98" y1="626" x2="832" y2="626" stroke="#f1f5f9"/><text x="98" y="656" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Completed</text><text x="832" y="656" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">Jun 3 · 9:40 AM</text><line x1="98" y1="670" x2="832" y2="670" stroke="#f1f5f9"/><text x="98" y="700" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Resolution</text><text x="832" y="700" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">Replaced furnace igniter; tested heat</text><line x1="98" y1="714" x2="832" y2="714" stroke="#f1f5f9"/><rect x="98" y="760" width="360" height="70" rx="12" fill="#eff6ff" /><text x="114" y="788" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Tenant notified at each step</text><text x="114" y="810" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">SMS + portal · rated the repair 5/5</text><rect x="884" y="310" width="486" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="912" y="348" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Vendor invoice #CH-20931</text><text x="912" y="388" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">Labor · 1 hr emergency rate</text><text x="1342" y="388" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">$145.00</text><text x="912" y="426" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">Furnace igniter (part)</text><text x="1342" y="426" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">$68.50</text><text x="912" y="464" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">Trip charge</text><text x="1342" y="464" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">$45.00</text><line x1="912" y1="496" x2="1342" y2="496" stroke="#e2e8f0"/><text x="912" y="526" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Total</text><text x="1342" y="526" font-size="15" font-weight="700" fill="#0f172a" text-anchor="end">$258.50</text><text x="912" y="560" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Within $500 approval limit · charged to Harbor View LLC</text><text x="912" y="584" font-size="12" font-weight="500" fill="#059669" text-anchor="start">Matches WO-4471 · ready for payment run</text><rect x="884" y="634" width="486" height="226" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="912" y="672" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Response times · June</text><text x="912" y="710" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Urgent</text><rect x="1010" y="700" width="200" height="10" rx="5" fill="#f1f5f9" /><rect x="1010" y="700" width="164" height="10" rx="5" fill="#1d4ed8" /><text x="1342" y="710" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end">1 h 38 m avg</text><text x="912" y="756" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">High</text><rect x="1010" y="746" width="200" height="10" rx="5" fill="#f1f5f9" /><rect x="1010" y="746" width="128" height="10" rx="5" fill="#1d4ed8" /><text x="1342" y="756" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end">6 h 10 m avg</text><text x="912" y="802" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Routine</text><rect x="1010" y="792" width="200" height="10" rx="5" fill="#f1f5f9" /><rect x="1010" y="792" width="96" height="10" rx="5" fill="#1d4ed8" /><text x="1342" y="802" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end">2.1 days avg</text>
