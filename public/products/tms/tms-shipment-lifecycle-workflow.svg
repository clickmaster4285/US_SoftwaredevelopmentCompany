<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Shipment lifecycle in a transportation management system from order intake and planning to tendering, tracking, proof of delivery and freight audit" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Shipment lifecycle in a transportation management system from order intake and planning to tendering, tracking, proof of delivery and freight audit</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.16"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4338ca" stop-opacity="0.22"/><stop offset="1" stop-color="#4338ca" stop-opacity="0"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4338ca"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#eef2ff" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">The shipment lifecycle in a TMS</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">One record follows the load from order to paid invoice · placeholder data</text><rect x="80" y="150" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="120" cy="194" r="20" fill="#4338ca"/><text x="120" y="200" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="154" y="201" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Order intake</text><text x="104" y="250" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">ERP, OMS, portal or EDI order</text><rect x="410" y="150" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="450" cy="194" r="20" fill="#4338ca"/><text x="450" y="200" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="484" y="201" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Plan</text><text x="434" y="250" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Consolidate into loads, pick</text><text x="434" y="271" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">mode</text><rect x="740" y="150" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="780" cy="194" r="20" fill="#4338ca"/><text x="780" y="200" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="814" y="201" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Rate</text><text x="764" y="250" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Contract vs. spot, fuel,</text><text x="764" y="271" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">accessorials</text><rect x="1070" y="150" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="1110" cy="194" r="20" fill="#4338ca"/><text x="1110" y="200" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1144" y="201" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Tender</text><text x="1094" y="250" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Routing guide waterfall</text><rect x="1070" y="480" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="1110" cy="524" r="20" fill="#4338ca"/><text x="1110" y="530" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1144" y="531" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Schedule</text><text x="1094" y="580" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Pickup and delivery</text><text x="1094" y="601" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">appointments</text><rect x="740" y="480" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="780" cy="524" r="20" fill="#4338ca"/><text x="780" y="530" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="814" y="531" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Track</text><text x="764" y="580" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Milestones, ETAs, exceptions</text><rect x="410" y="480" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="450" cy="524" r="20" fill="#4338ca"/><text x="450" y="530" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="484" y="531" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Deliver</text><text x="434" y="580" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">POD captured, claims opened</text><rect x="80" y="480" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="120" cy="524" r="20" fill="#4338ca"/><text x="120" y="530" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="154" y="531" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Audit &amp; pay</text><text x="104" y="580" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Invoice matched, approved,</text><text x="104" y="601" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">paid</text><line x1="362" y1="245" x2="406" y2="245" stroke="#4338ca" stroke-width="2" marker-end="url(#arrA)"/><line x1="692" y1="245" x2="736" y2="245" stroke="#4338ca" stroke-width="2" marker-end="url(#arrA)"/><line x1="1022" y1="245" x2="1066" y2="245" stroke="#4338ca" stroke-width="2" marker-end="url(#arrA)"/><line x1="1210" y1="342" x2="1210" y2="476" stroke="#4338ca" stroke-width="2" marker-end="url(#arrA)"/><line x1="1068" y1="575" x2="1024" y2="575" stroke="#4338ca" stroke-width="2" marker-end="url(#arrA)"/><line x1="738" y1="575" x2="694" y2="575" stroke="#4338ca" stroke-width="2" marker-end="url(#arrA)"/><line x1="408" y1="575" x2="364" y2="575" stroke="#4338ca" stroke-width="2" marker-end="url(#arrA)"/><rect x="160" y="760" width="1120" height="80" rx="14" fill="#e0e7ff" /><text x="720" y="794" font-size="14" font-weight="700" fill="#3730a3" text-anchor="middle">Data shared at every step: order lines, load, carrier, rate, appointment, location, POD and invoice</text><text x="720" y="820" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Connected to ERP, WMS, carriers (API/EDI), visibility providers and accounting</text>
</svg>
