rements describe what stakeholders need, written</text><text x="64" y="682" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">so they can be tested.</text><rect x="40" y="716" width="440" height="160" rx="16" fill="#fff" stroke="#e2e8f0"/><text x="64" y="752" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">My notes</text><text x="64" y="780" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="start">Write scope as deliverables + exclusions. Ask: how</text><text x="64" y="799" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="start">will we test this requirement?</text><text x="64" y="852" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="start">Saved at 6:02</text><rect x="500" y="716" width="440" height="160" rx="16" fill="#fff" stroke="#e2e8f0"/><text x="524" y="752" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Discussion · 14 posts</text><circle cx="540" cy="790" r="15" fill="#7c3aed"/><text x="540" y="794.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">KL</text><text x="564" y="786" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">K. Lee</text><text x="564" y="804" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">How detailed should requirements be?</text><circle cx="540" cy="840" r="15" fill="#059669"/><text x="540" y="844.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">PS</text><text x="564" y="836" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="start">Instructor · P. Shah</text><text x="564" y="854" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Detailed enough to test. See the template.</text><rect x="964" y="96" width="436" height="780" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="988" y="134" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Course outline</text><circle cx="1004" cy="182" r="11" fill="#