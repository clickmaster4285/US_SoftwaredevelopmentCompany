<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Truck dispatch load lifecycle from rate confirmation and assignment to pickup, delivery, proof of delivery, invoicing and driver settlement" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Truck dispatch load lifecycle from rate confirmation and assignment to pickup, delivery, proof of delivery, invoicing and driver settlement</title>
