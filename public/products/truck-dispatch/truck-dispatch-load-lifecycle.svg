</defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#fff7ed" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">A load's life in truck dispatch software</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">From rate confirmation to invoice and driver pay · placeholder data</text><rect x="80" y="150" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="120" cy="194" r="20" fill="#c2410c"/><text x="120" y="200" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="154" y="201" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Book</text><text x="104" y="250" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Rate con → load 4480</text><rect x="410" y="150" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="450" cy="194" r="20" fill="#c2410c"/><text x="450" y="200" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="484" y="201" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Assign</text><text x="434" y="250" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">T. Morgan · T108 / V221</text><rect x="740" y="150" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="780" cy="194" r="20" fill="#c2410c"/><text x="780" y="200" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="814" y="201" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Dispatch</text><text x="764" y="250" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Details sent to driver app</text><rect x="1070" y="150" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="1110" cy="194" r="20" fill="#c2410c"/><text x="1110" y="200" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1144" y="201" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Pickup</text><text x="1094" y="250" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Arrival, loading, BOL photo</text><rect x="1070" y="480" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="1110" cy="524" r="20" fill="#c2410c"/><text x="1110" y="530" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1144" y="531" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Deliver</text><text x="1094" y="580" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Arrival, unload, POD photo</text><rect x="740" y="480" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="780" cy="524" r="20" fill="#c2410c"/><text x="780" y="530" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="814" y="531" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Invoice</text><text x="764" y="580" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">$1,780 + accessorials</text><rect x="410" y="480" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="450" cy="524" r="20" fill="#c2410c"/><text x="450" y="530" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="484" y="531" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Factor / collect</text><text x="434" y="580" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Batch to factoring</text><rect x="80" y="480" width="280" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="120" cy="524" r="20" fill="#c2410c"/><text x="120" y="530" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="154" y="531" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Settle</text><text x="104" y="580" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Driver paid per mile</text><line x1="362" y1="245" x2="406" y2="245" stroke="#c2410c" stroke-width="2" marker-end="url(#arrA)"/><line x1="692" y1="245" x2="736" y2="245" stroke="#c2410c" stroke-width="2" marker-end="url(#arrA)"/><line x1="1022" y1="245" x2="1066" y2="245" stroke="#c2410c" stroke-width="2" marker-end="url(#arrA)"/><line x1="1210" y1="342" x2="1210" y2="476" stroke="#c2410c" stroke-width="2" marker-end="url(#arrA)"/><line x1="1068" y1="575" x2="1024" y2="575" stroke="#c2410c" stroke-width="2" marker-end="url(#arrA)"/><line x1="738" y1="575" x2="694" y2="575" stroke="#c2410c" stroke-width="2" marker-end="url(#arrA)"/><line x1="408" y1="575" x2="364" y2="575" stroke="#c2410c" stroke-width="2" marker-end="url(#arrA)"/><rect x="160" y="760" width="1120" height="80" rx="14" fill="#ffedd5" /><text x="720" y="794" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">One load record holds the rate con, stops, timestamps, documents, invoice and pay line</text><text x="720" y="820" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Connected to ELD/GPS, load boards, fuel cards, factoring and accounting</text>
</svg>
