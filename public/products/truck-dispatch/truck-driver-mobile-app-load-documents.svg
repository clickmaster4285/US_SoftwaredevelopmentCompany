" width="264" height="58" rx="12" fill="#c2410c" /><text x="608" y="425" font-size="14" font-weight="700" fill="#fff" text-anchor="start">Loaded</text><text x="834" y="425" font-size="13" font-weight="700" fill="#fff" text-anchor="end">Tap</text><rect x="588" y="460" width="264" height="58" rx="12" fill="#fff" stroke="#e2e8f0"/><text x="608" y="495" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Arrived at delivery</text><text x="834" y="495" font-size="13" font-weight="700" fill="#059669" text-anchor="end"></text><rect x="588" y="530" width="264" height="58" rx="12" fill="#fff" stroke="#e2e8f0"/><text x="608" y="565" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Delivered</text><text x="834" y="565" font-size="13" font-weight="700" fill="#059669" text-anchor="end"></text><rect x="588" y="612" width="264" height="60" rx="12" fill="#fef3c7" /><text x="604" y="638" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="start">Detention clock at pickup</text><text x="604" y="658" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Arrived 12:52 PM · free time ends 3:00 PM</text><text x="720" y="712" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle">Location shared automatically while on duty</text><rect x="970" y="130" width="320" height="700" rx="44" fill="#0f172a" filter="url(#sh2)"/><rect x="982" y="142" width="296" height="676" rx="34" fill="#fff" /><rect x="1090" y="152" width="80" height="18" rx="9" fill="#0f172a" /><text x="1130" y="210" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Documents</text><line x1="982" y1="228" x2="1278" y2="228" stroke="#e2e8f0"/><rect x="998" y="246" width="264" height="200" rx="14" fill="#f1f5f9" /><rect x="1044" y="270" width="172" height="150" rx="6" fill="#fff" stroke="#e2e8f0"/><text x="1130" y="300" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">BILL OF LADING</text><rect x="1062" y="318" width="136" height="6" rx="3" fill="#e2e8f0" /><rect x="1062" y="336" width="106" height="6" rx="3" fill="#e2e8f0" /><rect x="1062" y="354" width="136" height="6" rx="3" fill="#e2e8f0" /><rect x="1062" y="372" width="106" height="6" rx="3" fill="#e2e8f0" /><rect x="1062" y="390" width="136" height="6" rx="3" fill="#e2e8f0" /><text x="1130" y="470" font-size="12.5" font-weight="700" fill="#059669" text-anchor="middle">BOL photo captured · 1:44 PM</text><rect x="998" y="494" width="264" height="40" rx="10" fill="#fff" stroke="#e2e8f0"/><text x="1014" y="519" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Bill of lading</text><text x="1246" y="519" font-size="11.5" font-weight="700" fill="#059669" text-anchor="end">Attached</text><rect x="998" y="544" width="264" height="40" rx="10" fill="#fff" stroke="#e2e8f0"/><text x="1014" y="569" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Proof of delivery</text><text x="1246" y="569" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">After delivery</text><rect x="998" y="594" width="264" height="40" rx="10" fill="#fff" stroke="#e2e8f0"/><text x="1014" y="619" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Lumper receipt</text><text x="1246" y="619" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">Optional</text><rect x="998" y="644" width="264" height="40" rx="10" fill="#fff" stroke="#e2e8f0"/><text x="1014" y="669" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Scale ticket</text><text x="1246" y="669" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">Optional</text><rect x="998" y="706" width="264" height="46" rx="23" fill="#c2410c" /><text x="1130" y="735" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Scan document</text><line x1="478" y1="480" x2="552" y2="480" stroke="#c2410c" stroke-width="2" marker-end="url(#arrA)"/><line x1="888" y1="480" x2="962" y2="480" stroke="#c2