<rect x="0" y="0" width="1440" height="900" rx="0" fill="#fff7ed" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">What the driver sees in the app</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Driver app concept · Load 4480 · placeholder data</text><rect x="150" y="130" width="320" height="700" rx="44" fill="#0f172a" filter="url(#sh2)"/><rect x="162" y="142" width="296" height="676" rx="34" fill="#fff" /><rect x="270" y="152" width="80" height="18" rx="9" fill="#0f172a" /><text x="310" y="210" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Load 4480</text><line x1="162" y1="228" x2="458" y2="228" stroke="#e2e8f0"/><rect x="178" y="246" width="264" height="70" rx="12" fill="#ffedd5" /><text x="194" y="274" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">El Paso, TX → Dallas, TX</text><text x="194" y="296" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">635 mi · 41,200 lb · dry van</text><rect x="178" y="332" width="264" height="118" rx="12" fill="#fff" stroke="#e2e8f0"/><rect x="178" y="332" width="6" height="118" rx="3" fill="#1d4ed8" /><text x="196" y="356" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="start">PICKUP</text><text x="196" y="380" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Rio Grande Foods</text><text x="196" y="402" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">1:00 PM appt · Dock 4</text><text x="196" y="422" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Ref PO 55120</text><text x="426" y="438" font-size="11.5" font-weight="700" fill="#9a3412" text-anchor="end">Navigate →</text><rect x="178" y="464" width="264" height="118" rx="12" fill="#fff" stroke="#e2e8f0"/><rect x="178" y="464" width="6" height="118" rx="3" fill="#059669" /><text x="196" y="488" font-size="10.5" font-weight="700" fill="#059669" text-anchor="s