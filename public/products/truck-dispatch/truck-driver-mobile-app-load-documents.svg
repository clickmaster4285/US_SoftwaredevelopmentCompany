<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Truck driver mobile app with load details, stop navigation, status updates and bill of lading and proof of delivery photo capture" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
