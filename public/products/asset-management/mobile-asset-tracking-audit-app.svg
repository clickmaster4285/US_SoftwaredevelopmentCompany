<text x="274" y="629" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">Reg: Room 2-16</text><text x="516" y="620" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="end">Unexpected</text><rect x="262" y="646" width="266" height="46" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1"/><text x="274" y="666" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">AM-7701 Chairs (x6)</text><text x="274" y="683" font-size="11" font-weight="500" fill="#64748b" text-anchor="start">Facilities</text><text x="516" y="674" font-size="11.5" font-weight="800" fill="#047857" text-anchor="end">Found</text><rect x="262" y="710" width="266" height="46" rx="14" fill="#4d7c0f"/><text x="395" y="739" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Scan next tag</text><rect x="620" y="120" width="330" height="700" rx="46" fill="#121a09" filter="url(#sh2)"/><rect x="633" y="133" width="304" height="674" rx="36" fill="#fbfdf8"/><rect x="735" y="144" width="100" height="22" rx="11" fill="#121a09"/><text x="652" y="204" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Resolve variance</text><text x="652" y="226" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">AM-2233 Dock station · missing</text><rect x="652" y="244" width="266" height="120" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="666" y="274" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Last seen</text><text x="904" y="274" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">Audit May 12 · Room 2-14</text><text x="666" y="304" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Custodian</text><text x="904" y="304" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">J. Park</text><text x="666" y="334" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Cost / NBV</text><text x="904" y="334" font-size="12" font-weight="600" fill="#0f172a" text-anchor="end">$240 / $96</text><text x="652" y="396" font-size="10.5" font-weight="800" fill="#64748b" text-anchor="start" letter-spacing="1.2">WHAT HAPPENED?</text><rect x="652" y="412" width="266" height="42" rx="12" fill="#f7fee7" stroke="#4d7c0f" stroke-width="2"/><circle cx="672" cy="433" r="7" fill="#4d7c0f" stroke="#4d7c0f" stroke-width="2"/><text x="688" y="438" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Ask custodian to confirm</text><rect x="652" y="464" width="266" height="42" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/><circle cx="672" cy="485" r="7" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="688" y="490" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="start">Mark as moved (scan elsewhere)</text><rect x="652" y="516" width="266" height="42" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/><circle cx="672" cy="537" r="7" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text x="688" y="542" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="start">Report lost · needs approval</text><rect x="652" y="576" width="266" height="76" rx="12" fill="#f7fee7" stroke="#d9f99d" stroke-width="1"/><text x="666" y="602" font-size="12.5" font-weight="700" fill="#3f6212" text-anchor="start">J. Park gets a task to confirm</text><text x="666" y="622" font-size="12" font-weight="500" fill="#3f6212" text-anchor="start">the dock station's location.</text><text x="666" y="640" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Variance stays open until resolved.</text><rect x="652" y="710" width="266" height="46" rx="14" fill="#4d7c0f"/><text x="785" y="739" font-size="14.5" font-weight="700" fill="#fff" text-anchor="middle">Send and continue</text><rect x="1030" y="210" width="320" height="124" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="1030" y="210" width="6" height="124" rx="3" fill="#4d7c0f"/><text x="1054" y="250" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Compare with the register</text><text x="1054" y="276" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Found, missing and unexpected items</text><text x="1054" y="294" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">are listed per room.</text><rect x="1030" y="370" width="320" height="124" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="1030" y="370" width="6" height="124" rx="3" fill="#4d7c0f"/><text x="1054" y="410" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Variances need a decision</text><text x="1054" y="436" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Nothing is written off without an</text><text x="1054" y="454" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">owner and approval.</text><rect x="1030" y="530" width="320" height="124" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="1030" y="530" width="6" height="124" rx="3" fill="#4d7c0f"/><text x="1054" y="570" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Audit accuracy over time</text><text x="1054" y="596" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Site-level accuracy feeds the</text><text x="1054" y="614" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">multi-location view.</text>
