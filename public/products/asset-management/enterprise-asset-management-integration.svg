<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Enterprise asset management architecture connecting the asset registry with ERP, HRMS, IT service management and IoT sensors" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Enterprise asset management architecture connecting the asset registry with ERP, HRMS, IT service management and IoT sensors</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#17220a" flood-opacity="0.14"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d7c0f" stop-opacity="0.24"/><stop offset="1" stop-color="#4d7c0f" stop-opacity="0"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#65a30d"/><stop offset="1" stop-color="#3f6212"/></linearGradient>
<linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#365314"/><stop offset="1" stop-color="#4d7c0f"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4d7c0f"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff"/><text x="600" y="52" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Enterprise asset management architecture</text><text x="600" y="82" font-size="14.5" font-weight="500" fill="#64748b" text-anchor="middle">The asset registry keeps operational detail; each connected system owns its own fields</text><rect x="40" y="120" width="290" height="170" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="40" y="120" width="290" height="6" rx="3" fill="#334155"/><text x="60" y="158" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">ERP / accounting</text><text x="60" y="178" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Financial system of record</text><rect x="60" y="194" width="250" height="24" rx="8" fill="#f8fafc"/><text x="72" y="211" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start">POs, capitalization, cost centers</text><rect x="60" y="226" width="250" height="24" rx="8" fill="#f8fafc"/><text x="72" y="243" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start">Depreciation postings, disposals</text><rect x="40" y="320" width="290" height="170" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="40" y="320" width="290" height="6" rx="3" fill="#7c3aed"/><text x="60" y="358" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Procurement</text><text x="60" y="378" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Requests and purchase orders</text><rect x="60" y="394" width="250" height="24" rx="8" fill="#f8fafc"/><text x="72" y="411" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start">Approved PO → pending asset</text><rect x="60" y="426" width="250" height="24" rx="8" fill="#f8fafc"/><text x="72" y="443" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start">Vendor and warranty data</text><rect x="40" y="520" width="290" height="170" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="40" y="520" width="290" height="6" rx="3" fill="#db2777"/><text x="60" y="558" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">HRMS</text><text x="60" y="578" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Joiners, movers, leavers</text><rect x="60" y="594" width="250" height="24" rx="8" fill="#f8fafc"/><text x="72" y="611" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start">New hire → assign kit</text><rect x="60" y="626" width="250" height="24" rx="8" fill="#f8fafc"/><text x="72" y="643" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start">Leaver → return checklist</text><rect x="440" y="260" width="320" height="300" rx="28" fill="url(#core)" filter="url(#sh2)"/><text x="600" y="314" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">Asset registry</text><text x="600" y="338" font-size="12.5" font-weight="600" fill="#ecfccb" text-anchor="middle">Operational record of every asset</text><rect x="470" y="362" width="260" height="34" rx="10" fill="#ffffff" opacity="0.16"/><text x="600" y="384" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Location and custodian</text><rect x="470" y="406" width="260" height="34" rx="10" fill="#ffffff" opacity="0.16"/><text x="600" y="428" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Condition and maintenance</text><rect x="470" y="450" width="260" height="34" rx="10" fill="#ffffff" opacity="0.16"/><text x="600" y="472" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Lifecycle status</text><rect x="470" y="494" width="260" height="34" rx="10" fill="#ffffff" opacity="0.16"/><text x="600" y="516" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Documents and audit trail</text><rect x="870" y="120" width="290" height="170" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="870" y="120" width="290" height="6" rx="3" fill="#0891b2"/><text x="890" y="158" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">IT service management</text><text x="890" y="178" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Incidents, requests, CMDB</text><rect x="890" y="194" width="250" height="24" rx="8" fill="#f8fafc"/><text x="902" y="211" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start">Tickets linked to IT assets</text><rect x="890" y="226" width="250" height="24" rx="8" fill="#f8fafc"/><text x="902" y="243" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start">License and device records</text><rect x="870" y="320" width="290" height="170" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="870" y="320" width="290" height="6" rx="3" fill="#f59e0b"/><text x="890" y="358" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">IoT sensors &amp; telematics</text><text x="890" y="378" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Optional, hardware-dependent</text><rect x="890" y="394" width="250" height="24" rx="8" fill="#f8fafc"/><text x="902" y="411" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start">Runtime, temperature, vibration</text><rect x="890" y="426" width="250" height="24" rx="8" fill="#f8fafc"/><text x="902" y="443" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start">GPS for mobile equipment</text><rect x="870" y="520" width="290" height="170" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="870" y="520" width="290" height="6" rx="3" fill="#10b981"/><text x="890" y="558" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">BI &amp; scanning</text><text x="890" y="578" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Analytics and capture</text><rect x="890" y="594" width="250" height="24" rx="8" fill="#f8fafc"/><text x="902" y="611" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start">Asset, cost and utilization data</text><rect x="890" y="626" width="250" height="24" rx="8" fill="#f8fafc"/><text x="902" y="643" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="start">Barcode, QR and RFID devices</text><path d="M332 205 C 385 205, 385 320, 438 320" fill="none" stroke="#334155" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)"/><path d="M332 405 C 385 405, 385 410, 438 410" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)"/><path d="M332 605 C 385 605, 385 500, 438 500" fill="none" stroke="#db2777" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)"/><path d="M762 320 C 815 320, 815 205, 868 205" fill="none" stroke="#0891b2" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)"/><path d="M762 410 C 815 410, 815 405, 868 405" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)"/><path d="M762 500 C 815 500, 815 605, 868 605" fill="none" stroke="#10b981" stroke-width="2.5" marker-start="url(#arrA)" marker-end="url(#arrA)"/><rect x="200" y="730" width="800" height="50" rx="16" fill="#f7fee7" stroke="#d9f99d" stroke-width="1"/><text x="600" y="761" font-size="13" font-weight="600" fill="#3f6212" text-anchor="middle">ERP owns cost and depreciation · the registry owns location, custodian, condition and maintenance</text>
</svg>
