<rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff"/><text x="600" y="52" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">The employee lifecycle in one HRMS</text><text x="600" y="82" font-size="14.5" font-weight="500" fill="#64748b" text-anchor="middle">Information flows forward from each stage instead of being re-entered</text><text x="68" y="120" font-size="11.5" font-weight="800" fill="#0891b2" text-anchor="start" letter-spacing="1.5">ATTRACT &amp; HIRE</text><rect x="68" y="130" width="236" height="118" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="68" y="130" width="236" height="6" rx="3" fill="#0891b2"/><circle cx="100" cy="172" r="16" fill="#0891b2"/><text x="100" y="177" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="126" y="177" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Workforce planning</text><text x="88" y="218" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Positions, headcount</text><line x1="308" y1="189" x2="338" y2="189" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="344" y="130" width="236" height="118" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="344" y="130" width="236" height="6" rx="3" fill="#0891b2"/><circle cx="376" cy="172" r="16" fill="#0891b2"/><text x="376" y="177" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="402" y="177" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Recruitment</text><text x="364" y="218" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Requisitions, postings</text><line x1="584" y1="189" x2="614" y2="189" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="620" y="130" width="236" height="118" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="620" y="130" width="236" height="6" rx="3" fill="#0891b2"/><circle cx="652" cy="172" r="16" fill="#0891b2"/><text x="652" y="177" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="678" y="177" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Screening</text><text x="640" y="218" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Interviews, scorecards</text><line x1="860" y1="189" x2="890" y2="189" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="896" y="130" width="236" height="118" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="896" y="130" width="236" height="6" rx="3" fill="#0891b2"/><circle cx="928" cy="172" r="16" fill="#0891b2"/><text x="928" y="177" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="954" y="177" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Hiring</text><text x="916" y="218" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Offer, acceptance</text><text x="68" y="340" font-size="11.5" font-weight="800" fill="#059669" text-anchor="start" letter-spacing="1.5">START &amp; ADMINISTER</text><rect x="896" y="350" width="236" height="118" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="896" y="350" width="236" height="6" rx="3" fill="#059669"/><circle cx="928" cy="392" r="16" fill="#059669"/><text x="928" y="397" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="954" y="397" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Onboarding</text><text x="916" y="438" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Paperwork, IT, orientation</text><line x1="892" y1="409" x2="862" y2="409" stroke="#059669" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="620" y="350" width="236" height="118" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="620" y="350" width="236" height="6" rx="3" fill="#059669"/><circle cx="652" cy="392" r="16" fill="#059669"/><text x="652" y="397" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="678" y="397" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Employee record</text><text x="640" y="438" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Job, manager, location</text><line x1="616" y1="409" x2="586" y2="409" stroke="#059669" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="344" y="350" width="236" height="118" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="344" y="350" width="236" height="6" rx="3" fill="#059669"/><circle cx="376" cy="392" r="16" fill="#059669"/><text x="376" y="397" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">7</text><text x="402" y="397" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Attendance &amp; leave</text><text x="364" y="438" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Schedules, time, PTO</text><line x1="340" y1="409" x2="310" y2="409" stroke="#059669" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="68" y="350" width="236" height="118" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="68" y="350" width="236" height="6" rx="3" fill="#059669"/><circle cx="100" cy="392" r="16" fill="#059669"/><text x="100" y="397" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">8</text><text x="126" y="397" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Development</text><text x="88" y="438" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Training, certifications</text><text x="68" y="560" font-size="11.5" font-weight="800" fill="#7c3aed" text-anchor="start" letter-spacing="1.5">GROW &amp; EXIT</text><rect x="68" y="570" width="236" height="118" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="68" y="570" width="236" height="6" rx="3" fill="#7c3aed"/><circle cx="100" cy="612" r="16" fill="#7c3aed"/><text x="100" y="617" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">9</text><text x="126" y="617" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Performance</text><text x="88" y="658" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Goals, reviews, feedback</text><line x1="308" y1="629" x2="338" y2="629" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="344" y="570" width="236" height="118" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="344" y="570" width="236" height="6" rx="3" fill="#7c3aed"/><circle cx="376" cy="612" r="16" fill="#7c3aed"/><text x="376" y="617" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">10</text><text x="402" y="617" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Career moves</text><text x="364" y="658" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Promotions, transfers</text><line x1="584" y1="629" x2="614" y2="629" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="620" y="570" width="236" height="118" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="620" y="570" width="236" height="6" rx="3" fill="#7c3aed"/><circle cx="652" cy="612" r="16" fill="#7c3aed"/><text x="652" y="617" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">11</text><text x="678" y="617" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">HR administration</text><text x="640" y="658" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Documents, HR cases</text><line x1="860" y1="629" x2="890" y2="629" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="896" y="570" width="236" height="118" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="896" y="570" width="236" height="6" rx="3" fill="#7c3aed"/><circle cx="928" cy="612" r="16" fill="#7c3aed"/><text x="928" y="617" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">12</text><text x="954" y="617" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Offboarding</text><text x="916" y="658" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Access removal, exit</text><line x1="1014" y1="252" x2="1014" y2="324" stroke="#059669" stroke-width="2.5" marker-end="url(#arrA)"/><line x1="186" y1="472" x2="186" y2="544" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="140" y="724" width="920" height="64" rx="18" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/><text x="600" y="752" font-size="13.5" font-weight="600" fill="#047857" text-anchor="middle">One employee record connects every stage: a promotion updates approvals, payroll and reports,</text><text x="600" y="772" font-size="13.5" font-weight="600" fill="#047857" text-anchor="middle">and a termination reliably triggers access removal.</text>
</svg>
