<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Employee lifecycle managed in an HRMS from workforce planning and recruitment to onboarding, performance and offboarding" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Employee lifecycle managed in an HRMS from workforce planning and recruitment to onboarding, performance and offboarding</title>
