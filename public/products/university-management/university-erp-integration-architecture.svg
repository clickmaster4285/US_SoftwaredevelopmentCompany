<rect x="0" y="0" width="1440" height="900" rx="0" fill="#eff6ff" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">How a university ERP connects to the systems you keep</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Composable architecture · APIs and event feeds · names are generic examples</text><rect x="470" y="330" width="500" height="220" rx="20" fill="#0b1a3d" filter="url(#sh2)"/><text x="720" y="372" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">University platform</text><text x="720" y="396" font-size="13" font-weight="500" fill="#bfdbfe" text-anchor="middle">Integration layer · APIs · event bus</text><rect x="494" y="420" width="144" height="42" rx="10" fill="#ffffff1a" /><text x="566" y="446" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Admissions CRM</text><rect x="650" y="420" width="144" height="42" rx="10" fill="#ffffff1a" /><text x="722" y="446" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Degree audit</text><rect x="806" y="420" width="144" height="42" rx="10" fill="#ffffff1a" /><text x="878" y="446" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Research admin</text><rect x="494" y="476" width="144" height="42" rx="10" fill="#ffffff1a" /><text x="566" y="502" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Housing</text><rect x="650" y="476" width="144" height="42" rx="10" fill="#ffffff1a" /><text x="722" y="502" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Portals &amp; app</text><rect x="806" y="476" width="144" height="42" rx="10" fill="#ffffff1a" /><text x="878" y="502" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Advising</text><rect x="80" y="130" width="320" height="130" rx="14" fill="#fff" stroke="#6d28d9" stroke-width="2" filter="url(#sh)"/><rect x="80" y="130" width="320" height="34" rx="14" fill="#ede9fe" /><rect x="80" y="150" width="320" height="14" rx="0" fill="#ede9fe" /><text x="240" y="153" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">Identity provider</text><text x="96" y="188" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">SSO via SAML / OpenID Connect, MFA, roles</text><line x1="240" y1="260" x2="470" y2="360" stroke="#6d28d9" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrA)"/><rect x="560" y="130" width="320" height="130" rx="14" fill="#fff" stroke="#1d4ed8" stroke-width="2" filter="url(#sh)"/><rect x="560" y="130" width="320" height="34" rx="14" fill="#dbeafe" /><rect x="560" y="150" width="320" height="14" rx="0" fill="#dbeafe" /><text x="720" y="153" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">Existing SIS</text><text x="576" y="188" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Official record: enrollment, grades,</text><text x="576" y="206" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">transcripts</text><line x1="720" y1="260" x2="720" y2="330" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrA)"/><rect x="1040" y="130" width="320" height="130" rx="14" fill="#fff" stroke="#059669" stroke-width="2" filter="url(#sh)"/><rect x="1040" y="130" width="320" height="34" rx="14" fill="#d1fae5" /><rect x="1040" y="150" width="320" height="14" rx="0" fill="#d1fae5" /><text x="1200" y="153" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">LMS</text><text x="1056" y="188" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Course shells, rosters and final grades</text><line x1="1200" y1="260" x2="970" y2="360" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrA)"/><rect x="80" y="620" width="320" height="130" rx="14" fill="#fff" stroke="#b45309" stroke-width="2" filter="url(#sh)"/><rect x="80" y="620" width="320" height="34" rx="14" fill="#fef3c7" /><rect x="80" y="640" width="320" height="14" rx="0" fill="#fef3c7" /><text x="240" y="643" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">Finance &amp; student accounts</text><text x="96" y="678" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Tuition, aid, GL postings and receivables</text><line x1="240" y1="620" x2="470" y2="520" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrA)"/><rect x="560" y="620" width="320" height="130" rx="14" fill="#fff" stroke="#be185d" stroke-width="2" filter="url(#sh)"/><rect x="560" y="620" width="320" height="34" rx="14" fill="#fce7f3" /><rect x="560" y="640" width="320" height="14" rx="0" fill="#fce7f3" /><text x="720" y="643" font-size="14" font-weight="700" fill="#be185d" text-anchor="middle">HR &amp; payroll</text><text x="576" y="678" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Appointments, assignments, effort</text><line x1="720" y1="620" x2="720" y2="550" stroke="#be185d" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrA)"/><rect x="1040" y="620" width="320" height="130" rx="14" fill="#fff" stroke="#0f766e" stroke-width="2" filter="url(#sh)"/><rect x="1040" y="620" width="320" height="34" rx="14" fill="#ccfbf1" /><rect x="1040" y="640" width="320" height="14" rx="0" fill="#ccfbf1" /><text x="1200" y="643" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">Data warehouse</text><text x="1056" y="678" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Census snapshots, dashboards, institutional</text><text x="1056" y="696" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">research</text><line x1="1200" y1="620" x2="970" y2="520" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrA)"/><text x="720" y="820" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Legacy modules are retired phase by phase as new modules go live.</text>
</svg>
