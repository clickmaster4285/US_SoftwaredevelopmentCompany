<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="University ERP integration architecture connecting identity and single sign-on, LMS, existing SIS, finance, HR and a data warehouse" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>University ERP integration architecture connecting identity and single sign-on, LMS, existing SIS, finance, HR and a data warehouse</title>
