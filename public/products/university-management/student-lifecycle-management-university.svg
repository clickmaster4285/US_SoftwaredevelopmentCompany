<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Student lifecycle management diagram from recruitment and admission to registration, progression, graduation and alumni" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Student lifecycle management diagram from recruitment and admission to registration, progression, graduation and alumni</title>
<defs>
