<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b1a3d" flood-opacity="0.16"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d4ed8" stop-opacity="0.22"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d4ed8"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#eff6ff" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">Student lifecycle management in one shared record</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Each stage reads and writes the same student, identity and account · placeholder data</text><ellipse cx="720" cy="470" rx="470" ry="290" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="10 8"/><circle cx="720" cy="470" r="130" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><text x="720" y="436" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">ONE STUDENT RECORD</text><text x="720" y="464" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">Identity · program · status</text><text x="720" y="486" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">Courses · grades · audit</text><text x="720" y="508" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">Account · aid · housing</text><text x="720" y="530" font-size="13" font-weight="500" fill="#0f172a" text-anchor="middle">Services · outcomes</text><rect x="610" y="136" width="220" height="88" rx="14" fill="#fff" stroke="#1d4ed8" stroke-width="2" filter="url(#sh)"/><rect x="610" y="136" width="220" height="30" rx="14" fill="#dbeafe" /><rect x="610" y="154" width="220" height="12" rx="0" fill="#dbeafe" /><text x="720" y="157" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">1. Recruit</text><text x="720" y="194" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="middle">CRM, events, campaigns</text><rect x="942.3401871576773" y="220.93903345590127" width="220" height="88" rx="14" fill="#fff" stroke="#6d28d9" stroke-width="2" filter="url(#sh)"/><rect x="942.3401871576773" y="220.93903345590127" width="220" height="30" rx="14" fill="#ede9fe" /><rect x="942.3401871576773" y="238.93903345590127" width="220" height="12" rx="0" fill="#ede9fe" /><text x="1052.3401871576773" y="241.93903345590127" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">2. Apply</text><text x="1052.3401871576773" y="278.93903345590127" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="middle">Applications and review</text><rect x="1080" y="426" width="220" height="88" rx="14" fill="#fff" stroke="#be185d" stroke-width="2" filter="url(#sh)"/><rect x="1080" y="426" width="220" height="30" rx="14" fill="#fce7f3" /><rect x="1080" y="444" width="220" height="12" rx="0" fill="#fce7f3" /><text x="1190" y="447" font-size="14" font-weight="700" fill="#be185d" text-anchor="middle">3. Admit</text><text x="1190" y="484" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="middle">Decisions, offers, deposits</text><rect x="942.3401871576773" y="631.0609665440987" width="220" height="88" rx="14" fill="#fff" stroke="#c2410c" stroke-width="2" filter="url(#sh)"/><rect x="942.3401871576773" y="631.0609665440987" width="220" height="30" rx="14" fill="#ffedd5" /><rect x="942.3401871576773" y="649.0609665440987" width="220" height="12" rx="0" fill="#ffedd5" /><text x="1052.3401871576773" y="652.0609665440987" font-size="14" font-weight="700" fill="#c2410c" text-anchor="middle">4. Matriculate</text><text x="1052.3401871576773" y="689.0609665440987" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="middle">ID, SSO account, orientation</text><rect x="610" y="716" width="220" height="88" rx="14" fill="#fff" stroke="#1d4ed8" stroke-width="2" filter="url(#sh)"/><rect x="610" y="716" width="220" height="30" rx="14" fill="#dbeafe" /><rect x="610" y="734" width="220" height="12" rx="0" fill="#dbeafe" /><text x="720" y="737" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">5. Register</text><text x="720" y="774" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="middle">Courses across faculties</text><rect x="277.6598128423227" y="631.0609665440988" width="220" height="88" rx="14" fill="#fff" stroke="#0f766e" stroke-width="2" filter="url(#sh)"/><rect x="277.6598128423227" y="631.0609665440988" width="220" height="30" rx="14" fill="#ccfbf1" /><rect x="277.6598128423227" y="649.0609665440988" width="220" height="12" rx="0" fill="#ccfbf1" /><text x="387.6598128423227" y="652.0609665440988" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">6. Progress</text><text x="387.6598128423227" y="689.0609665440988" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="middle">Grades, advising, degree audit</text><rect x="140" y="426.00000000000006" width="220" height="88" rx="14" fill="#fff" stroke="#059669" stroke-width="2" filter="url(#sh)"/><rect x="140" y="426.00000000000006" width="220" height="30" rx="14" fill="#d1fae5" /><rect x="140" y="444.00000000000006" width="220" height="12" rx="0" fill="#d1fae5" /><text x="250" y="447.00000000000006" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">7. Graduate</text><text x="250" y="484.00000000000006" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="middle">Clearance, conferral, credential</text><rect x="277.6598128423226" y="220.93903345590127" width="220" height="88" rx="14" fill="#fff" stroke="#b45309" stroke-width="2" filter="url(#sh)"/><rect x="277.6598128423226" y="220.93903345590127" width="220" height="30" rx="14" fill="#fef3c7" /><rect x="277.6598128423226" y="238.93903345590127" width="220" height="12" rx="0" fill="#fef3c7" /><text x="387.6598128423226" y="241.93903345590127" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">8. Alumni</text><text x="387.6598128423226" y="278.93903345590127" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="middle">Careers, events, giving</text>
</svg>
