<rect x="0" y="0" width="1440" height="900" rx="0" fill="#f0fdfa" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">How a store-to-store transfer works</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Transfer TR-3318 · Lakeside → Westfield Mall · placeholder data</text><rect x="70" y="140" width="236" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="106" cy="178" r="18" fill="#1d4ed8"/><text x="106" y="184" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="136" y="184" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Suggested</text><text x="90" y="232" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Westfield sold out of</text><text x="90" y="251" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">LS-WHT-M; Lakeside has 9</text><text x="90" y="270" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">units</text><line x1="308" y1="235" x2="332" y2="235" stroke="#0d9488" stroke-width="2" marker-end="url(#arrA)"/><rect x="336" y="140" width="236" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="372" cy="178" r="18" fill="#6d28d9"/><text x="372" y="184" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="402" y="184" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Approved</text><text x="356" y="232" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">District manager approves 6</text><text x="356" y="251" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">units</text><line x1="574" y1="235" x2="598" y2="235" stroke="#0d9488" stroke-width="2" marker-end="url(#arrA)"/><rect x="602" y="140" width="236" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="638" cy="178" r="18" fill="#b45309"/><text x="638" y="184" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="668" y="184" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Picked</text><text x="622" y="232" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Lakeside scans 6 units into</text><text x="622" y="251" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">a tote</text><line x1="840" y1="235" x2="864" y2="235" stroke="#0d9488" stroke-width="2" marker-end="url(#arrA)"/><rect x="868" y="140" width="236" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="904" cy="178" r="18" fill="#c2410c"/><text x="904" y="184" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="934" y="184" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">In transit</text><text x="888" y="232" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Units show as in transit,</text><text x="888" y="251" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">not available</text><line x1="1106" y1="235" x2="1130" y2="235" stroke="#0d9488" stroke-width="2" marker-end="url(#arrA)"/><rect x="1134" y="140" width="236" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><circle cx="1170" cy="178" r="18" fill="#059669"/><text x="1170" y="184" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1200" y="184" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Received</text><text x="1154" y="232" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Westfield scans 6 units in,</text><text x="1154" y="251" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">0 variance</text><rect x="70" y="370" width="640" height="490" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="98" y="408" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Stock before and after · LS-WHT-M</text><text x="380" y="444" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">Before</text><text x="520" y="444" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">After</text><line x1="98" y1="458" x2="682" y2="458" stroke="#f1f5f9"/><text x="98" y="488" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Lakeside</text><rect x="346" y="468" width="68" height="34" rx="8" fill="#f1f5f9" /><text x="380" y="490" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">9</text><rect x="486" y="468" width="68" height="34" rx="8" fill="#ccfbf1" /><text x="520" y="490" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">3</text><text x="682" y="490" font-size="13" font-weight="700" fill="#b45309" text-anchor="end">-6</text><line x1="98" y1="520" x2="682" y2="520" stroke="#f1f5f9"/><text x="98" y="550" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Westfield Mall</text><rect x="346" y="530" width="68" height="34" rx="8" fill="#fee2e2" /><text x="380" y="552" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">0</text><rect x="486" y="530" width="68" height="34" rx="8" fill="#ccfbf1" /><text x="520" y="552" font-size="14" font-weight="700" fill="#0f766e" text-anchor="middle">6</text><text x="682" y="552" font-size="13" font-weight="700" fill="#059669" text-anchor="end">+6</text><line x1="98" y1="582" x2="682" y2="582" stroke="#f1f5f9"/><text x="98" y="612" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Downtown</text><rect x="346" y="592" width="68" height="34" rx="8" fill="#f1f5f9" /><text x="380" y="614" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">2</text><rect x="486" y="592" width="68" height="34" rx="8" fill="#f1f5f9" /><text x="520" y="614" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">2</text><line x1="98" y1="644" x2="682" y2="644" stroke="#f1f5f9"/><text x="98" y="674" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Northgate</text><rect x="346" y="654" width="68" height="34" rx="8" fill="#f1f5f9" /><text x="380" y="676" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">1</text><rect x="486" y="654" width="68" height="34" rx="8" fill="#f1f5f9" /><text x="520" y="676" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">1</text><line x1="98" y1="706" x2="682" y2="706" stroke="#f1f5f9"/><text x="98" y="736" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">DC</text><rect x="346" y="716" width="68" height="34" rx="8" fill="#f1f5f9" /><text x="380" y="738" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">12</text><rect x="486" y="716" width="68" height="34" rx="8" fill="#f1f5f9" /><text x="520" y="738" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">12</text><text x="98" y="810" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Chain total unchanged: 24 units. Stock moved to where it sells.</text><rect x="734" y="370" width="636" height="490" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="762" y="408" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Open transfers</text><line x1="762" y1="428" x2="1342" y2="428" stroke="#f1f5f9"/><text x="762" y="456" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">TR-3318</text><text x="862" y="456" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">Lakeside → Westfield</text><text x="1100" y="456" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">6 units</text><rect x="1267" y="440" width="75" height="24" rx="12" fill="#d1fae5" /><text x="1304.5" y="456" font-size="11.5" font-weight="700" fill="#059669" text-anchor="middle">Received</text><line x1="762" y1="490" x2="1342" y2="490" stroke="#f1f5f9"/><text x="762" y="518" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">TR-3315</text><text x="862" y="518" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">DC → Downtown</text><text x="1100" y="518" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">240 units</text><rect x="1253" y="502" width="89" height="24" rx="12" fill="#ffedd5" /><text x="1297.5" y="518" font-size="11.5" font-weight="700" fill="#c2410c" text-anchor="middle">In transit</text><line x1="762" y1="552" x2="1342" y2="552" stroke="#f1f5f9"/><text x="762" y="580" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">TR-3312</text><text x="862" y="580" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">Lakeside → Northgate</text><text x="1100" y="580" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">18 units</text><rect x="1233" y="564" width="109" height="24" rx="12" fill="#fee2e2" /><text x="1287.5" y="580" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">In transit 4d</text><line x1="762" y1="614" x2="1342" y2="614" stroke="#f1f5f9"/><text x="762" y="642" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">TR-3309</text><text x="862" y="642" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">Northgate → DC</text><text x="1100" y="642" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">36 units</text><rect x="1280" y="626" width="62" height="24" rx="12" fill="#fef3c7" /><text x="1311" y="642" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">Picked</text><line x1="762" y1="676" x2="1342" y2="676" stroke="#f1f5f9"/><text x="762" y="704" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">TR-3306</text><text x="862" y="704" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">Downtown → Lakeside</text><text x="1100" y="704" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">12 units</text><rect x="1267" y="688" width="75" height="24" rx="12" fill="#ede9fe" /><text x="1304.5" y="704" font-size="11.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Approved</text><line x1="762" y1="738" x2="1342" y2="738" stroke="#f1f5f9"/><text x="762" y="766" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">TR-3301</text><text x="862" y="766" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">DC → all stores</text><text x="1100" y="766" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">1,320 units</text><rect x="1253" y="750" width="89" height="24" rx="12" fill="#dbeafe" /><text x="1297.5" y="766" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Allocation</text>
