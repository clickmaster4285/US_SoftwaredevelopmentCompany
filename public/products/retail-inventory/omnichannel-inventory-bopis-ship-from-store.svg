<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Omnichannel inventory flow showing available-to-sell stock for online orders, buy online pick up in store and ship-from-store" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Omnichannel inventory flow showing available-to-sell stock for online orders, buy online pick up in store and ship-from-store</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#042f2e" flood-opacity="0.16"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d9488" stop-opacity="0.22"/><stop offset="1" stop-color="#0d9488" stop-opacity="0"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0d9488"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#f0fdfa" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">One stock pool for every channel</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Available-to-sell, BOPIS and ship-from-store · SKU CT-BLK-L · placeholder data</text><rect x="560" y="130" width="320" height="250" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="720" y="168" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">Inventory pool</text><text x="720" y="190" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">CT-BLK-L · all locations</text><text x="592" y="226" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">On hand</text><text x="848" y="226" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="end">186</text><text x="592" y="256" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Reserved (online)</text><text x="848" y="256" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="end">−9</text><text x="592" y="286" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Damaged / held</text><text x="848" y="286" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="end">−3</text><text x="592" y="316" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Safety stock</text><text x="848" y="316" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="end">−10</text><text x="592" y="346" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start">Available to sell</text><text x="848" y="346" font-size="13.5" font-weight="700" fill="#0f766e" text-anchor="end">164</text><rect x="80" y="160" width="380" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="80" y="160" width="380" height="8" rx="4" fill="#1d4ed8" /><text x="104" y="204" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Website &amp; app</text><text x="104" y="230" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Shows 164 available</text><text x="104" y="254" font-size="12.5" font-weight="500" fill="#1d4ed8" text-anchor="start">Order #W-5521 reserves 1 unit</text><rect x="980" y="160" width="380" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="980" y="160" width="380" height="8" rx="4" fill="#6d28d9" /><text x="1004" y="204" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Marketplaces</text><text x="1004" y="230" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Shows 150 (channel buffer 14)</text><text x="1004" y="254" font-size="12.5" font-weight="500" fill="#6d28d9" text-anchor="start">Synced every 5 minutes</text><line x1="462" y1="220" x2="556" y2="240" stroke="#0d9488" stroke-width="2" marker-end="url(#arrA)"/><line x1="978" y1="220" x2="884" y2="240" stroke="#0d9488" stroke-width="2" marker-end="url(#arrA)"/><line x1="720" y1="384" x2="270" y2="464" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="80" y="470" width="400" height="170" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="100" y="490" width="55" height="24" rx="12" fill="#d1fae5" /><text x="127.5" y="506" font-size="11.5" font-weight="700" fill="#059669" text-anchor="middle">BOPIS</text><text x="100" y="554" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Buy online, pick up in store</text><text x="100" y="582" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Downtown has 14 · picker notified · ready in</text><text x="100" y="602" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">2 hours</text><line x1="720" y1="384" x2="710" y2="464" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="520" y="470" width="400" height="170" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="540" y="490" width="42" height="24" rx="12" fill="#fef3c7" /><text x="561" y="506" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">SFS</text><text x="540" y="554" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Ship from store</text><text x="540" y="582" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Lakeside has 3 and is closest to the</text><text x="540" y="602" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">customer</text><line x1="720" y1="384" x2="1150" y2="464" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="960" y="470" width="400" height="170" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="980" y="490" width="35" height="24" rx="12" fill="#dbeafe" /><text x="997.5" y="506" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">DC</text><text x="980" y="554" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Ship from DC</text><text x="980" y="582" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Default for orders with 4+ units</text><rect x="80" y="680" width="1280" height="170" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="108" y="718" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Order routing rules</text><circle cx="120" cy="754" r="12" fill="#0d9488"/><text x="120" y="759" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="142" y="759" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">Customer chose pickup → reserve at that store</text><circle cx="740" cy="754" r="12" fill="#0d9488"/><text x="740" y="759" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="762" y="759" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">Ship orders → nearest store with available stock</text><circle cx="120" cy="798" r="12" fill="#0d9488"/><text x="120" y="803" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="142" y="803" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">Keep 2 display units in every store</text><circle cx="740" cy="798" r="12" fill="#0d9488"/><text x="740" y="803" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="762" y="803" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">Fall back to the DC if no store qualifies</text>
</svg>
