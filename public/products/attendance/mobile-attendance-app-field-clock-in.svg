<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Mobile attendance app for field employees with clock-in button, assigned job site and offline sync status" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Mobile attendance app for field employees with clock-in button, assigned job site and offline sync status</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#071c2b" flood-opacity="0.14"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0284c7" stop-opacity="0.24"/><stop offset="1" stop-color="#0284c7" stop-opacity="0"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
<linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0c4a6e"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0284c7"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#eef5f9"/><circle cx="200" cy="160" r="220" fill="#e0f2fe" opacity="0.8"/><circle cx="1240" cy="780" r="240" fill="#cffafe" opacity="0.5"/><text x="720" y="64" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Mobile clock-in for field employees</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Location captured at clock events only · illustrative concept</text><rect x="240" y="130" width="340" height="700" rx="46" fill="#08131c" filter="url(#sh2)"/><rect x="253" y="143" width="314" height="674" rx="36" fill="#fbfdfe"/><rect x="360" y="154" width="100" height="22" rx="11" fill="#08131c"/><text x="272" y="220" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Hi, Leo</text><text x="272" y="242" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Service technician · Field team</text><rect x="272" y="260" width="276" height="34" rx="10" fill="#fef3c7"/><text x="286" y="282" font-size="12" font-weight="700" fill="#b45309" text-anchor="start">Offline · 1 punch will sync later</text><text x="272" y="326" font-size="10.5" font-weight="800" fill="#64748b" text-anchor="start" letter-spacing="1.2">ASSIGNED SITE</text><rect x="272" y="336" width="276" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="286" y="362" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Site 14 · Riverside Mall</text><text x="286" y="382" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Job J-2291 · HVAC maintenance</text><circle cx="410" cy="510" r="88" fill="#e0f2fe"/><circle cx="410" cy="510" r="70" fill="url(#core)"/><text x="410" y="506" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">Clock in</text><text x="410" y="528" font-size="13" font-weight="600" fill="#e0f2fe" text-anchor="middle">7:09 AM</text><rect x="272" y="622" width="276" height="82" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/><text x="286" y="646" font-size="12.5" font-weight="700" fill="#0369a1" text-anchor="start">Location notice</text><text x="286" y="666" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="start">Your location is recorded only when</text><text x="286" y="684" font-size="11.5" font-weight="500" fill="#0f172a" text-anchor="start">you clock in or out. View policy</text><text x="292" y="780" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">Clock</text><text x="368" y="780" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Schedule</text><text x="444" y="780" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Hours</text><text x="520" y="780" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Requests</text><rect x="640" y="130" width="340" height="700" rx="46" fill="#08131c" filter="url(#sh2)"/><rect x="653" y="143" width="314" height="674" rx="36" fill="#fbfdfe"/><rect x="760" y="154" width="100" height="22" rx="11" fill="#08131c"/><text x="672" y="220" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">My hours</text><text x="672" y="242" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Week of Nov 17</text><rect x="672" y="260" width="276" height="90" rx="16" fill="url(#banner)"/><text x="690" y="290" font-size="10.5" font-weight="800" fill="#bae6fd" text-anchor="start" letter-spacing="1.2">THIS WEEK</text><text x="690" y="328" font-size="28" font-weight="700" fill="#fff" text-anchor="start">31.5 h</text><text x="930" y="328" font-size="13" font-weight="500" fill="#e0f2fe" text-anchor="end">of 40</text><rect x="672" y="380" width="276" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="686" y="400" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Mon</text><text x="686" y="418" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Site 14</text><text x="934" y="410" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end">8.0 h</text><rect x="672" y="438" width="276" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="686" y="458" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Tue</text><text x="686" y="476" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Site 9</text><text x="934" y="468" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end">8.5 h</text><rect x="672" y="496" width="276" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="686" y="516" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Wed</text><text x="686" y="534" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Site 14</text><text x="934" y="526" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end">7.5 h</text><rect x="672" y="554" width="276" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="686" y="574" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Thu</text><text x="686" y="592" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">In progress</text><text x="934" y="584" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end">7.5 h</text><rect x="672" y="622" width="276" height="46" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="810" y="650" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Request a correction</text><rect x="672" y="682" width="276" height="46" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="810" y="710" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">View my schedule</text><text x="692" y="780" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Clock</text><text x="768" y="780" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Schedule</text><text x="844" y="780" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">Hours</text><text x="920" y="780" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Requests</text><rect x="1060" y="220" width="300" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="1060" y="220" width="6" height="120" rx="3" fill="#0284c7"/><text x="1084" y="258" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Offline-first</text><text x="1084" y="284" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Punches are stored on the device</text><text x="1084" y="302" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">and synced with original</text><text x="1084" y="320" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">timestamps.</text><rect x="1060" y="370" width="300" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="1060" y="370" width="6" height="120" rx="3" fill="#0284c7"/><text x="1084" y="408" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Job and site selection</text><text x="1084" y="434" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Hours land on the right project or</text><text x="1084" y="452" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">cost center.</text><rect x="1060" y="520" width="300" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="1060" y="520" width="6" height="120" rx="3" fill="#0284c7"/><text x="1084" y="558" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">SSO and managed devices</text><text x="1084" y="584" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Same sign-in as other company</text><text x="1084" y="602" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">apps.</text>
</svg>
