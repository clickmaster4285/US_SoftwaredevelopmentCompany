<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Integration workflow connecting HRMS, clock-in devices and mobile apps to the attendance system and on to payroll and ERP" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Integration workflow connecting HRMS, clock-in devices and mobile apps to the attendance system and on to payroll and ERP</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#071c2b" flood-opacity="0.14"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0284c7" stop-opacity="0.24"/><stop offset="1" stop-color="#0284c7" stop-opacity="0"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
<linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0c4a6e"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0284c7"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff"/><text x="600" y="52" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">How attendance data flows</text><text x="600" y="82" font-size="14.5" font-weight="500" fill="#64748b" text-anchor="middle">Employee data comes from HR, punches from devices and apps, approved hours go to payroll and ERP</text><rect x="50" y="120" width="300" height="176" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="50" y="120" width="300" height="6" rx="3" fill="#10b981"/><text x="70" y="158" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">HRMS</text><text x="70" y="178" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Owns employee data</text><rect x="70" y="194" width="260" height="26" rx="8" fill="#f8fafc"/><text x="82" y="212" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Employees, managers, sites</text><rect x="70" y="228" width="260" height="26" rx="8" fill="#f8fafc"/><text x="82" y="246" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Approved leave</text><rect x="50" y="330" width="300" height="210" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="50" y="330" width="300" height="6" rx="3" fill="#f59e0b"/><text x="70" y="368" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Clock-in devices</text><text x="70" y="388" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Hardware-dependent</text><rect x="70" y="404" width="260" height="26" rx="8" fill="#f8fafc"/><text x="82" y="422" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Kiosks (PIN, photo)</text><rect x="70" y="438" width="260" height="26" rx="8" fill="#f8fafc"/><text x="82" y="456" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Badge / RFID readers</text><rect x="70" y="472" width="260" height="26" rx="8" fill="#f8fafc"/><text x="82" y="490" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Biometric terminals*</text><rect x="50" y="574" width="300" height="176" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="50" y="574" width="300" height="6" rx="3" fill="#7c3aed"/><text x="70" y="612" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Mobile &amp; web</text><text x="70" y="632" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Field, remote, office</text><rect x="70" y="648" width="260" height="26" rx="8" fill="#f8fafc"/><text x="82" y="666" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Offline-first mobile app</text><rect x="70" y="682" width="260" height="26" rx="8" fill="#f8fafc"/><text x="82" y="700" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Web clock and self-service</text><rect x="450" y="250" width="300" height="320" rx="28" fill="url(#core)" filter="url(#sh2)"/><text x="600" y="306" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">Attendance</text><text x="600" y="330" font-size="12.5" font-weight="600" fill="#e0f2fe" text-anchor="middle">Owns punches and approvals</text><rect x="480" y="356" width="240" height="34" rx="10" fill="#ffffff" opacity="0.16"/><text x="600" y="378" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Shifts and policies</text><rect x="480" y="400" width="240" height="34" rx="10" fill="#ffffff" opacity="0.16"/><text x="600" y="422" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Hours, breaks, overtime</text><rect x="480" y="444" width="240" height="34" rx="10" fill="#ffffff" opacity="0.16"/><text x="600" y="466" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Exceptions and approvals</text><rect x="480" y="488" width="240" height="34" rx="10" fill="#ffffff" opacity="0.16"/><text x="600" y="510" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Audit trail and locking</text><rect x="850" y="140" width="300" height="176" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="850" y="140" width="300" height="6" rx="3" fill="#ea580c"/><text x="870" y="178" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Payroll</text><text x="870" y="198" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Consumes approved hours</text><rect x="870" y="214" width="260" height="26" rx="8" fill="#f8fafc"/><text x="882" y="232" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Regular, OT, premium hours</text><rect x="870" y="248" width="260" height="26" rx="8" fill="#f8fafc"/><text x="882" y="266" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Locked per pay period</text><rect x="850" y="350" width="300" height="176" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="850" y="350" width="300" height="6" rx="3" fill="#334155"/><text x="870" y="388" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">ERP / accounting</text><text x="870" y="408" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Labor cost</text><rect x="870" y="424" width="260" height="26" rx="8" fill="#f8fafc"/><text x="882" y="442" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Hours by cost center</text><rect x="870" y="458" width="260" height="26" rx="8" fill="#f8fafc"/><text x="882" y="476" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Job and project costing</text><rect x="850" y="560" width="300" height="176" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="850" y="560" width="300" height="6" rx="3" fill="#0891b2"/><text x="870" y="598" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Reports &amp; BI</text><text x="870" y="618" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Workforce analytics</text><rect x="870" y="634" width="260" height="26" rx="8" fill="#f8fafc"/><text x="882" y="652" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Scheduled vs. actual</text><rect x="870" y="668" width="260" height="26" rx="8" fill="#f8fafc"/><text x="882" y="686" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Absence and overtime trends</text><path d="M352 208 C 399 208, 399 300, 446 300" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrA)"/><path d="M352 435 C 399 435, 399 410, 446 410" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrA)"/><path d="M352 662 C 399 662, 399 520, 446 520" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrA)"/><path d="M752 320 C 799 320, 799 228, 846 228" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrA)"/><path d="M752 410 C 799 410, 799 438, 846 438" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrA)"/><path d="M752 500 C 799 500, 799 648, 846 648" fill="none" stroke="#0891b2" stroke-width="3" marker-end="url(#arrA)"/><text x="600" y="796" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">*Biometric and location options need notice, consent where required, and legal review. Each field has one owner; late edits after payroll become adjustments.</text>
</svg>
