<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" role="img" aria-label="Patient health information lifecycle in an electronic health record system" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Patient health information lifecycle in an electronic health record system</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#082f49" flood-opacity="0.13"/></filter>
<linearGradient id="areaS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0284c7" stop-opacity="0.25"/><stop offset="1" stop-color="#0284c7" stop-opacity="0"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
<linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0c4a6e"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0284c7"/></marker>
<marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0d9488"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="560" rx="0" fill="#ffffff" />
<text x="700" y="54" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle" >The patient health information lifecycle</text><text x="700" y="84" font-size="15" font-weight="500" fill="#64748b" text-anchor="middle" >Every step adds to one record that follows the patient over time.</text><rect x="58" y="130" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><circle cx="92" cy="166" r="17" fill="#0284c7"/><text x="92" y="172" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="120" y="172" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >Patient registration</text><text x="80" y="212" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Identity, contacts, consent</text><path d="M290 189h26" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrS)"/><rect x="322" y="130" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><circle cx="356" cy="166" r="17" fill="#0284c7"/><text x="356" y="172" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="384" y="172" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >Patient identification</text><text x="344" y="212" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Match or prevent duplicates</text><path d="M554 189h26" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrS)"/><rect x="586" y="130" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><circle cx="620" cy="166" r="17" fill="#0d9488"/><text x="620" y="172" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="648" y="172" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >Medical history</text><text x="608" y="212" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Past, family and social history</text><path d="M818 189h26" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrS)"/><rect x="850" y="130" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><circle cx="884" cy="166" r="17" fill="#0d9488"/><text x="884" y="172" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="912" y="172" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >Clinical assessment</text><text x="872" y="212" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Vitals, symptoms, exam</text><path d="M1082 189h26" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrS)"/><rect x="1114" y="130" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><circle cx="1148" cy="166" r="17" fill="#4f46e5"/><text x="1148" y="172" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" >5</text><text x="1176" y="172" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >Diagnosis</text><text x="1136" y="212" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Coded problem list</text><rect x="1114" y="320" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><circle cx="1148" cy="356" r="17" fill="#4f46e5"/><text x="1148" y="362" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" >6</text><text x="1176" y="362" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >Medication records</text><text x="1136" y="402" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Prescribe and check allergies</text><path d="M1110 379h-26" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrS)"/><rect x="850" y="320" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><circle cx="884" cy="356" r="17" fill="#9333ea"/><text x="884" y="362" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" >7</text><text x="912" y="362" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >Lab and diagnostics</text><text x="872" y="402" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Results filed via HL7 / FHIR</text><path d="M846 379h-26" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrS)"/><rect x="586" y="320" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><circle cx="620" cy="356" r="17" fill="#9333ea"/><text x="620" y="362" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" >8</text><text x="648" y="362" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >Treatment</text><text x="608" y="402" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Care plan, signed note</text><path d="M582 379h-26" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrS)"/><rect x="322" y="320" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><circle cx="356" cy="356" r="17" fill="#d97706"/><text x="356" y="362" font-size="15" font-weight="800" fill="#fff" text-anchor="middle" >9</text><text x="384" y="362" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >Follow-up</text><text x="344" y="402" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Tasks and next visit</text><path d="M318 379h-26" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrS)"/><rect x="58" y="320" width="228" height="118" rx="18" fill="url(#core)" filter="url(#sh2)"/><circle cx="92" cy="356" r="17" fill="#fff"/><text x="92" y="362" font-size="15" font-weight="800" fill="#0284c7" text-anchor="middle" >10</text><text x="120" y="362" font-size="15" font-weight="700" fill="#fff" text-anchor="start" >Longitudinal record</text><text x="80" y="402" font-size="13" font-weight="500" fill="#e0f2fe" text-anchor="start" >Updated with every encounter</text><path d="M1228 254V310" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrS)"/><path d="M172 446 V498 H24 V189 H50" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrT)"/><text x="186" y="490" font-size="13" font-weight="600" fill="#16a34a" text-anchor="start" >Next visit starts with the full record</text>
</svg>