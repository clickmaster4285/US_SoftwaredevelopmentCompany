<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Healthcare data exchange workflow between EHR and laboratory system" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Healthcare data exchange workflow between EHR and laboratory system</title>
