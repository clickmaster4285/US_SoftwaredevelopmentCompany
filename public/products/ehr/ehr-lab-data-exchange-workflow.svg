<rect x="0" y="0" width="1200" height="700" rx="0" fill="#ffffff" />
<text x="600" y="52" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle" >Healthcare data exchange: EHR and laboratory</text><text x="600" y="82" font-size="15" font-weight="500" fill="#64748b" text-anchor="middle" >From electronic order to an acknowledged result, without re-keying or fax.</text><rect x="80" y="112" width="200" height="56" rx="14" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="94" y="124" width="32" height="32" rx="9" fill="#0d94881f" /><path transform="translate(101 131)" d="M6.5 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM1 16c0-3 2.5-5 5.5-5s5.5 2 5.5 5M12.5 2.3a3 3 0 0 1 0 5.4M14 11c2 .6 3 2.4 3 5" fill="none" stroke="#0d9488" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="146" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start" >Clinician</text><line x1="180" y1="176" x2="180" y2="660" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/><rect x="370" y="112" width="200" height="56" rx="14" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="384" y="124" width="32" height="32" rx="9" fill="#0284c71f" /><path transform="translate(391 131)" d="M4 1.5h10v15H4zM7 5h4M7 8h4M7 11h2" fill="none" stroke="#0284c7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="426" y="146" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start" >EHR</text><line x1="470" y1="176" x2="470" y2="660" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/><rect x="640" y="112" width="200" height="56" rx="14" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="654" y="124" width="32" height="32" rx="9" fill="#4f46e51f" /><path transform="translate(661 131)" d="M5 3h8v13H5zM7 1.5h4v3H7zM7.5 8h3M7.5 11h3" fill="none" stroke="#4f46e5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="696" y="146" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start" >Interface engine</text><line x1="740" y1="176" x2="740" y2="660" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/><rect x="910" y="112" width="200" height="56" rx="14" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="924" y="124" width="32" height="32" rx="9" fill="#9333ea1f" /><path transform="translate(931 131)" d="M7 1.5h4M8 1.5v5L3 15.5h12L10 6.5v-5M5.5 11h7" fill="none" stroke="#9333ea" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="966" y="146" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start" >Laboratory (LIS)</text><line x1="1010" y1="176" x2="1010" y2="660" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/><path d="M188 232H460" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrS)"/><circle cx="206" cy="212" r="12" fill="#0284c7"/><text x="206" y="216.5" font-size="12" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="337" y="216" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" >Order placed in chart</text><text x="337" y="252" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle" >HbA1c + CMP · linked to encounter</text><path d="M478 312H730" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrS)"/><circle cx="496" cy="292" r="12" fill="#0284c7"/><text x="496" y="296.5" font-size="12" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="617" y="296" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" >Order message</text><text x="617" y="332" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle" >HL7 ORM / OML or FHIR ServiceRequest</text><path d="M748 372H1000" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrS)"/><circle cx="766" cy="352" r="12" fill="#0284c7"/><text x="766" y="356.5" font-size="12" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="887" y="356" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" >Routed to lab</text><text x="887" y="392" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle" >Mapped codes · TLS · acknowledged (ACK)</text><rect x="903" y="414" width="214" height="52" rx="12" fill="#9333ea14" stroke="#9333ea" stroke-opacity="0.5"/><text x="1010" y="437" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" >Sample processed</text><text x="1010" y="455" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle" >Results verified by lab</text><path d="M1002 512H750" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrS)"/><circle cx="766" cy="492" r="12" fill="#0284c7"/><text x="766" y="496.5" font-size="12" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="887" y="496" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" >Result message</text><text x="887" y="532" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle" >HL7 ORU or FHIR Observation · LOINC</text><path d="M732 572H480" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrS)"/><circle cx="496" cy="552" r="12" fill="#0284c7"/><text x="496" y="556.5" font-size="12" font-weight="800" fill="#fff" text-anchor="middle" >5</text><text x="617" y="556" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" >Matched and filed</text><text x="617" y="592" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle" >MRN + DOB + order ID · abnormal flagged</text><path d="M462 632H190" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrT)"/><circle cx="206" cy="612" r="12" fill="#0d9488"/><text x="206" y="616.5" font-size="12" font-weight="800" fill="#fff" text-anchor="middle" >6</text><text x="337" y="616" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle" >Task: review result</text><text x="337" y="652" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle" >Clinician acknowledges · patient notified</text>
</svg>