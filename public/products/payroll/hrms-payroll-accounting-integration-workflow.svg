<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Payroll integration workflow connecting HRMS, time and attendance, accounting or ERP and payment systems" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Payroll integration workflow connecting HRMS, time and attendance, accounting or ERP and payment systems</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#24140a" flood-opacity="0.14"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ea580c" stop-opacity="0.24"/><stop offset="1" stop-color="#ea580c" stop-opacity="0"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
<linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c2d12"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ea580c"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff"/><text x="600" y="52" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">How payroll connects to HR, time and finance</text><text x="600" y="82" font-size="14.5" font-weight="500" fill="#64748b" text-anchor="middle">Each field has one owner; data arrives with its effective date and is validated before the run</text><rect x="60" y="130" width="300" height="210" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="60" y="130" width="300" height="6" rx="3" fill="#10b981"/><text x="80" y="168" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">HRMS</text><text x="80" y="188" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Owns people and job data</text><rect x="80" y="204" width="260" height="26" rx="8" fill="#f8fafc"/><text x="92" y="222" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">New hires and terminations</text><rect x="80" y="238" width="260" height="26" rx="8" fill="#f8fafc"/><text x="92" y="256" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Job and pay changes</text><rect x="80" y="272" width="260" height="26" rx="8" fill="#f8fafc"/><text x="92" y="290" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Benefit deductions</text><rect x="60" y="480" width="300" height="210" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="60" y="480" width="300" height="6" rx="3" fill="#0891b2"/><text x="80" y="518" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Time &amp; attendance</text><text x="80" y="538" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Owns hours</text><rect x="80" y="554" width="260" height="26" rx="8" fill="#f8fafc"/><text x="92" y="572" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Approved hours and overtime</text><rect x="80" y="588" width="260" height="26" rx="8" fill="#f8fafc"/><text x="92" y="606" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Leave taken</text><rect x="80" y="622" width="260" height="26" rx="8" fill="#f8fafc"/><text x="92" y="640" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Job codes and shifts</text><rect x="450" y="260" width="300" height="300" rx="28" fill="url(#core)" filter="url(#sh2)"/><text x="600" y="316" font-size="28" font-weight="800" fill="#fff" text-anchor="middle">Payroll</text><text x="600" y="340" font-size="12.5" font-weight="600" fill="#ffedd5" text-anchor="middle">Owns pay rules and pay runs</text><rect x="480" y="366" width="240" height="32" rx="10" fill="#ffffff" opacity="0.16"/><text x="600" y="387" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Earnings and deductions</text><rect x="480" y="408" width="240" height="32" rx="10" fill="#ffffff" opacity="0.16"/><text x="600" y="429" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Gross-to-net or provider</text><rect x="480" y="450" width="240" height="32" rx="10" fill="#ffffff" opacity="0.16"/><text x="600" y="471" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Review and approval</text><rect x="480" y="492" width="240" height="32" rx="10" fill="#ffffff" opacity="0.16"/><text x="600" y="513" font-size="12.5" font-weight="600" fill="#fff" text-anchor="middle">Locked pay records</text><rect x="840" y="110" width="300" height="176" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="840" y="110" width="300" height="6" rx="3" fill="#334155"/><text x="860" y="148" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Accounting / ERP</text><text x="860" y="168" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Owns the ledger</text><rect x="860" y="184" width="260" height="26" rx="8" fill="#f8fafc"/><text x="872" y="202" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Payroll journal entries</text><rect x="860" y="218" width="260" height="26" rx="8" fill="#f8fafc"/><text x="872" y="236" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Cost allocation by dept.</text><rect x="840" y="322" width="300" height="176" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="840" y="322" width="300" height="6" rx="3" fill="#7c3aed"/><text x="860" y="360" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Payroll provider / tax</text><text x="860" y="380" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Calculation, filing, payment</text><rect x="860" y="396" width="260" height="26" rx="8" fill="#f8fafc"/><text x="872" y="414" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Approved pay data out</text><rect x="860" y="430" width="260" height="26" rx="8" fill="#f8fafc"/><text x="872" y="448" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Tax filings and payments</text><rect x="840" y="534" width="300" height="176" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="840" y="534" width="300" height="6" rx="3" fill="#db2777"/><text x="860" y="572" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Bank &amp; self-service</text><text x="860" y="592" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Payment and payslips</text><rect x="860" y="608" width="260" height="26" rx="8" fill="#f8fafc"/><text x="872" y="626" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Direct deposit file</text><rect x="860" y="642" width="260" height="26" rx="8" fill="#f8fafc"/><text x="872" y="660" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Payslips and W-2s</text><path d="M362 235 C 404 235, 404 330, 446 330" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrA)"/><rect x="330" y="253" width="140" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="400" y="271" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">effective-dated</text><path d="M362 585 C 404 585, 404 490, 446 490" fill="none" stroke="#0891b2" stroke-width="3" marker-end="url(#arrA)"/><rect x="330" y="545" width="140" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="400" y="563" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">approved only</text><path d="M752 330 C 794 330, 794 198, 836 198" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrA)"/><path d="M752 410 C 794 410, 794 410, 836 410" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrA)"/><path d="M752 490 C 794 490, 794 622, 836 622" fill="none" stroke="#db2777" stroke-width="3" marker-end="url(#arrA)"/><rect x="200" y="740" width="800" height="50" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/><text x="600" y="771" font-size="13.5" font-weight="600" fill="#c2410c" text-anchor="middle">Validation before the run · cut-off times · retry and alert on failed syncs</text>
</svg>
