<rect x="0" y="0" width="1440" height="900" rx="0" fill="#eef2ff" /><rect x="0" y="0" width="1440" height="72" rx="0" fill="#14123a" /><text x="40" y="44" font-size="18" font-weight="700" fill="#fff" text-anchor="start">BIO 101 Final · Set B</text><text x="330" y="44" font-size="13" font-weight="500" fill="#c7d2fe" text-anchor="start">Candidate 2026-04418</text><rect x="1000" y="18" width="170" height="36" rx="18" fill="#ffffff1a" /><text x="1085" y="42" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">⏱ 0:48:04 left</text><rect x="1190" y="18" width="210" height="36" rx="18" fill="#059669" /><text x="1295" y="42" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">✓ Saved 10:41:56</text><rect x="40" y="100" width="940" height="760" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="72" y="146" font-size="13" font-weight="700" fill="#4338ca" text-anchor="start">Section B · Question 7 of 10</text><text x="948" y="146" font-size="13" font-weight="700" fill="#64748b" text-anchor="end">2 marks</text><text x="72" y="190" font-size="18" font-weight="600" fill="#0f172a" text-anchor="start">A cell is placed in a solution with a higher solute concentration than its</text><text x="72" y="218" font-size="18" font-weight="600" fill="#0f172a" text-anchor="start">cytoplasm. Describe what happens to the cell and explain why, using the term</text><text x="72" y="246" font-size="18" font-weight="600" fill="#0f172a" text-anchor="start">osmosis.</text><rect x="72" y="290" width="876" height="330" rx="12" fill="#fff" stroke="#4f46e5" stroke-width="2"/><text x="92" y="326" font-size="15" font-weight="500" fill="#0f172a" text-anchor="start">Water moves out of the cell by osmosis, because the water potential outside the cell is</text><text x="92" y="352" font-size="15" font-weight="500" fill="#0f172a" text-anchor="start">lower than inside. The cell loses volume; in an animal cell it shrinks and may crenate,</text><text x="92" y="378" font-size="15" font-weight="500" fill="#0f172a" text-anchor="start">while in a plant cell the membrane pulls away from the cell wall (plasmolysis).</text><text x="928" y="604" font-size="12" font-weight="500" fill="#64748b" text-anchor="end">62 words</text><rect x="72" y="650" width="180" height="44" rx="22" fill="#fff" stroke="#e2e8f0"/><text x="162" y="677" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">← Previous</text><rect x="272" y="650" width="200" height="44" rx="22" fill="#fef3c7" /><text x="372" y="677" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">⚑ Flag for review</text><rect x="768" y="650" width="180" height="44" rx="22" fill="#4f46e5" /><text x="858" y="677" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Next →</text><rect x="72" y="730" width="876" height="100" rx="12" fill="#eef2ff" /><text x="92" y="762" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Tools for this section</text><text x="92" y="790" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Highlighter · strike-through · zoom 125% · calculator disabled in Section B</text><text x="92" y="814" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="start">Accommodation applied: +25% time</text><rect x="1004" y="100" width="396" height="520" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="1028" y="140" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Question navigator</text><text x="1028" y="184" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">Section A</text><rect x="1028" y="194" width="29" height="29" rx="6" fill="#e0e7ff" stroke="#a5b4fc"/><text x="1042.5" y="213" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">1</text><rect x="1063" y="194" width="29" height="29" rx="6" fill="#e0e7ff" stroke="#a5b4fc"/><text x="1077.5" y="213" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">2</text><re