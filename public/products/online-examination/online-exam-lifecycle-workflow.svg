<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Online exam lifecycle workflow from question bank and scheduling to secure delivery, grading, moderation and results" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Online exam lifecycle workflow from question bank and scheduling to secure delivery, grading, moderation and results</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#14123a" flood-opacity="0.16"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f46e5" stop-opacity="0.22"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#eef2ff" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">The online exam lifecycle, end to end</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Each stage has its own roles, approvals and audit log</text><rect x="80" y="150" width="280" height="200" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="80" y="150" width="280" height="8" rx="4" fill="#1d4ed8" /><circle cx="122" cy="208" r="24" fill="#dbeafe"/><text x="122" y="215" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="middle">1</text><text x="104" y="268" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Question bank</text><text x="104" y="298" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Write, tag, review, approve</text><line x1="364" y1="250" x2="406" y2="250" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrA)"/><rect x="410" y="150" width="280" height="200" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="410" y="150" width="280" height="8" rx="4" fill="#6d28d9" /><circle cx="452" cy="208" r="24" fill="#ede9fe"/><text x="452" y="215" font-size="18" font-weight="700" fill="#6d28d9" text-anchor="middle">2</text><text x="434" y="268" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Exam builder</text><text x="434" y="298" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Sections, pools, paper sets</text><line x1="694" y1="250" x2="736" y2="250" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrA)"/><rect x="740" y="150" width="280" height="200" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="740" y="150" width="280" height="8" rx="4" fill="#0f766e" /><circle cx="782" cy="208" r="24" fill="#ccfbf1"/><text x="782" y="215" font-size="18" font-weight="700" fill="#0f766e" text-anchor="middle">3</text><text x="764" y="268" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Scheduling</text><text x="764" y="298" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Windows, time limits,</text><text x="764" y="318" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">accommodations</text><line x1="1024" y1="250" x2="1066" y2="250" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrA)"/><rect x="1070" y="150" width="280" height="200" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="1070" y="150" width="280" height="8" rx="4" fill="#c2410c" /><circle cx="1112" cy="208" r="24" fill="#ffedd5"/><text x="1112" y="215" font-size="18" font-weight="700" fill="#c2410c" text-anchor="middle">4</text><text x="1094" y="268" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Registration</text><text x="1094" y="298" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Candidates, fees, admit cards</text><line x1="1210" y1="354" x2="1210" y2="476" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrA)"/><rect x="1070" y="480" width="280" height="200" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="1070" y="480" width="280" height="8" rx="4" fill="#4f46e5" /><circle cx="1112" cy="538" r="24" fill="#e0e7ff"/><text x="1112" y="545" font-size="18" font-weight="700" fill="#4f46e5" text-anchor="middle">5</text><text x="1094" y="598" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Secure delivery</text><text x="1094" y="628" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Browser rules, proctoring,</text><text x="1094" y="648" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">autosave</text><line x1="1066" y1="580" x2="1024" y2="580" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrA)"/><rect x="740" y="480" width="280" height="200" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="740" y="480" width="280" height="8" rx="4" fill="#059669" /><circle cx="782" cy="538" r="24" fill="#d1fae5"/><text x="782" y="545" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">6</text><text x="764" y="598" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Grading</text><text x="764" y="628" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Auto-grade, rubric marking</text><line x1="736" y1="580" x2="694" y2="580" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrA)"/><rect x="410" y="480" width="280" height="200" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="410" y="480" width="280" height="8" rx="4" fill="#b45309" /><circle cx="452" cy="538" r="24" fill="#fef3c7"/><text x="452" y="545" font-size="18" font-weight="700" fill="#b45309" text-anchor="middle">7</text><text x="434" y="598" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Moderation</text><text x="434" y="628" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Double marking, discrepancies,</text><text x="434" y="648" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">appeals</text><line x1="406" y1="580" x2="364" y2="580" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrA)"/><rect x="80" y="480" width="280" height="200" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="80" y="480" width="280" height="8" rx="4" fill="#be185d" /><circle cx="122" cy="538" r="24" fill="#fce7f3"/><text x="122" y="545" font-size="18" font-weight="700" fill="#be185d" text-anchor="middle">8</text><text x="104" y="598" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Results &amp; analytics</text><text x="104" y="628" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Publish, certificates, item</text><text x="104" y="648" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">analysis</text><path d="M220 684 L220 770 L40 770 L40 250 L72 250" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/><text x="260" y="762" font-size="13.5" font-weight="600" fill="#64748b" text-anchor="start">Item analysis feeds back into the question bank for the next exam</text>
</svg>
