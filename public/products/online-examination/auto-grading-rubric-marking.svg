tart">Sections A-C · 698 scripts</text><rect x="304" y="186" width="312" height="72" rx="12" fill="#eef2ff" /><text x="320" y="214" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Section A · MCQ</text><text x="320" y="236" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">30 items · negative marking</text><rect x="551" y="198" width="49" height="24" rx="12" fill="#d1fae5" /><text x="575.5" y="214" font-size="11.5" font-weight="700" fill="#059669" text-anchor="middle">Done</text><rect x="304" y="272" width="312" height="72" rx="12" fill="#eef2ff" /><text x="320" y="300" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Section B · short answer</text><text x="320" y="322" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Keyword + manual check</text><rect x="525" y="284" width="75" height="24" rx="12" fill="#d1fae5" /><text x="562.5" y="300" font-size="11.5" font-weight="700" fill="#059669" text-anchor="middle">92% auto</text><rect x="304" y="358" width="312" height="72" rx="12" fill="#eef2ff" /><text x="320" y="386" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Section C · numeric</text><text x="320" y="408" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Tolerance ±1%</text><rect x="551" y="370" width="49" height="24" rx="12" fill="#d1fae5" /><text x="575.5" y="386" font-size="11.5" font-weight="700" fill="#059669" text-anchor="middle">Done</text><text x="304" y="470" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Marking progress · Section D</text><text x="304" y="506" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start">Marker 1 · S. Ortiz</text><rect x="304" y="516" width="250" height="10" rx="5" fill="#f1f5f9" /><rect x="304" y="516" width="195" height="10" rx="5" fill="#4f46e5" /><text x="616" y="526" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end">78%</text><text x="304" y="558" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start">Marker 2 · L. Chen</text><rect x="304" y="568" width="250" height="10" rx="5" fill="#f1f5f9" /><rect x="304" y="568" width="160" height="10" rx="5" fill="#4f46e5" /><text x="616" y="578" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end">64%</text><text x="304" y="610" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start">Marker 3 · P. Ward</text><rect x="304" y="620" width="250" height="10" rx="5" fill="#f1f5f9" /><rect x="304" y="620" width="177.5" height="10" rx="5" fill="#4f46e5" /><text x="616" y="630" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end">71%</text><text x="304" y="662" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="start">Moderation sample</text><rect x="304" y="672" width="250" height="10" rx="5" fill="#f1f5f9" /><rect x="304" y="672" width="87.5" height="10" rx="5" fill="#4f46e5" /><text x="616" y="682" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end">35%</text><rect x="304" y="730" width="312" height="120" rx="12" fill="#fef3c7" /><text x="320" y="760" font-size="13.5" font-weight="700" fill="#b45309" text-anchor="start">Discrepancy alert</text><text x="320" y="784" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="start">Script #0417: markers differ by 6 of</text><text x="320" y="803" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="start">20 marks. Sent to moderator.</text><rect x="664" y="100" width="746" height="470" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="688" y="138" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Script #0388 · Prompt 2</text><rect x="1197" y="118" width="189" height="24" rx="12" fill="#e0e7ff" /><text x="1291.5" y="134" font-size="11.5" font-weight="700" fill="#4338ca" text-anchor="middle">Candidate identity hidden</text><text x="688" y="172" font-size="13.5" font-weight="600" fill="#64748b" text-anchor="start">"Evaluate the evidence that mitochondria evolved from free-living bacteria."</text><rect x="688" y="188" width="698" height="360" rx="12" fill="#eef2ff" /><text x="708" y="220" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">The endosymbiotic theory proposes that mitochondria were once free-living bacteria engulfed by</text><text x="708" y="244" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">an ancestral cell. The strongest evidence is that mitochondria have their own circular DNA,</text><text x="708" y="268" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">similar to bacterial chromosomes, and divide by binary fission independently of the cell. They</text><text x="708" y="292" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">also contain 70S ribosomes like bacteria rather than the 80S ribosomes of the cytoplasm. Their</text><text x="708" y="316" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">double membrane is consistent with engulfment, with the inner membrane resembling a bacterial</text><text x="708" y="340" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">membrane. However, most mitochondrial proteins are now encoded in the nucleus, which shows genes</text><text x="708" y="364" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">transferred over time...</text><rect x="664" y="594" width="746" height="282" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="688" y="630" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Rubric</text><text x="1386" y="630" font-size="16" font-weight="700" fill="#4338ca" text-anchor="end">Total 16 / 20</text><text x="688" y="682" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Scientific accuracy</text><rect x="930" y="664" width="44" height="30" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="952" y="684" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="middle">0</text><rect x="982" y="664" width="44" height="30" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="1004" y="684" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="middle">1</text><rect x="1034" y="664" width="44" height="30" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="1056" y="684" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="middle">2</text><rect x="1086" y="664" width="44" height="30" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="1108" y="684" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="middle">3</text><rect x="1138" y="664" width="44" height="30" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="1160" y="684" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="middle">4</text><rect x="1190" y="664" width="44" height="30" rx="8" fill="#4f46e5" stroke="#4f46e5"/><text x="1212" y="684" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><rect x="1242" y="664" width="44" height="30" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="1264" y="684" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="middle">6</text><text x="1386" y="683" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">5/6</text><text x="688" y="732" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Use of evidence</text><rect x="930" y="714" width="44" height="30" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="952" y="734" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="middle">0</text><rect x="982" y="714" width="44" height="30" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="1004" y="734" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="middle">1</text><rect x="1034" y="714" width="44" height="30" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="1056" y="734" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="middle">2</text><rect x="1086" y="714" width="44" height="30" rx="8" fill