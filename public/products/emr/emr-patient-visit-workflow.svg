<rect x="0" y="0" width="1400" height="560" rx="0" fill="#ffffff" />
<text x="700" y="54" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle" >One patient visit through an EMR system</text><text x="700" y="84" font-size="15" font-weight="500" fill="#64748b" text-anchor="middle" >Every step writes to the same chart, and connected systems handle the rest.</text><rect x="57" y="130" width="196" height="196" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="57" y="130" width="196" height="6" rx="3" fill="#0284c7" /><rect x="77" y="158" width="42" height="42" rx="12" fill="#0284c71f" /><path transform="translate(86 167) scale(1.35)" d="M2 4h14v12H2zM2 8h14M6 2v4M12 2v4" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="233" y="186" font-size="22" font-weight="800" fill="#e2e8f0" text-anchor="end" >01</text><text x="77" y="234" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Before the visit</text><text x="77" y="262" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Booking, eligibility</text><text x="77" y="282" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >check, online intake</text><path d="M256 228h14" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="275" y="130" width="196" height="196" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="275" y="130" width="196" height="6" rx="3" fill="#0d9488" /><rect x="295" y="158" width="42" height="42" rx="12" fill="#0d94881f" /><path transform="translate(304 167) scale(1.35)" d="M6.5 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM1 16c0-3 2.5-5 5.5-5s5.5 2 5.5 5M12.5 2.3a3 3 0 0 1 0 5.4M14 11c2 .6 3 2.4 3 5" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="451" y="186" font-size="22" font-weight="800" fill="#e2e8f0" text-anchor="end" >02</text><text x="295" y="234" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Check-in &amp; rooming</text><text x="295" y="262" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Demographics, vitals,</text><text x="295" y="282" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >meds and allergies</text><path d="M474 228h14" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="493" y="130" width="196" height="196" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="493" y="130" width="196" height="6" rx="3" fill="#4f46e5" /><rect x="513" y="158" width="42" height="42" rx="12" fill="#4f46e51f" /><path transform="translate(522 167) scale(1.35)" d="M3 2h9l3 3v11H3zM6 7h6M6 10h6M6 13h3" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="669" y="186" font-size="22" font-weight="800" fill="#e2e8f0" text-anchor="end" >03</text><text x="513" y="234" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >The encounter</text><text x="513" y="262" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Template note with</text><text x="513" y="282" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >history on screen</text><path d="M692 228h14" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="711" y="130" width="196" height="196" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="711" y="130" width="196" height="6" rx="3" fill="#9333ea" /><rect x="731" y="158" width="42" height="42" rx="12" fill="#9333ea1f" /><path transform="translate(740 167) scale(1.35)" d="M4 16V2h5a3.5 3.5 0 0 1 0 7H4M8 9l7 7M15 10l-5 5" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="887" y="186" font-size="22" font-weight="800" fill="#e2e8f0" text-anchor="end" >04</text><text x="731" y="234" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Orders &amp; e-Rx</text><text x="731" y="262" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Interaction and</text><text x="731" y="282" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >allergy checks</text><path d="M910 228h14" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="929" y="130" width="196" height="196" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="929" y="130" width="196" height="6" rx="3" fill="#d97706" /><rect x="949" y="158" width="42" height="42" rx="12" fill="#d977061f" /><path transform="translate(958 167) scale(1.35)" d="M7 1.5h4M8 1.5v5L3 15.5h12L10 6.5v-5M5.5 11h7" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1105" y="186" font-size="22" font-weight="800" fill="#e2e8f0" text-anchor="end" >05</text><text x="949" y="234" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Results</text><text x="949" y="262" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Discrete values,</text><text x="949" y="282" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >flagged and routed</text><path d="M1128 228h14" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="1147" y="130" width="196" height="196" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="1147" y="130" width="196" height="6" rx="3" fill="#16a34a" /><rect x="1167" y="158" width="42" height="42" rx="12" fill="#16a34a1f" /><path transform="translate(1176 167) scale(1.35)" d="M3 9.5l4 4 8-9" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1323" y="186" font-size="22" font-weight="800" fill="#e2e8f0" text-anchor="end" >06</text><text x="1167" y="234" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Close-out &amp; billing</text><text x="1167" y="262" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Signed note, codes,</text><text x="1167" y="282" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >follow-up tasks</text><rect x="57" y="360" width="1286" height="54" rx="16" fill="url(#core)" filter="url(#sh2)"/><path transform="translate(79 376) scale(1.2)" d="M4 1.5h10v15H4zM7 5h4M7 8h4M7 11h2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="113" y="393" font-size="15" font-weight="700" fill="#fff" text-anchor="start" >One chart: intake answers, vitals, note, orders, results and codes all land in the same structured record</text><path d="M155 330V354" stroke="#0d9488" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 4"/><path d="M373 330V354" stroke="#0d9488" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 4"/><path d="M591 330V354" stroke="#0d9488" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 4"/><path d="M809 330V354" stroke="#0d9488" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 4"/><path d="M1027 330V354" stroke="#0d9488" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 4"/><path d="M1245 330V354" stroke="#0d9488" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 4"/><text x="279" y="438" font-size="11" font-weight="800" fill="#94a3b8" text-anchor="start" letter-spacing="1.6">CONNECTED SYSTEMS</text><rect x="57" y="452" width="196" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><rect x="57" y="462" width="4" height="32" rx="2" fill="#0284c7" /><text x="73" y="474" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >Practice management</text><text x="73" y="492" font-size="11.5" font-weight="600" fill="#0284c7" text-anchor="start" >SIU scheduling · 270/271</text><path d="M155 418V448" stroke="#0284c7" stroke-opacity="0.6" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><rect x="711" y="452" width="196" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><rect x="711" y="462" width="4" height="32" rx="2" fill="#9333ea" /><text x="727" y="474" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >Pharmacy &amp; lab orders</text><text x="727" y="492" font-size="11.5" font-weight="600" fill="#9333ea" text-anchor="start" >NCPDP SCRIPT · HL7 ORM</text><path d="M809 418V448" stroke="#9333ea" stroke-opacity="0.6" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><rect x="929" y="452" width="196" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><rect x="929" y="462" width="4" height="32" rx="2" fill="#d97706" /><text x="945" y="474" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >Laboratory / LIMS</text><text x="945" y="492" font-size="11.5" font-weight="600" fill="#d97706" text-anchor="start" >HL7 ORU result</text><path d="M1027 418V448" stroke="#d97706" stroke-opacity="0.6" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><rect x="1147" y="452" width="196" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0"/><rect x="1147" y="462" width="4" height="32" rx="2" fill="#16a34a" /><text x="1163" y="474" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >Billing / RCM</text><text x="1163" y="492" font-size="11.5" font-weight="600" fill="#16a34a" text-anchor="start" >837P claim</text><path d="M1245 418V448" stroke="#16a34a" stroke-opacity="0.6" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="279" y="476" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >Scheduling, eligibility and claims usually</text><text x="279" y="494" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >live in practice management software.</text>
