<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" role="img" aria-label="Sample lifecycle in a laboratory information management system from accessioning to storage and disposal" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Sample lifecycle in a laboratory information management system from accessioning to storage and disposal</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e1338" flood-opacity="0.13"/></filter>
<filter id="sh3" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1e1338" flood-opacity="0.28"/></filter>
<linearGradient id="areaT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.22"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
<linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4c1d95"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
<linearGradient id="room" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f4f1"/><stop offset="1" stop-color="#cfe7e2"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="600" rx="0" fill="#ffffff" />
<text x="700" y="54" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle" >A sample's path through a LIMS</text><text x="700" y="84" font-size="15" font-weight="500" fill="#64748b" text-anchor="middle" >Eight steps from receipt to disposal. Every step is recorded with user, date, time and reason.</text><rect x="60" y="128" width="290" height="130" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="60" y="128" width="290" height="6" rx="3" fill="#0284c7" /><circle cx="94" cy="170" r="17" fill="#0284c7"/><text x="94" y="175.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="122" y="176" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" >Login &amp; accessioning</text><text x="84" y="214" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Client, matrix, condition,</text><text x="84" y="234" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >requested tests</text><rect x="390" y="128" width="290" height="130" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="390" y="128" width="290" height="6" rx="3" fill="#0284c7" /><circle cx="424" cy="170" r="17" fill="#0284c7"/><text x="424" y="175.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="452" y="176" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" >Identification</text><text x="414" y="214" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Unique ID, barcode / QR,</text><text x="414" y="234" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >child IDs for aliquots</text><rect x="720" y="128" width="290" height="130" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="720" y="128" width="290" height="6" rx="3" fill="#4f46e5" /><circle cx="754" cy="170" r="17" fill="#4f46e5"/><text x="754" y="175.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="782" y="176" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" >Test assignment</text><text x="744" y="214" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >From spec, profile or order:</text><text x="744" y="234" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >method, limits, TAT</text><rect x="1050" y="128" width="290" height="130" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="1050" y="128" width="290" height="6" rx="3" fill="#4f46e5" /><circle cx="1084" cy="170" r="17" fill="#4f46e5"/><text x="1084" y="175.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="1112" y="176" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" >Worklists</text><text x="1074" y="214" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Batches with QC samples,</text><text x="1074" y="234" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >qualified analysts</text><rect x="1050" y="322" width="290" height="130" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="1050" y="322" width="290" height="6" rx="3" fill="#7c3aed" /><circle cx="1084" cy="364" r="17" fill="#7c3aed"/><text x="1084" y="369.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >5</text><text x="1112" y="370" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" >Analysis &amp; capture</text><text x="1074" y="408" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Instrument data, system</text><text x="1074" y="428" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >calculations, raw file kept</text><rect x="720" y="322" width="290" height="130" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="720" y="322" width="290" height="6" rx="3" fill="#d97706" /><circle cx="754" cy="364" r="17" fill="#d97706"/><text x="754" y="369.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >6</text><text x="782" y="370" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" >Review &amp; approval</text><text x="744" y="408" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Spec and QC checks,</text><text x="744" y="428" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >second-person e-signature</text><rect x="390" y="322" width="290" height="130" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="390" y="322" width="290" height="6" rx="3" fill="#16a34a" /><circle cx="424" cy="364" r="17" fill="#16a34a"/><text x="424" y="369.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >7</text><text x="452" y="370" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" >Reporting</text><text x="414" y="408" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Report or CoA released to</text><text x="414" y="428" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >customer, ERP or EHR</text><rect x="60" y="322" width="290" height="130" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="60" y="322" width="290" height="6" rx="3" fill="#64748b" /><circle cx="94" cy="364" r="17" fill="#64748b"/><text x="94" y="369.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >8</text><text x="122" y="370" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" >Storage &amp; disposal</text><text x="84" y="408" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >Tracked to retention end,</text><text x="84" y="428" font-size="13" font-weight="500" fill="#64748b" text-anchor="start" >disposal recorded</text><path d="M354 193h28" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrT)"/><path d="M386 387h-28" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrT)"/><path d="M684 193h28" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrT)"/><path d="M716 387h-28" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrT)"/><path d="M1014 193h28" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrT)"/><path d="M1046 387h-28" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrT)"/><path d="M1195 264V312" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="60" y="492" width="1280" height="64" rx="16" fill="url(#core)" filter="url(#sh2)"/><path transform="translate(84 512) scale(1.3)" d="M9 1.5l6.5 2.5v5c0 4-3 6.5-6.5 7.5C5.5 15.5 2.5 13 2.5 9V4zM6 9l2 2 4-4" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="122" y="531" font-size="16" font-weight="700" fill="#fff" text-anchor="start" >Audit trail on every step: who, what, when, old and new values, and why</text>
</svg>