<rect x="0" y="0" width="1440" height="900" rx="0" fill="#eff6ff" /><rect x="0" y="0" width="248" height="900" rx="0" fill="#0b1733" /><rect x="24" y="26" width="40" height="40" rx="10" fill="#2563eb" /><rect x="33" y="34" width="22" height="24" rx="3" stroke="#fff" stroke-width="2.4" fill="none"/><path d="M38 42h12M38 47h12M38 52h7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><text x="76" y="44" font-size="19" font-weight="700" fill="#fff" text-anchor="start">OrderPilot</text><text x="76" y="62" font-size="12" font-weight="500" fill="#bfdbfe" text-anchor="start">Order management</text><rect x="20" y="90" width="208" height="38" rx="10" fill="#ffffff14" /><text x="36" y="114" font-size="12.5" font-weight="500" fill="#60a5fa" text-anchor="start">Search (Ctrl K)</text><text x="24" y="160" font-size="10.5" font-weight="700" fill="#60a5fa" text-anchor="start">SAMPLE NORTHWIND OUTFITTERS</text><rect x="36" y="189" width="10" height="10" rx="3" fill="#ffffff40" /><text x="58" y="199" font-size="14" font-weight="500" fill="#bfdbfe" text-anchor="start">Dashboard</text><rect x="36" y="233" width="10" height="10" rx="3" fill="#ffffff40" /><text x="58" y="243" font-size="14" font-weight="500" fill="#bfdbfe" text-anchor="start">Orders</text><rect x="36" y="277" width="10" height="10" rx="3" fill="#ffffff40" /><text x="58" y="287" font-size="14" font-weight="500" fill="#bfdbfe" text-anchor="start">Inventory</text><rect x="16" y="308" width="216" height="36" rx="9" fill="#2563eb" /><rect x="36" y="321" width="10" height="10" rx="3" fill="#fff" /><text x="58" y="331" font-size="14" font-weight="700" fill="#fff" text-anchor="start">Routing</text><rect x="36" y="365" width="10" height="10" rx="3" fill="#ffffff40" /><text x="58" y="375" font-size="14" font-weight="500" fill="#bfdbfe" text-anchor="start">Fulfillment</text><rect x="36" y="409" width="10" height="10" rx="3" fill="#ffffff40" /><text x="58" y="419" font-size="14" font-weight="500" fill="#bfdbfe" text-anchor="start">Stores</text><rect x="36" y="453" width="10" height="10" rx="3" fill="#ffffff40" /><text x="58" y="463" font-size="14" font-weight="500" fill="#bfdbfe" text-anchor="start">Returns</text><rect x="36" y="497" width="10" height="10" rx="3" fill="#ffffff40" /><text x="58" y="507" font-size="14" font-weight="500" fill="#bfdbfe" text-anchor="start">Customers</text><rect x="36" y="541" width="10" height="10" rx="3" fill="#ffffff40" /><text x="58" y="551" font-size="14" font-weight="500" fill="#bfdbfe" text-anchor="start">Reports</text><rect x="36" y="585" width="10" height="10" rx="3" fill="#ffffff40" /><text x="58" y="595" font-size="14" font-weight="500" fill="#bfdbfe" text-anchor="start">Settings</text><rect x="20" y="810" width="208" height="64" rx="12" fill="#ffffff10" /><circle cx="52" cy="842" r="15" fill="#2563eb"/><text x="52" y="846.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">KL</text><text x="76" y="838" font-size="13" font-weight="700" fill="#fff" text-anchor="start">K. Lawson</text><text x="76" y="856" font-size="11.5" font-weight="500" fill="#bfdbfe" text-anchor="start">E-commerce operations</text><rect x="248" y="0" width="1192" height="76" rx="0" fill="#fff" /><line x1="248" y1="76" x2="1440" y2="76" stroke="#e2e8f0"/><text x="284" y="36" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Routing rules · Standard web orders</text><text x="284" y="58" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Applies to: web store, marketplaces · last changed Nov 20</text><rect x="1252" y="20" width="160" height="38" rx="10" fill="#2563eb" /><text x="1332" y="44" font-size="13.5" font-weight="700" fill="#fff" text-anchor="middle">Test rules</text><rect x="280" y="100" width="560" height="776" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="304" y="138" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Rule order</text><text x="816" y="138" font-size="12" font-weight="500" fill="#64748b" text-anchor="end">First match wins ties</text><rect x="304" y="166" width="512" height="96" rx="12" fill="#eff6ff" stroke="#e2e8f0"/><circle cx="336" cy="200" r="15" fill="#2563eb"/><text x="336" y="205" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="364" y="205" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Exclude locations at capacity</text><text x="364" y="230" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Stores max 60 orders/day, warehouses max 4,000</text><rect x="304" y="276" width="512" height="96" rx="12" fill="#eff6ff" stroke="#e2e8f0"/><circle cx="336" cy="310" r="15" fill="#2563eb"/><text x="336" y="315" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="364" y="315" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Exclude store safety stock</text><text x="364" y="340" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Keep 2 units per SKU for walk-in customers</text><rect x="304" y="386" width="512" height="96" rx="12" fill="#eff6ff" stroke="#e2e8f0"/><circle cx="336" cy="420" r="15" fill="#2563eb"/><text x="336" y="425" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="364" y="425" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Prefer one location for the whole order</text><text x="364" y="450" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Split only when no single location can fill</text><rect x="304" y="496" width="512" height="96" rx="12" fill="#eff6ff" stroke="#e2e8f0"/><circle cx="336" cy="530" r="15" fill="#2563eb"/><text x="336" y="535" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="364" y="535" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Meet the delivery promise</text><text x="364" y="560" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Ground transit time must meet promised date</text><rect x="304" y="606" width="512" height="96" rx="12" fill="#eff6ff" stroke="#e2e8f0"/><circle cx="336" cy="640" r="15" fill="#2563eb"/><text x="336" y="645" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="364" y="645" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Lowest total fulfillment cost</text><text x="364" y="670" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Shipping + handling cost per location</text><rect x="304" y="716" width="512" height="96" rx="12" fill="#eff6ff" stroke="#e2e8f0"/><circle cx="336" cy="750" r="15" fill="#2563eb"/><text x="336" y="755" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="364" y="755" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Nearest location as tiebreaker</text><text x="364" y="780" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Distance to customer ZIP</text><rect x="864" y="100" width="546" height="776" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="888" y="138" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Test: order NW-104832</text><text x="888" y="160" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">4 lines · ship to Lakeview · promise Thu Dec 3</text><text x="888" y="200" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="start">Location</text><text x="1030" y="200" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="start">Lines in stock</text><text x="1115" y="200" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="start">Miles</text><text x="1175" y="200" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="start">Cost</text><text x="1386" y="200" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">Result</text><line x1="888" y1="214" x2="1386" y2="214" stroke="#f1f5f9"/><text x="888" y="244" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Store 03 · Lakeview</text><text x="1030" y="244" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">3 of 4</text><text x="1115" y="244" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">6</text><text x="1175" y="244" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">$7.10</text><rect x="1291" y="228" width="95" height="24" rx="12" fill="#d1fae5" /><text x="1338.5" y="244" font-size="10.5" font-weight="700" fill="#059669" text-anchor="middle">Selected (3)</text><line x1="888" y1="274" x2="1386" y2="274" stroke="#f1f5f9"/><text x="888" y="304" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Warehouse East</text><text x="1030" y="304" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">1 of 4</text><text x="1115" y="304" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">410</text><text x="1175" y="304" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">$11.85</text><rect x="1291" y="288" width="95" height="24" rx="12" fill="#d1fae5" /><text x="1338.5" y="304" font-size="10.5" font-weight="700" fill="#059669" text-anchor="middle">Selected (1)</text><line x1="888" y1="334" x2="1386" y2="334" stroke="#f1f5f9"/><text x="888" y="364" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Store 07 · Riverside</text><text x="1030" y="364" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">2 of 4</text><text x="1115" y="364" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">18</text><text x="1175" y="364" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">$7.40</text><rect x="1297" y="348" width="89" height="24" rx="12" fill="#f1f5f9" /><text x="1341.5" y="364" font-size="10.5" font-weight="700" fill="#64748b" text-anchor="middle">Fewer lines</text><line x1="888" y1="394" x2="1386" y2="394" stroke="#f1f5f9"/><text x="888" y="424" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Warehouse West</text><text x="1030" y="424" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">4 of 4</text><text x="1115" y="424" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">1,260</text><text x="1175" y="424" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">$14.20</text><rect x="1279" y="408" width="107" height="24" rx="12" fill="#fee2e2" /><text x="1332.5" y="424" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Misses promise</text><line x1="888" y1="454" x2="1386" y2="454" stroke="#f1f5f9"/><text x="888" y="484" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Store 11 · Downtown</text><text x="1030" y="484" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">4 of 4</text><text x="1115" y="484" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">12</text><text x="1175" y="484" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">-</text><rect x="1297" y="468" width="89" height="24" rx="12" fill="#fef3c7" /><text x="1341.5" y="484" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle">At capacity</text><rect x="888" y="556" width="498" height="140" rx="12" fill="#dbeafe" /><text x="908" y="588" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">Decision</text><text x="908" y="614" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="start">Store 11 has all 4 lines but is at capacity, and Warehouse</text><text x="908" y="633" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="start">West misses the promise. The order splits: Store 03 ships 3</text><text x="908" y="652" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="start">lines today and Warehouse East ships the boots. Combined</text><text x="908" y="671" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="start">cost $18.95.</text><rect x="888" y="720" width="498" height="130" rx="12" fill="#fff" stroke="#e2e8f0"/><text x="908" y="752" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Rule simulation · last 7 days of orders</text><text x="908" y="780" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Split rate 6.2% → 5.1% with new store safety stock</text><text x="908" y="804" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Average ship distance 312 → 268 miles</text><text x="908" y="828" font-size="11.5" font-weight="500" fill="#94a3b8" text-anchor="start">Estimated, based on historical orders</text>
</svg>
