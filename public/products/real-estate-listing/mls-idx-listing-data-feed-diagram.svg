<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="MLS and IDX listing data feed diagram showing listing sync, photo processing, search index and listing pages" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>MLS and IDX listing data feed diagram showing listing sync, photo processing, search index and listing pages</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2a0a14" flood-opacity="0.16"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e11d48" stop-opacity="0.22"/><stop offset="1" stop-color="#e11d48" stop-opacity="0"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e11d48"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#fff1f2" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">How listing data flows into the platform</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">MLS feed, own inventory and submissions → one search index and listing pages · illustrative</text><rect x="60" y="140" width="300" height="130" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="60" y="140" width="8" height="130" rx="4" fill="#1d4ed8" /><text x="88" y="188" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">MLS data feed</text><text x="88" y="216" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">RESO Web API · IDX license</text><line x1="362" y1="205" x2="458" y2="470" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="60" y="310" width="300" height="130" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="60" y="310" width="8" height="130" rx="4" fill="#6d28d9" /><text x="88" y="358" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Brokerage inventory</text><text x="88" y="386" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Exclusive listings &amp; rentals</text><line x1="362" y1="375" x2="458" y2="470" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="60" y="480" width="300" height="130" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="60" y="480" width="8" height="130" rx="4" fill="#b45309" /><text x="88" y="528" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Agent &amp; owner submissions</text><text x="88" y="556" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Portal with required fields</text><line x1="362" y1="545" x2="458" y2="470" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="60" y="650" width="300" height="130" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><rect x="60" y="650" width="8" height="130" rx="4" fill="#0f766e" /><text x="88" y="698" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Property management system</text><text x="88" y="726" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Vacant units for rent</text><line x1="362" y1="715" x2="458" y2="470" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="470" y="330" width="300" height="280" rx="18" fill="#2a0a14" filter="url(#sh2)"/><text x="620" y="372" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Processing</text><circle cx="500" cy="408" r="4" fill="#fda4af"/><text x="514" y="413" font-size="13" font-weight="500" fill="#fecdd3" text-anchor="start">Field mapping &amp; validation</text><circle cx="500" cy="440" r="4" fill="#fda4af"/><text x="514" y="445" font-size="13" font-weight="500" fill="#fecdd3" text-anchor="start">Duplicate detection</text><circle cx="500" cy="472" r="4" fill="#fda4af"/><text x="514" y="477" font-size="13" font-weight="500" fill="#fecdd3" text-anchor="start">Photo download &amp; resizing</text><circle cx="500" cy="504" r="4" fill="#fda4af"/><text x="514" y="509" font-size="13" font-weight="500" fill="#fecdd3" text-anchor="start">Geocoding</text><circle cx="500" cy="536" r="4" fill="#fda4af"/><text x="514" y="541" font-size="13" font-weight="500" fill="#fecdd3" text-anchor="start">Status &amp; price changes</text><circle cx="500" cy="568" r="4" fill="#fda4af"/><text x="514" y="573" font-size="13" font-weight="500" fill="#fecdd3" text-anchor="start">MLS display rules</text><rect x="870" y="140" width="320" height="130" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="898" y="188" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Search index</text><text x="898" y="216" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Fast filters, map and keyword search</text><line x1="772" y1="470" x2="866" y2="205" stroke="#e11d48" stroke-width="2" marker-end="url(#arrA)"/><rect x="870" y="310" width="320" height="130" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="898" y="358" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Listing pages</text><text x="898" y="386" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Server-rendered, structured data, sitemaps</text><line x1="772" y1="470" x2="866" y2="375" stroke="#e11d48" stroke-width="2" marker-end="url(#arrA)"/><rect x="870" y="480" width="320" height="130" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="898" y="528" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Alerts engine</text><text x="898" y="556" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Saved searches matched on every change</text><line x1="772" y1="470" x2="866" y2="545" stroke="#e11d48" stroke-width="2" marker-end="url(#arrA)"/><rect x="870" y="650" width="320" height="130" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="898" y="698" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">CRM &amp; analytics</text><text x="898" y="726" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Leads, views and saves per listing</text><line x1="772" y1="470" x2="866" y2="715" stroke="#e11d48" stroke-width="2" marker-end="url(#arrA)"/><rect x="1220" y="140" width="170" height="640" rx="16" fill="#fff1f2" stroke="#fda4af"/><text x="1305" y="180" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Refresh</text><text x="1305" y="230" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">New listings</text><text x="1305" y="252" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">every 15 min</text><text x="1305" y="300" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Status changes</text><text x="1305" y="322" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">every 15 min</text><text x="1305" y="370" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Photos</text><text x="1305" y="392" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">on change</text><text x="1305" y="440" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Full resync</text><text x="1305" y="462" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">nightly</text><text x="1240" y="560" font-size="11.5" font-weight="500" fill="#be123c" text-anchor="start">Exact refresh rules</text><text x="1240" y="577" font-size="11.5" font-weight="500" fill="#be123c" text-anchor="start">follow your MLS's</text><text x="1240" y="594" font-size="11.5" font-weight="500" fill="#be123c" text-anchor="start">data license.</text><text x="720" y="856" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Each MLS sets its own display rules (attribution, refresh, allowed fields). The brokerage holds the data license.</text>
</svg>
