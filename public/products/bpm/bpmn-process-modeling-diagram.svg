<rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff"/><text x="600" y="50" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">BPMN model · Purchase request</text><text x="600" y="78" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle">Swimlanes for each role, an approval gateway, and a timer that escalates overdue approvals</text><rect x="40" y="110" width="1120" height="680" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/><rect x="40" y="110" width="60" height="170" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="70" y="195" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" transform="rotate(-90 70 195)">Requester</text><rect x="40" y="280" width="60" height="170" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="70" y="365" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" transform="rotate(-90 70 365)">Manager</text><line x1="40" y1="280" x2="1160" y2="280" stroke="#94a3b8" stroke-width="1.5"/><rect x="40" y="450" width="60" height="170" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="70" y="535" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" transform="rotate(-90 70 535)">Finance</text><line x1="40" y1="450" x2="1160" y2="450" stroke="#94a3b8" stroke-width="1.5"/><rect x="40" y="620" width="60" height="170" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/><text x="70" y="705" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" transform="rotate(-90 70 705)">ERP (system)</text><line x1="40" y1="620" x2="1160" y2="620" stroke="#94a3b8" stroke-width="1.5"/><circle cx="150" cy="200" r="18" fill="#fff" stroke="#10b981" stroke-width="2.5"/><text x="150" y="240" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Need identified</text><path d="M168 200 H218" fill="none" stroke="#0f172a" stroke-width="1.8"  marker-end="url(#arr)"/><rect x="220" y="168" width="150" height="64" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="295" y="196" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Submit purchase</text><text x="295" y="212" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">request</text><rect x="820" y="168" width="150" height="64" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2"/><text x="895" y="204" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Revise request</text><path d="M295 232 V350 H338" fill="none" stroke="#0f172a" stroke-width="1.8"  marker-end="url(#arr)"/><rect x="340" y="318" width="150" height="64" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="415" y="354" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Manager review</text><path d="M490 350 H540" fill="none" stroke="#0f172a" stroke-width="1.8"  marker-end="url(#arr)"/><path d="M568 324 l26 26 -26 26 -26 -26z" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/><text x="568" y="356" font-size="18" font-weight="800" fill="#b45309" text-anchor="middle">×</text><text x="568" y="400" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">Approved?</text><path d="M568 324 V200 H818" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="700" y="190" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">No</text><path d="M970 200 H1010 V140 H295 V166" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="650" y="132" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Resubmit</text><path d="M594 350 H640 V530 H668" fill="none" stroke="#0f172a" stroke-width="1.8"  marker-end="url(#arr)"/><text x="612" y="342" font-size="11.5" font-weight="700" fill="#047857" text-anchor="start">Yes</text><path d="M696 504 l26 26 -26 26 -26 -26z" fill="#fff" stroke="#f59e0b" stroke-width="2.5"/><text x="696" y="536" font-size="18" font-weight="800" fill="#b45309" text-anchor="middle">×</text><text x="696" y="580" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">&gt; $10,000?</text><path d="M722 530 H778" fill="none" stroke="#0f172a" stroke-width="1.8"  marker-end="url(#arr)"/><text x="748" y="522" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">Yes</text><rect x="780" y="498" width="150" height="64" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="855" y="534" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Finance approval</text><circle cx="930" cy="560" r="14" fill="#fff" stroke="#db2777" stroke-width="2.5"/><circle cx="930" cy="560" r="10" fill="#fff" stroke="#db2777" stroke-width="1.2"/><path d="M930 553 v7 l5 3" stroke="#db2777" stroke-width="1.6" fill="none"/><path d="M944 566 C 990 600, 1010 600, 1040 600" fill="none" stroke="#db2777" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="1050" y="616" font-size="11" font-weight="700" fill="#db2777" text-anchor="start">48 h: escalate</text><path d="M696 556 V700 H858" fill="none" stroke="#0f172a" stroke-width="1.8"  marker-end="url(#arr)"/><text x="706" y="640" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="start">No</text><path d="M855 562 V668" fill="none" stroke="#0f172a" stroke-width="1.8"  marker-end="url(#arr)"/><rect x="860" y="668" width="150" height="64" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/><text x="935" y="696" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Create purchase</text><text x="935" y="712" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">order</text><path d="M1010 700 H1070" fill="none" stroke="#0f172a" stroke-width="1.8"  marker-end="url(#arr)"/><circle cx="1090" cy="700" r="18" fill="#fff" stroke="#ef4444" stroke-width="4"/><text x="1090" y="740" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">PO created</text><rect x="160" y="740" width="600" height="36" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><circle cx="184" cy="758" r="6" fill="#10b981"/><text x="196" y="762" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">Start event</text><circle cx="302" cy="758" r="6" fill="#0f766e"/><text x="314" y="762" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">Task</text><circle cx="420" cy="758" r="6" fill="#f59e0b"/><text x="432" y="762" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">Gateway</text><circle cx="538" cy="758" r="6" fill="#db2777"/><text x="550" y="762" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">Timer</text><circle cx="656" cy="758" r="6" fill="#ef4444"/><text x="668" y="762" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">End event</text>
