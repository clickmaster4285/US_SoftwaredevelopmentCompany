<rect x="0" y="0" width="1400" height="600" rx="0" fill="#ffffff" />
<text x="700" y="54" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle" >The patient journey through a patient management system</text><text x="700" y="84" font-size="15" font-weight="500" fill="#64748b" text-anchor="middle" >Nine steps, one patient profile, connected to clinical and billing systems.</text><rect x="58" y="128" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="58" y="128" width="228" height="6" rx="3" fill="#2563eb" /><circle cx="90" cy="166" r="16" fill="#2563eb"/><text x="90" y="171.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="116" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Booking</text><text x="80" y="206" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >Online, portal or phone;</text><text x="80" y="225" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >rules checked</text><path d="M290 187h26" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="322" y="128" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="322" y="128" width="228" height="6" rx="3" fill="#2563eb" /><circle cx="354" cy="166" r="16" fill="#2563eb"/><text x="354" y="171.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="380" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Pre-registration</text><text x="344" y="206" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >Forms, consents,</text><text x="344" y="225" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >insurance card, ID</text><path d="M554 187h26" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="586" y="128" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="586" y="128" width="228" height="6" rx="3" fill="#4f46e5" /><circle cx="618" cy="166" r="16" fill="#4f46e5"/><text x="618" y="171.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="644" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Identity matching</text><text x="608" y="206" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >Existing record or new;</text><text x="608" y="225" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >duplicates flagged</text><path d="M818 187h26" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="850" y="128" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="850" y="128" width="228" height="6" rx="3" fill="#4f46e5" /><circle cx="882" cy="166" r="16" fill="#4f46e5"/><text x="882" y="171.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="908" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Reminders</text><text x="872" y="206" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >Text, email or voice,</text><text x="872" y="225" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >by preference</text><path d="M1082 187h26" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="1114" y="128" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="1114" y="128" width="228" height="6" rx="3" fill="#d97706" /><circle cx="1146" cy="166" r="16" fill="#d97706"/><text x="1146" y="171.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >5</text><text x="1172" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Check-in</text><text x="1136" y="206" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >Kiosk, QR, phone</text><text x="1136" y="225" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >or front desk</text><rect x="1114" y="312" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="1114" y="312" width="228" height="6" rx="3" fill="#0891b2" /><circle cx="1146" cy="350" r="16" fill="#0891b2"/><text x="1146" y="355.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >6</text><text x="1172" y="356" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Patient flow</text><text x="1136" y="390" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >Waiting, roomed,</text><text x="1136" y="409" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >with provider, checkout</text><path d="M1110 371h-26" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="850" y="312" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="850" y="312" width="228" height="6" rx="3" fill="#9333ea" /><circle cx="882" cy="350" r="16" fill="#9333ea"/><text x="882" y="355.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >7</text><text x="908" y="356" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Hand-offs</text><text x="872" y="390" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >Sync to EMR/EHR,</text><text x="872" y="409" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >visit to billing</text><path d="M846 371h-26" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="586" y="312" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="586" y="312" width="228" height="6" rx="3" fill="#16a34a" /><circle cx="618" cy="350" r="16" fill="#16a34a"/><text x="618" y="355.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >8</text><text x="644" y="356" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Check-out</text><text x="608" y="390" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >Follow-up, referrals,</text><text x="608" y="409" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >visit summary</text><path d="M582 371h-26" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="322" y="312" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="322" y="312" width="228" height="6" rx="3" fill="#16a34a" /><circle cx="354" cy="350" r="16" fill="#16a34a"/><text x="354" y="355.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >9</text><text x="380" y="356" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Follow-up</text><text x="344" y="390" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >Recalls, surveys,</text><text x="344" y="409" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >portal messages</text><path d="M1228 252V302" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="58" y="312" width="228" height="118" rx="18" fill="url(#core)" filter="url(#sh2)"/><path transform="translate(80 334) scale(1.2)" d="M6.5 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM1 16c0-3 2.5-5 5.5-5s5.5 2 5.5 5M12.5 2.3a3 3 0 0 1 0 5.4M14 11c2 .6 3 2.4 3 5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="352" font-size="15.5" font-weight="700" fill="#fff" text-anchor="start" >One profile</text><text x="80" y="390" font-size="12.5" font-weight="500" fill="#cffafe" text-anchor="start" >Master patient index</text><text x="80" y="409" font-size="12.5" font-weight="500" fill="#cffafe" text-anchor="start" >behind every step</text><rect x="58" y="470" width="1284" height="82" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text x="82" y="502" font-size="11" font-weight="800" fill="#94a3b8" text-anchor="start" letter-spacing="1.6">CONNECTED SYSTEMS</text><rect x="82" y="516" width="4" height="26" rx="2" fill="#9333ea" /><text x="96" y="528" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >EMR / EHR</text><text x="96" y="544" font-size="11.5" font-weight="600" fill="#9333ea" text-anchor="start" >HL7 ADT/SIU · FHIR</text><rect x="332" y="516" width="4" height="26" rx="2" fill="#d97706" /><text x="346" y="528" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >Medical billing</text><text x="346" y="544" font-size="11.5" font-weight="600" fill="#d97706" text-anchor="start" >Insurance, copays, visits</text><rect x="582" y="516" width="4" height="26" rx="2" fill="#2563eb" /><text x="596" y="528" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >Telemedicine</text><text x="596" y="544" font-size="11.5" font-weight="600" fill="#2563eb" text-anchor="start" >Video visit links</text><rect x="832" y="516" width="4" height="26" rx="2" fill="#16a34a" /><text x="846" y="528" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >Payments</text><text x="846" y="544" font-size="11.5" font-weight="600" fill="#16a34a" text-anchor="start" >PCI DSS gateway</text><rect x="1082" y="516" width="4" height="26" rx="2" fill="#0891b2" /><text x="1096" y="528" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >Messaging</text><text x="1096" y="544" font-size="11.5" font-weight="600" fill="#0891b2" text-anchor="start" >Text, email, voice</text>
