<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Student information system integrations diagram for LMS rostering, single sign-on, assessments, finance and parent apps" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
