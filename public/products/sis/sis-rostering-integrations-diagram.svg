<rect x="0" y="0" width="1440" height="900" rx="0" fill="#f0fdfa" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">The SIS as the source of truth for connected systems</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Integration concept · sync direction shown by arrows · placeholder systems</text><circle cx="720" cy="480" r="120" fill="#062421" filter="url(#sh2)"/><text x="720" y="468" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Student</text><text x="720" y="494" font-size="16" font-weight="600" fill="#99f6e4" text-anchor="middle">information system</text><text x="720" y="522" font-size="12.5" font-weight="500" fill="#2dd4bf" text-anchor="middle">official record</text><line x1="603.086278573799" y1="427.2820548363591" x2="284.69160316380703" y2="259.0735470725898" stroke="#0f766e" stroke-width="2" marker-end="url(#arrA)"/><line x1="292.16553969333586" y1="244.9264529274102" x2="610.5602151033278" y2="413.1349606911795" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="154" width="300" height="92" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="190" y="190" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Learning platform (LMS)</text><text x="190" y="216" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Classes, teachers, students out · final grades in</text><line x1="720" y1="352" x2="720" y2="222" stroke="#0f766e" stroke-width="2" marker-end="url(#arrA)"/><rect x="570" y="124" width="300" height="92" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="720" y="160" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Single sign-on</text><text x="720" y="186" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Accounts and roles out</text><line x1="829.4397848966722" y1="413.1349606911795" x2="1147.8344603066641" y2="244.9264529274102" stroke="#0f766e" stroke-width="2" marker-end="url(#arrA)"/><line x1="1155.3083968361932" y1="259.0735470725898" x2="836.913721426201" y2="427.2820548363591" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="1100" y="154" width="300" height="92" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="1250" y="190" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Assessment platforms</text><text x="1250" y="216" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Rosters out · scores in</text><line x1="847.7603046345238" y1="491.19395192475383" x2="1095.1940215386403" y2="528.5424374951866" stroke="#0f766e" stroke-width="2" marker-end="url(#arrA)"/><line x1="1092.8059784613597" y1="544.363222882172" x2="845.372261557243" y2="507.0147373117393" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/><rect x="1100" y="514" width="300" height="92" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="1250" y="550" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Finance and fees</text><text x="1250" y="576" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Enrollment status out · balances in</text><line x1="817.9086333589825" y1="562.4493754601958" x2="1038.25" y2="748" stroke="#0f766e" stroke-width="2" marker-end="url(#arrA)"/><rect x="950" y="754" width="300" height="92" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="1100" y="790" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Parent and student apps</text><text x="1100" y="816" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Schedules, grades, attendance out</text><line x1="622.0913666410175" y1="562.4493754601958" x2="401.75" y2="748" stroke="#0f766e" stroke-width="2" marker-end="url(#arrA)"/><rect x="190" y="754" width="300" height="92" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="340" y="790" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Transport and nutrition</text><text x="340" y="816" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Addresses and eligibility out</text><line x1="346" y1="536.4528301886793" x2="593.4337169041166" y2="499.10434461824656" stroke="#0f766e" stroke-width="2" marker-end="url(#arrA)"/><rect x="40" y="514" width="300" height="92" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="190" y="550" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Admissions and enrollment forms</text><text x="190" y="576" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">New students in</text><rect x="500" y="860" width="440" height="26" rx="0" fill="none" /><text x="720" y="874" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Sync logs and error alerts for every connection</text>
