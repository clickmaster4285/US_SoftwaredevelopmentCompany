195" height="24" rx="12" fill="#ede9fe" /><text x="858.5" y="134" font-size="11.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Awaiting operator decision</text><circle cx="318" cy="186" r="9" fill="#1d4ed8"/><line x1="318" y1="196" x2="318" y2="302" stroke="#e2e8f0" stroke-width="2"/><text x="340" y="190" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Buyer opened dispute</text><text x="956" y="190" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="end">Nov 6 · 10:14 AM</text><rect x="340" y="204" width="616" height="72" rx="10" fill="#fff7ed" /><text x="356" y="230" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="start">Ceramic vase arrived with a visible crack. Photos attached (3).</text><text x="356" y="268" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="start">Buyer</text><circle cx="318" cy="314" r="9" fill="#ea580c"/><line x1="318" y1="324" x2="318" y2="430" stroke="#e2e8f0" stroke-width="2"/><text x="340" y="318" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Seller responded</text><text x="956" y="318" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="end">Nov 6 · 4:02 PM</text><rect x="340" y="332" width="616" height="72" rx="10" fill="#fff7ed" /><text x="356" y="358" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="start">Packed with double boxing; offered 30% partial refund.</text><text x="356" y="396" font-size="11" font-weight="700" fill="#ea580c" text-anchor="start">Seller</text><circle cx="318" cy="442" r="9" fill="#1d4ed8"/><line x1="318" y1="452" x2="318" y2="558" stroke="#e2e8f0" stroke-width="2"/><text x="340" y="446" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Buyer declined</text><text x="956" y="446" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="end">Nov 7 · 9:30 AM</text><rect x="340" y="460" width="616" height="72" rx="10" fill="#fff7ed" /><text x="356" y="486" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="start">Requests a full refund; the vase is unusable.</text><text x="356" y="524" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="start">Buyer</text><circle cx="318" cy="570" r="9" fill="#0f766e"/><line x1="318" y1="580" x2="318" y2="686" stroke="#e2e8f0" stroke-width="2"/><text x="340" y="574" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Carrier claim</text><text x="956" y="574" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="end">Nov 8 · 11:45 AM</text><rect x="340" y="588" width="616" height="72" rx="10" fill="#fff7ed" /><text x="356" y="614" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="start">Carrier confirms damage in transit (claim #CL-77210).</text><text x="356" y="652" font-size="11" font-weight="700" fill="#0f766e" text-anchor="start">System</text><circle cx="318" cy="698" r="9" fill="#0f766e"/><text x="340" y="702" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Escalated to operator</text><text x="956" y="702" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="end">Nov 9 · 8:00 AM</text><rect x="340" y="716" width="616" height="72" rx="10" fill="#fff7ed" /><text x="356" y="742" font-size="12.5" font-weight="500" fill="#0f172a" text-anchor="start">Seller response window ended; funds $58.00 on hold.</text><text x="356" y="780" font-size="11" font-weight="700" fill="#0f766e" text-anchor="start">System</text><rect x="1004" y="100" width="406" height="400" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="1028" y="138" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start">Recommended outcome</text><text x="1028" y="182" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Refund to buyer</text><text x="1386" y="182" font-size="13" font-weight="700" fill="#0f172a" text-anchor="end">$58.00 (full)</text><text x="1028" y="226" font-size="13" font-weight="500" fill="#64748b" text-