text><text x="960" y="524" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">$68.00</text><line x1="724" y1="450" x2="800" y2="674" stroke="#ea580c" stroke-width="2" marker-end="url(#arrA)"/><rect x="806" y="584" width="560" height="190" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="834" y="622" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Sub-order MR-55102-3</text><rect x="1260" y="604" width="82" height="24" rx="12" fill="#fef3c7" /><text x="1301" y="620" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">Preparing</text><text x="834" y="656" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Seller</text><text x="960" y="656" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">Paper Pine Prints</text><text x="834" y="686" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Item</text><text x="960" y="686" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">Abstract print 18×24</text><text x="834" y="716" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Shipping</text><text x="960" y="716" font-size="13" font-weight="500" fill="#0f172a" text-anchor="start">Ships by Nov 12</text><text x="834" y="746" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Subtotal</text><text x="960" y="746" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">$40.00</text><text x="1086" y="834" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Sub-order subtotals include each seller's shipping: $104 + $68 + $40 = $212</text>
</svg>
