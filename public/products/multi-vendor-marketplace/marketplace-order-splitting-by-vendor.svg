<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Multi-vendor order splitting diagram where one checkout becomes separate sub-orders shipped by each seller" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Multi-vendor order splitting diagram where one checkout becomes separate sub-orders shipped by each seller</title>
