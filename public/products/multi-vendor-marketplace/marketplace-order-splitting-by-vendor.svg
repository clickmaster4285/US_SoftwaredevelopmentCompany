<rect x="0" y="0" width="1440" height="900" rx="0" fill="#fff7ed" /><text x="720" y="64" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">One checkout, three sellers, three sub-orders</text><text x="720" y="92" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Buyer: M. Rivera · order #MR-55102 · placeholder data</text><rect x="70" y="140" width="360" height="640" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="98" y="178" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Buyer's view</text><text x="98" y="200" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Order #MR-55102 · $212.00</text><rect x="98" y="232" width="304" height="128" rx="12" fill="#fff7ed" stroke="#e2e8f0"/><rect x="114" y="248" width="56" height="56" rx="8" fill="#f1f5f9" /><text x="184" y="268" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Linen table runner × 2</text><text x="184" y="288" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Sold by Oak &amp; Moss Home</text><rect x="114" y="320" width="162" height="24" rx="12" fill="#d1fae5" /><text x="195" y="336" font-size="11.5" font-weight="700" fill="#059669" text-anchor="middle">Shipped · arrives Thu</text><rect x="98" y="382" width="304" height="128" rx="12" fill="#fff7ed" stroke="#e2e8f0"/><rect x="114" y="398" width="56" height="56" rx="8" fill="#f1f5f9" /><text x="184" y="418" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Silver hoop earrings</text><text x="184" y="438" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Sold by Silverline Jewelry</text><rect x="114" y="470" width="82" height="24" rx="12" fill="#dbeafe" /><text x="155" y="486" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Delivered</text><rect x="98" y="532" width="304" height="128" rx="12" fill="#fff7ed" stroke="#e2e8f0"/><rect x="114" y="548" width="56" height="56