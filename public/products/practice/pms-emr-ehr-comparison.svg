<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Diagram comparing practice management software, EMR and EHR systems and how they share data" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Diagram comparing practice management software, EMR and EHR systems and how they share data</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.12"/></filter>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="10" stroke="#cbd5e1" stroke-width="4"/></pattern>
<linearGradient id="areaI" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f46e5" stop-opacity="0.25"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></linearGradient>
<linearGradient id="areaT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d9488" stop-opacity="0.22"/><stop offset="1" stop-color="#0d9488" stop-opacity="0"/></linearGradient>
<linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="760" rx="0" fill="#ffffff" />
<text x="600" y="62" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle" >How practice management, EMR and EHR fit together</text><text x="600" y="92" font-size="15" font-weight="500" fill="#64748b" text-anchor="middle" >Each system has its own job. They share data where their circles overlap.</text><circle cx="430" cy="340" r="215" fill="#4f46e5" fill-opacity="0.13" stroke="#4f46e5" stroke-width="2.5"/><circle cx="770" cy="340" r="215" fill="#0d9488" fill-opacity="0.13" stroke="#0d9488" stroke-width="2.5"/><circle cx="600" cy="540" r="215" fill="#0284c7" fill-opacity="0.11" stroke="#0284c7" stroke-width="2.5"/><text x="360" y="250" font-size="19" font-weight="800" fill="#4f46e5" text-anchor="middle" >Practice mgmt (PMS)</text><text x="360" y="276" font-size="13.5" font-weight="500" fill="#334155" text-anchor="middle" >Scheduling</text><text x="360" y="297" font-size="13.5" font-weight="500" fill="#334155" text-anchor="middle" >Registration &amp; coverage</text><text x="360" y="318" font-size="13.5" font-weight="500" fill="#334155" text-anchor="middle" >Charges &amp; claims</text><text x="360" y="339" font-size="13.5" font-weight="500" fill="#334155" text-anchor="middle" >Payments &amp; reporting</text><text x="870" y="250" font-size="19" font-weight="800" fill="#0d9488" text-anchor="middle" >EMR</text><text x="870" y="276" font-size="13.5" font-weight="500" fill="#334155" text-anchor="middle" >Encounter notes</text><text x="870" y="297" font-size="13.5" font-weight="500" fill="#334155" text-anchor="middle" >Problems &amp; medications</text><text x="870" y="318" font-size="13.5" font-weight="500" fill="#334155" text-anchor="middle" >Allergies &amp; orders</text><text x="870" y="339" font-size="13.5" font-weight="500" fill="#334155" text-anchor="middle" >Within one practice</text><text x="600" y="640" font-size="19" font-weight="800" fill="#0284c7" text-anchor="middle" >EHR</text><text x="600" y="666" font-size="13.5" font-weight="500" fill="#334155" text-anchor="middle" >Longitudinal record</text><text x="600" y="687" font-size="13.5" font-weight="500" fill="#334155" text-anchor="middle" >Shared across care</text><text x="600" y="708" font-size="13.5" font-weight="500" fill="#334155" text-anchor="middle" >settings &amp; teams</text><rect x="508" y="212" width="184" height="52" rx="12" fill="#fff" stroke="#e4e7f0" filter="url(#sh)"/><text x="600" y="234" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle" >Appointments ⇄</text><text x="600" y="252" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle" >coded diagnoses &amp; procedures</text><rect x="378" y="474" width="184" height="52" rx="12" fill="#fff" stroke="#e4e7f0" filter="url(#sh)"/><text x="470" y="496" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle" >Demographics</text><text x="470" y="514" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle" >&amp; visit history</text><rect x="638" y="474" width="184" height="52" rx="12" fill="#fff" stroke="#e4e7f0" filter="url(#sh)"/><text x="730" y="496" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle" >Clinical data</text><text x="730" y="514" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="middle" >shared via HL7 FHIR</text><circle cx="600" cy="410" r="30" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="600" y="405" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle" >One</text><text x="600" y="420" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle" >patient</text>
</svg>