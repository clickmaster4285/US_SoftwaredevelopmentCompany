<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Document approval workflow from submission through review and multi-level approval to publication or rejection" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Document approval workflow from submission through review and multi-level approval to publication or rejection</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2a0b1c" flood-opacity="0.14"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#be185d" stop-opacity="0.24"/><stop offset="1" stop-color="#be185d" stop-opacity="0"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#db2777"/><stop offset="1" stop-color="#9d174d"/></linearGradient>
<linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#831843"/><stop offset="1" stop-color="#be185d"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be185d"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff"/><text x="600" y="52" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Document approval workflow</text><text x="600" y="82" font-size="14.5" font-weight="500" fill="#64748b" text-anchor="middle">From submission through review and multi-level approval to publication or rejection</text><rect x="50" y="140" width="200" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="50" y="140" width="200" height="6" rx="3" fill="#7c3aed"/><circle cx="80" cy="178" r="16" fill="#7c3aed"/><text x="80" y="183" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="106" y="183" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Submit</text><text x="68" y="212" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Author submits a draft with</text><text x="68" y="229" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">metadata and a revision</text><text x="68" y="246" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">note</text><rect x="300" y="140" width="200" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="300" y="140" width="200" height="6" rx="3" fill="#0891b2"/><circle cx="330" cy="178" r="16" fill="#0891b2"/><text x="330" y="183" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="356" y="183" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Route</text><text x="318" y="212" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">By document type,</text><text x="318" y="229" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">department or value</text><rect x="550" y="140" width="200" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="550" y="140" width="200" height="6" rx="3" fill="#f59e0b"/><circle cx="580" cy="178" r="16" fill="#f59e0b"/><text x="580" y="183" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="606" y="183" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Review</text><text x="568" y="212" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Reviewers comment or</text><text x="568" y="229" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">request changes</text><line x1="252" y1="200" x2="296" y2="200" stroke="#be185d" stroke-width="2.5"  marker-end="url(#arrA)"/><line x1="502" y1="200" x2="546" y2="200" stroke="#be185d" stroke-width="2.5"  marker-end="url(#arrA)"/><line x1="752" y1="200" x2="796" y2="200" stroke="#be185d" stroke-width="2.5"  marker-end="url(#arrA)"/><rect x="800" y="120" width="350" height="330" rx="20" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/><text x="822" y="150" font-size="11.5" font-weight="800" fill="#9d174d" text-anchor="start" letter-spacing="1.2">4  MULTI-LEVEL APPROVAL</text><rect x="822" y="170" width="306" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><circle cx="852" cy="205" r="13" fill="#be185d"/><text x="852" y="209" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">DH</text><text x="876" y="202" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Department head</text><text x="876" y="221" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Sequential · deadline 3 days</text><rect x="822" y="260" width="306" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><circle cx="852" cy="295" r="13" fill="#0891b2"/><text x="852" y="299" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">QA</text><text x="876" y="292" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Quality</text><text x="876" y="311" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Parallel · deadline 3 days</text><rect x="822" y="350" width="306" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><circle cx="852" cy="385" r="13" fill="#7c3aed"/><text x="852" y="389" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">CO</text><text x="876" y="382" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Compliance</text><text x="876" y="401" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Parallel · deadline 3 days</text><text x="975" y="440" font-size="11.5" font-weight="600" fill="#9d174d" text-anchor="middle">Reminders and escalation on overdue steps</text><path d="M650 262 C 650 320, 150 320, 150 266" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrA)"/><rect x="330" y="300" width="180" height="28" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="1"/><text x="420" y="319" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Changes requested</text><line x1="975" y1="452" x2="975" y2="500" stroke="#be185d" stroke-width="2.5"  marker-end="url(#arrA)"/><rect x="800" y="506" width="350" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="800" y="506" width="350" height="6" rx="3" fill="#10b981"/><circle cx="830" cy="544" r="16" fill="#10b981"/><text x="830" y="549" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="856" y="549" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Approved · publish</text><text x="818" y="578" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Becomes the current version; the previous</text><text x="818" y="595" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">version is kept in history</text><path d="M800 300 C 700 300, 700 560, 560 560" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="300" y="506" width="250" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="300" y="506" width="250" height="6" rx="3" fill="#ef4444"/><circle cx="330" cy="544" r="16" fill="#ef4444"/><text x="330" y="549" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">✕</text><text x="356" y="549" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Rejected</text><text x="318" y="578" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Returns to the author with notes</text><rect x="50" y="670" width="1100" height="110" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="74" y="704" font-size="11.5" font-weight="800" fill="#9d174d" text-anchor="start" letter-spacing="1.2">6  STATUS DASHBOARD</text><text x="74" y="744" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">12</text><rect x="116" y="725" width="64.19999999999999" height="20" rx="10" fill="#fef3c7"/><text x="148.1" y="739" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Pending</text><text x="344" y="744" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">3</text><rect x="374" y="725" width="64.19999999999999" height="20" rx="10" fill="#fee2e2"/><text x="406.1" y="739" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Overdue</text><text x="614" y="744" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">148</text><rect x="668" y="725" width="143.39999999999998" height="20" rx="10" fill="#d1fae5"/><text x="739.7" y="739" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">Approved this month</text><text x="884" y="744" font-size="22" font-weight="800" fill="#0f172a" text-anchor="start">2.4 days</text><rect x="998" y="725" width="117" height="20" rx="10" fill="#fce7f3"/><text x="1056.5" y="739" font-size="11" font-weight="700" fill="#be185d" text-anchor="middle">Avg. cycle time</text><text x="600" y="806" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Every decision is recorded with approver, time and comments, and stays attached to the version.</text>
</svg>
