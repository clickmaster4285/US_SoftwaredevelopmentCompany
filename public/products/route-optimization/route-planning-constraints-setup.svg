" fill="#f5f3ff" /><text x="320" y="187" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">26 ft box truck × 4</text><text x="320" y="208" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">12 pallets · 10,000 lb · liftgate</text><rect x="304" y="234" width="508" height="60" rx="10" fill="#f5f3ff" /><text x="320" y="259" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Refrigerated van × 2</text><text x="320" y="280" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">6 pallets · 4,500 lb · 34-38°F</text><rect x="304" y="306" width="508" height="60" rx="10" fill="#f5f3ff" /><text x="320" y="331" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Cargo van × 3</text><text x="320" y="352" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">180 cu ft · 3,000 lb</text><text x="304" y="404" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Capacity checked by</text><rect x="470" y="386" width="69" height="24" rx="12" fill="#ede9fe" /><text x="504.5" y="402" font-size="11.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Pallets</text><rect x="546" y="386" width="62" height="24" rx="12" fill="#ede9fe" /><text x="577" y="402" font-size="11.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Weight</text><rect x="624" y="386" width="62" height="24" rx="12" fill="#f1f5f9" /><text x="655" y="402" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">Volume</text><text x="304" y="452" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">Start / end</text><rect x="470" y="430" width="342" height="36" rx="9" fill="#fff" stroke="#e2e8f0"/><text x="484" y="453" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Assigned depot · return to depot</text><rect x="860" y="100" width="550" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="888" y="138" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Driver rules</text><text x="888" y="186" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Shift length</text><rect x="1112" y="162" width="274" height="36" rx="9" fill="#fff" stroke="#e2e8f0"/><text x="1126" y="185" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Max 10 h</text><text x="888" y="242" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Break</text><rect x="1112" y="218" width="274" height="36" rx="9" fill="#fff" stroke="#e2e8f0"/><text x="1126" y="241" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">30 min after 5 h on duty</text><text x="888" y="298" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Overtime</text><rect x="1112" y="274" width="274" height="36" rx="9" fill="#fff" stroke="#e2e8f0"/><text x="1126" y="297" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Avoid · penalty weight high</text><text x="888" y="354" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Max stops per route</text><rect x="1112" y="330" width="274" height="36" rx="9" fill="#fff" stroke="#e2e8f0"/><text x="1126" y="353" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">28</text><text x="888" y="410" font-size="13.5" font-weight="500" fill="#64748b" text-anchor="start">Skills</text><rect x="1112" y="386" width="274" height="36" rx="9" fill="#fff" stroke="#e2e8f0"/><text x="1126" y="409" font-size="13" font-weight="600" fill="#0f172a" text-anchor="start">Liftgate, cold chain, hazmat-certified</text><rect x="280" y="504" width="556" height="372" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="304" y="542" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Stop rules</text><text x="304" y="580" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Respect time windows</text><text x="304" y="600" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Hard for restaurants · soft for offices</text><rect x="766" y="566" width="46" height="26" rx="13" fill="#7c3aed" /><circle cx="799" cy="579" r="10" fill="#fff"/><text x="304" y="638" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Service time from order size</text><text x="304" y="658" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">5 min + 2 min per pallet</text><rect x="766" y="624" width="46" height="26" rx="13" fill="#7c3aed" /><circle cx="799" cy="637" r="10" fill="#fff"/><text x="304" y="696" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Priority stops first</text><text x="304" y="716" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Medical and same-day orders</text><rect x="766" y="682" width="46" height="26" rx="13" fill="#7c3aed" /><circle cx="799" cy="695" r="10" fill="#fff"/><text x="304" y="754" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Allow split deliveries</text><text x="304" y="774" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Keep each order on one truck</text><rect x="766" y="740" width="46" height="26" rx="13" fill="#e2e8f0" /><circle cx="779" cy="753" r="10" fill="#fff"/><text x="304" y="812" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Pickup and delivery pairs</text><text x="304" y="832" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Returns collected on the same route</text><rect x="766" y="798" width="46" height="26" rx="13" fill="#7c3aed" /><circle cx="799" cy="811" r="10" fill="#fff"/><rect x="860" y="504" width="550" height="372" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#sh)"/><text x="888" y="542" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Optimization objective</text><circle cx="898" cy="572" r="9" fill="#fff" stroke="#7c3aed" stroke-width="2"/><circle cx="898" cy="572" r="5" fill="#7c3aed"/><text x="918" y="577" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Minimize total drive time</text><circle cx="898" cy="618" r="9" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="918" y="623" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">Minimize total miles</text><circle cx="898" cy="664" r="9" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="918" y="669" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">Use the fewest vehicles</text><circle cx="898" cy="710" r="9" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="918" y="715" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">Balance stops across drivers</text><circle cx="898" cy="756" r="9" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><text x="918" y="761" font-size="13.5" font-weight="500" fill="#0f172a" text-anchor="start">Lowest cost (time + miles + vehicle)</text><rect x="888" y="808" width="498" height="44" rx="10" fill="#ede9fe" /><text x="904" y="835" font-size="12.5" font-weight="600" fill="#6d28d9" text-anchor="start">Secondary goal: balance workload within 10% across routes</text>
