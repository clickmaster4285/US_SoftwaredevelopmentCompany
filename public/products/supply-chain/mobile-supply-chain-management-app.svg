<rect x="0" y="0" width="1440" height="900" rx="0" fill="#eef6f7"/><circle cx="210" cy="170" r="220" fill="#cffafe" opacity="0.8"/><circle cx="1250" cy="780" r="240" fill="#cffafe" opacity="0.5"/><text x="720" y="56" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Approve and respond on the go</text><text x="720" y="84" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Purchase order approvals and shipment alerts on mobile · illustrative concept</text><rect x="240" y="140" width="320" height="680" rx="44" fill="#0a1b1f" filter="url(#sh2)"/><rect x="252" y="152" width="296" height="656" rx="34" fill="#fbfdfd"/><rect x="350" y="162" width="100" height="20" rx="10" fill="#0a1b1f"/><text x="270" y="224" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Approval needed</text><text x="270" y="246" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">REQ-918 · from Procurement</text><rect x="270" y="264" width="260" height="126" rx="16" fill="url(#banner)"/><text x="288" y="294" font-size="10.5" font-weight="800" fill="#a5f3fc" text-anchor="start" letter-spacing="1.1">SUPPLIER E · RAW MATERIALS</text><text x="288" y="334" font-size="30" font-weight="700" fill="#fff" text-anchor="start">$18,400</text><text x="288" y="362" font-size="12" font-weight="500" fill="#cffafe" text-anchor="start">Rule: $5K–$50K → finance</text><text x="270" y="424" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Item</text><text x="530" y="424" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end">Resin pellets · 8 t</text><line x1="270" y1="438" x2="530" y2="438" stroke="#e2e8f0"/><text x="270" y="468" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Needed by</text><text x="530" y="468" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end">Dec 4 · Plant-1</text><line x1="270" y1="482" x2="530" y2="482" stroke="#e2e8f0"/><text x="270" y="512" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Budget</text><text x="530" y="512" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end">OPS-2026 · 62% used</text><line x1="270" y1="526" x2="530" y2="526" stroke="#e2e8f0"/><text x="270" y="556" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Supplier OTIF</text><text x="530" y="556" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="end">84% · 90 days</text><line x1="270" y1="570" x2="530" y2="570" stroke="#e2e8f0"/><rect x="270" y="616" width="260" height="46" rx="12" fill="#0e7490"/><text x="400" y="645" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Approve</text><rect x="270" y="674" width="124" height="42" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="332" y="701" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Reject</text><rect x="406" y="674" width="124" height="42" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><text x="468" y="701" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">Comment</text><rect x="640" y="140" width="320" height="680" rx="44" fill="#0a1b1f" filter="url(#sh2)"/><rect x="652" y="152" width="296" height="656" rx="34" fill="#fbfdfd"/><rect x="750" y="162" width="100" height="20" rx="10" fill="#0a1b1f"/><text x="670" y="224" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Alerts</text><text x="670" y="246" font-size="12" font-weight="500" fill="#64748b" text-anchor="start">Prioritized by impact</text><rect x="670" y="268" width="260" height="96" rx="14" fill="#fee2e2"/><text x="684" y="294" font-size="13.5" font-weight="800" fill="#b91c1c" text-anchor="start">Shipment delayed</text><text x="684" y="316" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">SH-2207 · ETA Dec 1 (+4 d)</text><text x="684" y="336" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">14 customer orders affected</text><text x="916" y="294" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">5m</text><rect x="670" y="376" width="260" height="96" rx="14" fill="#fef3c7"/><text x="684" y="402" font-size="13.5" font-weight="800" fill="#b45309" text-anchor="start">PO unconfirmed</text><text x="684" y="424" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">PO-4126 · Supplier E · 52 h</text><text x="684" y="444" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Reminder sent to supplier</text><text x="916" y="402" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">1h</text><rect x="670" y="484" width="260" height="96" rx="14" fill="#fef3c7"/><text x="684" y="510" font-size="13.5" font-weight="800" fill="#b45309" text-anchor="start">Below safety stock</text><text x="684" y="532" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">SKU-1001 · DC-West</text><text x="684" y="552" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Transfer suggested from DC-East</text><text x="916" y="510" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">2h</text><rect x="670" y="592" width="260" height="96" rx="14" fill="#d1fae5"/><text x="684" y="618" font-size="13.5" font-weight="800" fill="#047857" text-anchor="start">Delivered</text><text x="684" y="640" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">SO-7730 · Customer 18</text><text x="684" y="660" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Proof of delivery received</text><text x="916" y="618" font-size="11" font-weight="500" fill="#64748b" text-anchor="end">4h</text><rect x="1030" y="230" width="320" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="1030" y="230" width="6" height="120" rx="3" fill="#0e7490"/><text x="1054" y="268" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">One-tap approvals</text><text x="1054" y="294" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Rules decide who approves; mobile</text><text x="1054" y="312" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">removes the wait.</text><rect x="1030" y="380" width="320" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="1030" y="380" width="6" height="120" rx="3" fill="#0e7490"/><text x="1054" y="418" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Impact-first alerts</text><text x="1054" y="444" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Exceptions are ranked by customer</text><text x="1054" y="462" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">orders and production affected.</text><rect x="1030" y="530" width="320" height="120" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="1030" y="530" width="6" height="120" rx="3" fill="#0e7490"/><text x="1054" y="568" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Same data as the desktop</text><text x="1054" y="594" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">Approvals and alerts come from the</text><text x="1054" y="612" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start">shared supply chain record.</text>
</svg>
