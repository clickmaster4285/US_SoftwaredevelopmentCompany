<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Mobile supply chain management app showing purchase order approvals and shipment delay notifications" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
