<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="End-to-end supply chain workflow from supplier sourcing and purchasing through production, warehousing, distribution and delivery" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>End-to-end supply chain workflow from supplier sourcing and purchasing through production, warehousing, distribution and delivery</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#072a31" flood-opacity="0.14"/></filter>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e7490" stop-opacity="0.24"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#155e75"/></linearGradient>
<linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#164e63"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7490"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="820" rx="0" fill="#ffffff"/><text x="600" y="52" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">End-to-end supply chain workflow</text><text x="600" y="82" font-size="14.5" font-weight="500" fill="#64748b" text-anchor="middle">From supplier to customer, with performance data feeding the next cycle</text><rect x="60" y="140" width="160" height="250" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="60" y="140" width="160" height="6" rx="3" fill="#7c3aed"/><circle cx="140" cy="192" r="24" fill="#7c3aed"/><text x="140" y="198" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="140" y="246" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">Source</text><text x="140" y="270" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Qualify and onboard</text><text x="140" y="287" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">suppliers</text><rect x="72" y="312" width="136" height="26" rx="8" fill="#f8fafc"/><text x="140" y="330" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">Supplier records</text><rect x="72" y="346" width="136" height="26" rx="8" fill="#f8fafc"/><text x="140" y="364" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">Documents, terms</text><line x1="223" y1="265" x2="241" y2="265" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="244" y="140" width="160" height="250" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="244" y="140" width="160" height="6" rx="3" fill="#0e7490"/><circle cx="324" cy="192" r="24" fill="#0e7490"/><text x="324" y="198" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="324" y="246" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">Buy</text><text x="324" y="270" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Requisition → PO →</text><text x="324" y="287" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">confirm</text><rect x="256" y="312" width="136" height="26" rx="8" fill="#f8fafc"/><text x="324" y="330" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">Approvals</text><rect x="256" y="346" width="136" height="26" rx="8" fill="#f8fafc"/><text x="324" y="364" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">PO confirmations</text><line x1="407" y1="265" x2="425" y2="265" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="428" y="140" width="160" height="250" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="428" y="140" width="160" height="6" rx="3" fill="#db2777"/><circle cx="508" cy="192" r="24" fill="#db2777"/><text x="508" y="198" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="508" y="246" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">Plan</text><text x="508" y="270" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Forecast, supply,</text><text x="508" y="287" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">replenish</text><rect x="440" y="312" width="136" height="26" rx="8" fill="#f8fafc"/><text x="508" y="330" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">Demand plan</text><rect x="440" y="346" width="136" height="26" rx="8" fill="#f8fafc"/><text x="508" y="364" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">Material needs</text><line x1="591" y1="265" x2="609" y2="265" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="612" y="140" width="160" height="250" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="612" y="140" width="160" height="6" rx="3" fill="#f59e0b"/><circle cx="692" cy="192" r="24" fill="#f59e0b"/><text x="692" y="198" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="692" y="246" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">Make</text><text x="692" y="270" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Material</text><text x="692" y="287" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">availability</text><rect x="624" y="312" width="136" height="26" rx="8" fill="#f8fafc"/><text x="692" y="330" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">Work orders</text><rect x="624" y="346" width="136" height="26" rx="8" fill="#f8fafc"/><text x="692" y="364" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">Finished goods</text><line x1="775" y1="265" x2="793" y2="265" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="796" y="140" width="160" height="250" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="796" y="140" width="160" height="6" rx="3" fill="#10b981"/><circle cx="876" cy="192" r="24" fill="#10b981"/><text x="876" y="198" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="876" y="246" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">Store</text><text x="876" y="270" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Inventory and</text><text x="876" y="287" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">warehouses</text><rect x="808" y="312" width="136" height="26" rx="8" fill="#f8fafc"/><text x="876" y="330" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">Stock by DC</text><rect x="808" y="346" width="136" height="26" rx="8" fill="#f8fafc"/><text x="876" y="364" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">Inbound receipts</text><line x1="959" y1="265" x2="977" y2="265" stroke="#0e7490" stroke-width="2.5" marker-end="url(#arrA)"/><rect x="980" y="140" width="160" height="250" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh2)"/><rect x="980" y="140" width="160" height="6" rx="3" fill="#0f766e"/><circle cx="1060" cy="192" r="24" fill="#0f766e"/><text x="1060" y="198" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="1060" y="246" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">Deliver</text><text x="1060" y="270" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Fulfill, ship,</text><text x="1060" y="287" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">confirm</text><rect x="992" y="312" width="136" height="26" rx="8" fill="#f8fafc"/><text x="1060" y="330" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">Shipments, ETAs</text><rect x="992" y="346" width="136" height="26" rx="8" fill="#f8fafc"/><text x="1060" y="364" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">Proof of delivery</text><rect x="60" y="450" width="1080" height="120" rx="20" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/><circle cx="110" cy="510" r="24" fill="#155e75"/><text x="110" y="516" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">7</text><text x="150" y="500" font-size="19" font-weight="700" fill="#0f172a" text-anchor="start">Measure</text><text x="150" y="524" font-size="13" font-weight="500" fill="#64748b" text-anchor="start">KPIs, analytics and exception alerts across the whole chain</text><rect x="620" y="481" width="44.4" height="20" rx="10" fill="#cffafe"/><text x="642.2" y="495" font-size="11" font-weight="700" fill="#0e7490" text-anchor="middle">OTIF</text><rect x="760" y="481" width="103.8" height="20" rx="10" fill="#cffafe"/><text x="811.9" y="495" font-size="11" font-weight="700" fill="#0e7490" text-anchor="middle">PO cycle time</text><rect x="900" y="481" width="130.2" height="20" rx="10" fill="#cffafe"/><text x="965.1" y="495" font-size="11" font-weight="700" fill="#0e7490" text-anchor="middle">Forecast accuracy</text><rect x="620" y="515" width="77.4" height="20" rx="10" fill="#cffafe"/><text x="658.7" y="529" font-size="11" font-weight="700" fill="#0e7490" text-anchor="middle">Fill rate</text><rect x="760" y="515" width="123.6" height="20" rx="10" fill="#cffafe"/><text x="821.8" y="529" font-size="11" font-weight="700" fill="#0e7490" text-anchor="middle">On-time delivery</text><path d="M1100 392 C 1100 430, 1100 430, 1100 446" stroke="#0e7490" stroke-width="2.5" fill="none" marker-end="url(#arrA)"/><path d="M100 446 C 100 420, 100 420, 100 394" stroke="#0e7490" stroke-width="2.5" fill="none" stroke-dasharray="6 5" marker-end="url(#arrA)"/><text x="116" y="428" font-size="12" font-weight="600" fill="#155e75" text-anchor="start">Scorecards and actuals feed the next plan</text><rect x="150" y="620" width="900" height="120" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="600" y="660" font-size="14.5" font-weight="600" fill="#0f172a" text-anchor="middle">Each team sees the status of the step before theirs and the impact on the step after.</text><text x="600" y="690" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Events such as “PO confirmed”, “ASN received”, “shipment delayed” and “goods received” update one shared picture.</text><text x="600" y="716" font-size="12.5" font-weight="500" fill="#94a3b8" text-anchor="middle">How current it is depends on how quickly systems and partners send data.</text>
</svg>
