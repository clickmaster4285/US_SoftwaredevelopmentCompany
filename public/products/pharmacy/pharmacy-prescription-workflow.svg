<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" role="img" aria-label="Prescription workflow in a pharmacy management system from e-prescription intake to pickup and inventory update" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Prescription workflow in a pharmacy management system from e-prescription intake to pickup and inventory update</title>
<defs>
<filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/></filter>
<filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#022c22" flood-opacity="0.13"/></filter>
<filter id="sh3" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#022c22" flood-opacity="0.28"/></filter>
<linearGradient id="areaT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#059669" stop-opacity="0.22"/><stop offset="1" stop-color="#059669" stop-opacity="0"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#047857"/></linearGradient>
<linearGradient id="banner" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#064e3b"/><stop offset="1" stop-color="#047857"/></linearGradient>
<linearGradient id="room" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f4f1"/><stop offset="1" stop-color="#cfe7e2"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
<marker id="arrT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="600" rx="0" fill="#ffffff" />
<text x="700" y="54" font-size="25" font-weight="700" fill="#0f172a" text-anchor="middle" >How a prescription moves through a pharmacy management system</text><text x="700" y="84" font-size="15" font-weight="500" fill="#64748b" text-anchor="middle" >Nine steps, one record. Every step carries a timestamp and user ID.</text><rect x="58" y="128" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="58" y="128" width="228" height="6" rx="3" fill="#0284c7" /><circle cx="90" cy="166" r="16" fill="#0284c7"/><text x="90" y="171.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="116" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Intake</text><text x="80" y="206" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >e-Rx or scanned paper,</text><text x="80" y="225" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >patient matched</text><path d="M290 187h26" stroke="#059669" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="322" y="128" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="322" y="128" width="228" height="6" rx="3" fill="#0284c7" /><circle cx="354" cy="166" r="16" fill="#0284c7"/><text x="354" y="171.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="380" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Data entry</text><text x="344" y="206" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >NDC, sig, quantity,</text><text x="344" y="225" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >days' supply, refills</text><path d="M554 187h26" stroke="#059669" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="586" y="128" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="586" y="128" width="228" height="6" rx="3" fill="#4f46e5" /><circle cx="618" cy="166" r="16" fill="#4f46e5"/><text x="618" y="171.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="644" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >DUR check</text><text x="608" y="206" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >Interactions, allergies,</text><text x="608" y="225" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >duplicates, dose</text><path d="M818 187h26" stroke="#059669" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="850" y="128" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="850" y="128" width="228" height="6" rx="3" fill="#4f46e5" /><circle cx="882" cy="166" r="16" fill="#4f46e5"/><text x="882" y="171.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="908" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Claim</text><text x="872" y="206" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >PBM answers in seconds:</text><text x="872" y="225" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >paid, copay or reject</text><path d="M1082 187h26" stroke="#059669" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="1114" y="128" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="1114" y="128" width="228" height="6" rx="3" fill="#d97706" /><circle cx="1146" cy="166" r="16" fill="#d97706"/><text x="1146" y="171.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >5</text><text x="1172" y="172" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Verification</text><text x="1136" y="206" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >Pharmacist reviews</text><text x="1136" y="225" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >entry, DUR and claim</text><rect x="1114" y="312" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="1114" y="312" width="228" height="6" rx="3" fill="#059669" /><circle cx="1146" cy="350" r="16" fill="#059669"/><text x="1146" y="355.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >6</text><text x="1172" y="356" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Fill &amp; scan</text><text x="1136" y="390" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >Stock barcode must</text><text x="1136" y="409" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >match verified NDC</text><path d="M1110 371h-26" stroke="#059669" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="850" y="312" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="850" y="312" width="228" height="6" rx="3" fill="#d97706" /><circle cx="882" cy="350" r="16" fill="#d97706"/><text x="882" y="355.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >7</text><text x="908" y="356" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Final check</text><text x="872" y="390" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >Pharmacist checks,</text><text x="872" y="409" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >bag to will-call bin</text><path d="M846 371h-26" stroke="#059669" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="586" y="312" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="586" y="312" width="228" height="6" rx="3" fill="#9333ea" /><circle cx="618" cy="350" r="16" fill="#9333ea"/><text x="618" y="355.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >8</text><text x="644" y="356" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Pickup &amp; POS</text><text x="608" y="390" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >ID, copay, signature,</text><text x="608" y="409" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >counseling offered</text><path d="M582 371h-26" stroke="#059669" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="322" y="312" width="228" height="118" rx="18" fill="#fff" stroke="#e2e8f0" filter="url(#sh2)"/><rect x="322" y="312" width="228" height="6" rx="3" fill="#16a34a" /><circle cx="354" cy="350" r="16" fill="#16a34a"/><text x="354" y="355.5" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >9</text><text x="380" y="356" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start" >Inventory update</text><text x="344" y="390" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >Stock deducted; reorder</text><text x="344" y="409" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="start" >if below the point</text><path d="M1228 252V302" stroke="#059669" stroke-width="2.5" marker-end="url(#arrT)"/><rect x="58" y="312" width="228" height="118" rx="18" fill="url(#core)" filter="url(#sh2)"/><path transform="translate(80 334) scale(1.2)" d="M9 1.5l6.5 2.5v5c0 4-3 6.5-6.5 7.5C5.5 15.5 2.5 13 2.5 9V4zM6 9l2 2 4-4" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="352" font-size="15.5" font-weight="700" fill="#fff" text-anchor="start" >Audit trail</text><text x="80" y="390" font-size="12.5" font-weight="500" fill="#d1fae5" text-anchor="start" >Who did what, and when,</text><text x="80" y="409" font-size="12.5" font-weight="500" fill="#d1fae5" text-anchor="start" >for every prescription</text><rect x="58" y="470" width="1284" height="82" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><text x="82" y="502" font-size="11" font-weight="800" fill="#94a3b8" text-anchor="start" letter-spacing="1.6">CONNECTED ALONG THE WAY</text><rect x="82" y="516" width="4" height="26" rx="2" fill="#0284c7" /><text x="96" y="528" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >e-Rx network</text><text x="96" y="544" font-size="11.5" font-weight="600" fill="#0284c7" text-anchor="start" >NCPDP SCRIPT</text><rect x="332" y="516" width="4" height="26" rx="2" fill="#4f46e5" /><text x="346" y="528" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >Drug database</text><text x="346" y="544" font-size="11.5" font-weight="600" fill="#4f46e5" text-anchor="start" >DUR screening</text><rect x="582" y="516" width="4" height="26" rx="2" fill="#4f46e5" /><text x="596" y="528" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >PBM via claims switch</text><text x="596" y="544" font-size="11.5" font-weight="600" fill="#4f46e5" text-anchor="start" >NCPDP Telecom</text><rect x="832" y="516" width="4" height="26" rx="2" fill="#9333ea" /><text x="846" y="528" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >Payment gateway</text><text x="846" y="544" font-size="11.5" font-weight="600" fill="#9333ea" text-anchor="start" >PCI DSS</text><rect x="1082" y="516" width="4" height="26" rx="2" fill="#16a34a" /><text x="1096" y="528" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start" >State PDMP</text><text x="1096" y="544" font-size="11.5" font-weight="600" fill="#16a34a" text-anchor="start" >Controlled Rx data</text>
</svg>